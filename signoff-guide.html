<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign-off guide</title>
<meta name="theme-color" content="#0d0c0a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#16202f;--mute:#667085;--line:#e4e7ec;--brand:#11203b;--accent:#b08d57;--blue:#2563eb;--green:#16794a;--red:#c0392b;--amber:#b7791f}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header h1{font-size:18px;margin:0}header h1 span{color:var(--accent)}.sp{flex:1}
header a{color:#fff;border:1px solid #ffffff44;border-radius:8px;padding:5px 11px;font-size:13px;text-decoration:none}
main{max-width:980px;margin:auto;padding:16px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
h2{margin:0 0 4px;font-size:19px}h3{margin:10px 0 4px;font-size:16px;color:var(--brand)}.mute{color:var(--mute);font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 3px}input,select,textarea{font:inherit;width:100%;border:1px solid #b8c0cc;border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}textarea{min-height:90px}
button{font:inherit;border:1px solid #b8c0cc;background:#fff;color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}button.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.note{background:#eef3fb;border-left:3px solid var(--blue);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.cof{background:#faf5ea;border-left:3px solid var(--accent);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.fb{border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}.fb.good{background:#e8f5ee;border:1px solid #9fd3b6}.fb.mid{background:#fdf3e1;border:1px solid #e6c98a}.fb.low{background:#fbeceb;border:1px solid #e3a8a2}
pre{white-space:pre-wrap;word-break:break-word;font:14px/1.5 ui-monospace,monospace;background:#f7f8fb;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:14px;vertical-align:top}
ol,ul{margin:6px 0 6px 20px;padding:0}li{margin:3px 0}.opt{display:block;width:100%;text-align:left;margin:6px 0}
</style><!--BRAND--><link rel="stylesheet" href="brand.css"><!--/BRAND-->
</head><body>
<header><h1>Sign-off guide <span>say what you tested and what you recommend</span></h1><span class="sp"></span><a href="expected-result.html">Expected result coach</a><a href="tickets.html">Tickets</a><a href="index.html">Home</a></header>
<main><div class="tabs" id="tabs"></div><div id="v"></div></main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='signoff-v1';let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}S.tab=S.tab||'learn';S.f=S.f||{};S.sc=S.sc||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const TABS=[['learn','1 What a sign-off is'],['build','2 Build mine'],['examples','3 Good and weak examples'],['decide','4 Practise the decision'],['rate','5 Rate my sign-off']];
function tabs(){$('tabs').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${S.tab===t[0]?'on':''}">${t[1]}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();draw()})}

function learn(){return `<div class="card"><h2>Start here: what is a sign-off?</h2>
<p><b>Plain version:</b> a sign-off is a short message that says: "I tested this, here is what I found, and here is my recommendation." It is written for someone who was not there, usually the owner or manager, who has to decide whether the app can be used.</p>
<div class="cof"><b>Coffee analogy:</b> before a new blend goes on the shelf, you tell the owner: "I tasted batch 12, 18 cups. 16 were great, 2 were bitter, both from the same grinder setting. I would sell it once the grinder is fixed." That is a sign-off. It has what you did, the numbers, the problems, and your advice.</div></div>
<div class="card"><h2>Why you struggle with it (and why that is normal)</h2><p>Most beginners write "Tested everything, all good" or list every test. The reader does not want a diary. They want a <b>decision</b> backed by <b>evidence</b>. You are not saying the app is perfect. You are saying what is known.</p></div>
<div class="card"><h2>The 7 parts, in this order</h2><ol>
<li><b>What was tested:</b> the app or feature, and what was left out of scope.</li>
<li><b>Where and when:</b> version or build, environment (staging, not live), date, your name.</li>
<li><b>Results in numbers:</b> how many tests, passed, failed, blocked.</li>
<li><b>Open defects:</b> count by severity, and name the serious ones in plain words.</li>
<li><b>Not tested or risks:</b> what you did not cover and why.</li>
<li><b>Recommendation:</b> one of three: Approve, Approve with conditions, or Do not approve.</li>
<li><b>Next step:</b> who must do what before release, or what happens after approval.</li></ol></div>
<div class="card"><h2>How to choose the recommendation</h2><table><tr><th>If</th><th>Recommend</th></tr>
<tr><td>Any open Critical defect (money wrong, data lost, security or privacy broken, main task impossible)</td><td><b>Do not approve</b></td></tr>
<tr><td>No Critical, but Major defects remain or important areas were not tested</td><td><b>Approve with conditions</b> (name the conditions)</td></tr>
<tr><td>No Critical or Major, only Minor, and the planned tests are done</td><td><b>Approve</b> (list the minor issues)</td></tr></table>
<p class="mute">A tester gives a recommendation, the owner makes the decision. Never hide a defect to get an approval.</p></div>
<div class="card"><h2>Three habits</h2><ul><li>Numbers first, then words. "16 of 18 passed" beats "mostly good".</li><li>Name the risk even when it is awkward. A hidden risk is the one that hurts later.</li><li>Keep it to one screen. Details live in the defect list.</li></ul></div>`}

function field(id,lab,type,ph){return `<div><label for="${id}">${lab}</label><input id="${id}" type="${type||'text'}" placeholder="${ph||''}" value="${esc(S.f[id]||'')}"></div>`}
function build(){return `<div class="card"><h2>Build your sign-off</h2><p class="mute">Fill in what you know after finishing an app. The page writes a sign-off you can edit and copy. Nothing leaves this device.</p>
<div class="g2">${field('app','App tested','text','e.g. Clinic booking practice app')}${field('ver','Version or build','text','e.g. Staging build 14')}${field('who','Your name','text')}${field('date','Date','date')}</div>
<label for="scope">What you tested (scope)</label><textarea id="scope" placeholder="e.g. Login, booking, diary, dashboard and patient search.">${esc(S.f.scope||'')}</textarea>
<h3>Test results</h3><div class="g3">${field('tot','Tests run','number')}${field('pass','Passed','number')}${field('fail','Failed','number')}${field('blk','Blocked','number')}</div>
<h3>Open defects</h3><div class="g3">${field('dcrit','Critical','number')}${field('dmaj','Major','number')}${field('dmin','Minor','number')}</div>
<label for="dnames">Name the serious defects in plain words</label><textarea id="dnames" placeholder="e.g. Doctor sees patients of other doctors (Critical). Cancelled appointment does not lower the dashboard count (Major).">${esc(S.f.dnames||'')}</textarea>
<label for="risk">Not tested, or risks</label><textarea id="risk" placeholder="e.g. Not tested on a real phone. Walk-in patients not covered.">${esc(S.f.risk||'')}</textarea>
<label for="rec">Recommendation</label><select id="rec"><option value="">Suggest one for me</option><option>Approve</option><option>Approve with conditions</option><option>Do not approve</option></select>
<label for="next">Next step</label><input id="next" placeholder="e.g. Developer fixes the 2 serious defects, then I retest those areas." value="${esc(S.f.next||'')}">
<div class="row"><button class="pri" id="gen">Write my sign-off</button><button id="cp">Copy</button><button id="clr">Clear form</button></div><div id="out"></div></div>`}
function num(id){const v=parseInt(($(id)||{}).value,10);return isNaN(v)?null:v}
function suggest(){const c=num('dcrit')||0,m=num('dmaj')||0,r=($('risk').value||'').trim();return c>0?'Do not approve':(m>0||r)?'Approve with conditions':'Approve'}
function generate(){['app','ver','who','date','scope','tot','pass','fail','blk','dcrit','dmaj','dmin','dnames','risk','next'].forEach(i=>S.f[i]=$(i).value);S.f.next=$('next').value;save();
 const miss=[];const g=i=>($(i).value||'').trim();if(!g('app'))miss.push('app name');if(num('tot')==null)miss.push('tests run');if(num('pass')==null)miss.push('passed');if(num('fail')==null)miss.push('failed');
 if(miss.length){$('out').innerHTML='<div class="fb low">Fill in: '+miss.join(', ')+'. A sign-off needs numbers.</div>';return}
 const tot=num('tot'),p=num('pass'),f=num('fail'),b=num('blk')||0;let warn='';if(p+f+b!==tot)warn=`<div class="fb mid">Check your numbers: ${p} passed + ${f} failed + ${b} blocked = ${p+f+b}, but you wrote ${tot} tests run.</div>`;
 const c=num('dcrit')||0,m=num('dmaj')||0,n=num('dmin')||0;const rec=$('rec').value||suggest();const pct=tot?Math.round(p/tot*100):0;
 const sev=`${c} Critical, ${m} Major, ${n} Minor`;
 let why=rec==='Approve'?'No Critical or Major defects are open and the planned tests are complete.':rec==='Do not approve'?(c>0?c+' Critical defect'+(c>1?'s are':' is')+' still open.':'The risk is too high to release as it stands.'):'No Critical defect is open, but the items below must be handled first.';
 const txt=`SIGN-OFF: ${g('app')}
Tested by ${g('who')||'(name)'} on ${g('date')||'(date)'}${g('ver')?' | Version: '+g('ver'):''}

1. Scope: ${g('scope')||'(state what was covered and what was not)'}

2. Results: ${tot} tests run. ${p} passed (${pct}%), ${f} failed, ${b} blocked.

3. Open defects: ${sev}.${g('dnames')?'\n   '+g('dnames'):''}

4. Not tested / risks: ${g('risk')||'None known.'}

5. Recommendation: ${rec.toUpperCase()}. ${why}

6. Next step: ${g('next')||'(who does what, by when)'}`;
 $('out').innerHTML=warn+`<h3>Your sign-off</h3><pre id="txt">${esc(txt)}</pre><div class="note">Suggested rule used: any Critical = Do not approve; Major or risks = Approve with conditions; otherwise Approve. You can pick a different recommendation above if you can explain why.</div>`}
function buildBind(){$('rec').value=S.f.rec||'';$('rec').onchange=()=>{S.f.rec=$('rec').value;save()};$('gen').onclick=generate;
 $('cp').onclick=()=>{const t=$('txt');if(!t){$('out').innerHTML='<div class="fb low">Press Write my sign-off first.</div>';return}try{navigator.clipboard.writeText(t.textContent);$('cp').textContent='Copied'}catch(e){}setTimeout(()=>$('cp').textContent='Copy',1500)};
 $('clr').onclick=()=>{if(confirm('Clear the form?')){S.f={};save();draw()}}}

const GOOD=`SIGN-OFF: Clinic booking practice app
Tested by Keabetswe on 2026-11-26 | Version: Staging build 14

1. Scope: Login, booking, diary, dashboard and patient search. Not covered: the walk-in screen.
2. Results: 20 tests run. 14 passed (70%), 5 failed, 1 blocked.
3. Open defects: 1 Critical, 2 Major, 2 Minor.
   Critical: a Doctor can see patients assigned to other doctors.
   Major: cancelling an appointment does not lower the Dashboard Upcoming count; weekly filter shows monthly figures.
4. Not tested / risks: Not tried on a real phone. Walk-in patients are untested.
5. Recommendation: DO NOT APPROVE. One Critical privacy defect is still open.
6. Next step: Developer fixes the Critical defect, then I retest the patients list and the dashboard.`;
const WEAK=`Tested the clinic app. It works fine. Found a few small things. Good to go.`;
function examples(){return `<div class="card"><h2>A good sign-off</h2><pre>${esc(GOOD)}</pre>
<p><b>Why it is good:</b></p><ul><li>Numbers add up (14 + 5 + 1 = 20).</li><li>The serious defects are named in plain words, so the owner understands the risk.</li><li>It admits what was not tested.</li><li>The recommendation follows the rule (a Critical defect means Do not approve) and the next step says who does what.</li></ul></div>
<div class="card"><h2>A weak sign-off</h2><pre>${esc(WEAK)}</pre><p><b>What is wrong:</b></p><ul><li>No numbers: how many tests, how many failed?</li><li>"A few small things" hides what the defects are and how serious.</li><li>No scope, no version, no date, no name.</li><li>"Good to go" is not tied to any evidence. If something breaks later, nobody knows what was checked.</li></ul></div>
<div class="card"><h2>Useful sentences to borrow</h2><ul>
<li>"I ran 20 tests: 14 passed, 5 failed and 1 was blocked."</li><li>"One Critical defect is open: [plain description]."</li><li>"I did not test [area] because [reason]."</li><li>"I recommend approval on condition that [condition]."</li><li>"I will retest [fixed items] when the developer confirms the fix."</li></ul></div>`}

const SCEN=[
{t:'Booking app',d:'All 18 planned tests are done. 16 passed, 2 failed. Open defects: 0 Critical, 0 Major, 2 Minor (a spelling mistake and a button slightly misaligned). Everything in scope was tested.',a:'Approve',w:'No Critical or Major defects and the plan is complete, so Approve, and list the 2 minor issues.'},
{t:'Shop checkout',d:'20 tests run. 15 passed, 5 failed. One failure: the total charged is R30 lower than the cart total because delivery is left out. Open defects: 1 Critical (money wrong), 1 Major, 3 Minor.',a:'Do not approve',w:'A wrong amount charged is a Critical defect. Any open Critical means Do not approve until it is fixed and retested.'},
{t:'Stock app',d:'25 tests run. 22 passed, 2 failed, 1 blocked. Open defects: 0 Critical, 2 Major (waste total shows only the last entry; low-stock count does not update). The stock-take approval screen could not be tested because the Manager login was missing.',a:'Approve with conditions',w:'No Critical, but Major defects are open and one area was not tested. Recommend approval on condition the Majors are fixed and the approval screen is tested.'}];
function decide(){return SCEN.map((s,i)=>`<div class="card"><h3>Scenario ${i+1}: ${esc(s.t)} ${S.sc['s'+i]?'<span class="ok">done</span>':''}</h3><p>${esc(s.d)}</p><p><b>What do you recommend?</b></p>
<div class="g3">${['Approve','Approve with conditions','Do not approve'].map(o=>`<button data-s="${i}" data-o="${o}">${o}</button>`).join('')}</div><div id="sf${i}"></div></div>`).join('')}
function decideBind(){document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s,s=SCEN[i],ok=b.dataset.o===s.a;if(ok){S.sc['s'+i]=1;save()}
 $('sf'+i).innerHTML=`<div class="fb ${ok?'good':'low'}"><b>${ok?'Correct.':'Not quite.'}</b> ${esc(s.w)}${ok?'':' Correct answer: <b>'+s.a+'</b>.'}</div>`})}

const PARTS=[['Scope (what was tested)',/(scope|tested|covered|login|booking|checkout|screens?|features?|areas?)/i],['Version, date or tester',/(version|build|staging|environment|\b20\d\d-\d\d-\d\d\b|\b\d{1,2} (jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\w*|tested by)/i],['Results in numbers',/(\d+\s*(tests?|passed|failed|blocked|of \d+|%)|passed\b.*\d|\d.*\bpassed\b)/i],['Open defects with severity',/(critical|major|minor|defect|bug)/i],['Risks or what was not tested',/(not tested|untested|risk|limitation|not covered|outstanding|could not|did not test)/i],['A clear recommendation',/(approve|recommend|do not approve|no-go|go live|not ready|reject|accept)/i],['A next step',/(next step|retest|re-test|once|until|after the|condition|fix)/i]];
function rate(){return `<div class="card"><h2>Rate my sign-off</h2><p class="mute">Paste or type a sign-off you wrote. The page checks that all 7 parts are there. It cannot judge whether your decision is right, only whether the reader would get what they need.</p>
<textarea id="mine" style="min-height:170px" placeholder="Paste your sign-off here...">${esc(S.f.mine||'')}</textarea><div class="row"><button class="pri" id="rt">Check it</button></div><div id="rr"></div></div>`}
function rateBind(){$('rt').onclick=()=>{const t=$('mine').value;S.f.mine=t;save();if(t.trim().length<20){$('rr').innerHTML='<div class="fb low">Write or paste your sign-off first.</div>';return}
 const got=PARTS.map(p=>p[1].test(t));const n=got.filter(Boolean).length;const cls=n>=7?'good':n>=5?'mid':'low';let extra='';
 const nums=t.match(/\d+/g)||[];if(nums.length<3)extra+='<li>There are almost no numbers. Add how many tests were run, passed and failed.</li>';
 if(/\b(fine|good to go|all good|works|everything works|perfect)\b/i.test(t)&&!/(critical|major|minor)/i.test(t))extra+='<li>Words like "fine" or "good to go" need evidence next to them: numbers and defect counts.</li>';
 const m=t.match(/(\d+)\D{0,20}passed\D{0,20}(\d+)\D{0,20}failed/i);
 $('rr').innerHTML=`<div class="fb ${cls}"><b>${n} of 7 parts found.</b><ul>${PARTS.map((p,i)=>`<li>${got[i]?'<span class="ok">Found:</span>':'<span class="bad">Missing:</span>'} ${esc(p[0])}</li>`).join('')}</ul>${extra?'<b>Also:</b><ul>'+extra+'</ul>':''}${n>=7?'<p>Every part is there. Now read it once as the owner: could you decide from this message alone?</p>':'<p>Add the missing parts, then check again. The Build mine tab writes all 7 for you.</p>'}</div>`}}

function draw(){tabs();$('v').innerHTML=({learn,build,examples,decide,rate})[S.tab]();if(S.tab==='build')buildBind();if(S.tab==='decide')decideBind();if(S.tab==='rate')rateBind();window.scrollTo(0,0)}
draw();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script><script src="analogy.js"></script><script src="nav.js"></script><!--SYNC--><script src="sync.js"></script><!--/SYNC-->
</body></html>
