<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Query doctor | SQL Academy | UAT Lab</title><meta name="theme-color" content="#11203b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="sqa.css"><!--BRAND--><link rel="stylesheet" href="brand.css"><!--/BRAND--></head><body>
<main><h2 class="pt">Query doctor</h2><div id="intro"></div><div class="layout"><aside class="side" id="side" aria-label="Cases"></aside><div id="case"></div></div></main>
<script src="sql-wasm.js"></script><script src="sqa-dbs.js"></script><script src="sqa-doctor.js"></script><script src="sqa-core.js"></script>
<script>
SA.frame('sqa-doctor.html');const $=SA.$,esc=SA.esc,DR=window.DOCTOR;
$('intro').innerHTML=SA.startHere({plain:'Real jobs are mostly fixing queries that are wrong or slow. Each case gives you a broken query and a symptom. You repair it. Twelve cases give wrong answers; eight are about speed and indexes.',coffee:'A barista who makes a bad flat white does not throw the machine away. They taste it, work out what went wrong (too hot? too little milk?) and adjust one thing.',example:'-- Symptom: no rows come back\nSELECT name FROM customers WHERE city = NULL;\n-- Fix: nothing equals NULL\nSELECT name FROM customers WHERE city IS NULL;',exampleNote:'Run the broken query first, look at the symptom, then change one thing at a time.',steps:['Pick a case and press Run on the broken query to see the symptom.','Decide what is wrong. Change one thing and run again.','For speed cases press Show the plan: SCAN means the table is read in full, SEARCH means an index is used.','Press Check my fix, then read the explanation of the real cause.'],glossary:[['Query plan','The database\'s own description of how it will run a query.'],['SCAN','Reads every row of the table.'],['SEARCH','Uses an index to jump to the rows.'],['Sargable','A condition written so an index can be used.']]});
let cur=location.hash.slice(1);const ok=id=>(SA.get('doctor',id)||{}).ok;
const kindName={fix:'Wrong answer',sargable:'Slow: rewrite',index:'Slow: add an index'};
function side(){$('side').innerHTML=DR.map(d=>'<button class="'+(d.id===cur?'on ':'')+(ok(d.id)?'done':'')+'" data-id="'+d.id+'">'+esc(d.title)+'<br><span class="mute">'+kindName[d.kind]+'</span></button>').join('')+'<div class="mute" style="margin:8px 6px">'+SA.count('doctor')+' of '+DR.length+' fixed</div>'}
async function plan(d,script,sql){const db=await SA.open(d.db);if(d.setup)db.run(d.setup);if(script){const r=SA.exec(db,script);if(r.err){db.close();return{err:r.err}}}const r=SA.exec(db,'EXPLAIN QUERY PLAN '+sql);db.close();if(r.err)return{err:r.err};return{text:r.rows.map(x=>x[3]).join(' | ')}}
async function show(){const d=DR.find(x=>x.id===cur);if(!d){$('case').innerHTML='<div class="card">Pick a case from the list.</div>';return}
 $('case').innerHTML='<div class="card"><div class="row"><h2 style="margin:0">'+esc(d.title)+'</h2><span class="tag">'+kindName[d.kind]+'</span><span class="tag">'+DBS[d.db].title+'</span></div><p>'+d.story+'</p>'+(d.ordered?'<p class="mute">Row order matters.</p>':'')+(d.setup?'<p class="mute">The database already has: <code>'+esc(d.setup)+'</code></p>':'')+'<details class="g"><summary>Tables</summary><div id="sch">Loading...</div></details><h3>'+(d.kind==='index'?'The slow query (you will not change it)':'The broken query')+'</h3><pre class="code">'+esc(d.broken)+'</pre><h3>'+(d.kind==='index'?'Your index':'Your fix')+'</h3><div id="ed"></div><div class="row" style="margin-top:8px"><button id="chk" class="pri">Check my fix</button>'+(d.kind!=='index'?'<button id="pl">Show the plan</button>':'')+'<span class="sp"></span><button id="ans">Show a model fix</button></div><div id="fb"></div></div>';
 SA.schemaHTML(d.db).then(h=>{if($('sch'))$('sch').innerHTML=h});
 const ed=SA.editor($('ed'),{db:d.db,sql:d.kind==='index'?'':d.broken});
 if($('pl'))$('pl').onclick=async()=>{const p=await plan(d,null,ed.ta.value.replace(/;\s*$/,''));$('fb').innerHTML=p.err?'<div class="msg no">'+esc(p.err)+'</div>':'<div class="msg info"><b>Plan:</b> '+esc(p.text)+'</div>'};
 $('ans').onclick=()=>{$('fb').innerHTML='<div class="msg info"><b>One model fix:</b><pre class="code">'+esc(d.sol)+'</pre><b>What was wrong:</b> '+d.why+'</div>'};
 $('chk').onclick=async()=>{const user=ed.ta.value;$('fb').innerHTML='<div class="mute">Checking...</div>';let good=false,msg='';
  if(d.kind==='index'){const p=await plan(d,user,d.probe);if(p.err)msg='SQLite says: '+p.err;else if(!p.text.includes(d.expect))msg='The plan is still: '+p.text+'. It should say '+d.expect+'.';else if(d.forbid&&p.text.includes(d.forbid))msg='The plan still has a separate sort ('+p.text+').';else{good=true;msg='Correct. New plan: '+p.text}}
  else{
   const g=await grade2(d,user);if(!g.ok)msg=g.msg;else if(d.kind==='sargable'){const p=await plan(d,null,user.replace(/;\s*$/,''));if(p.err)msg=p.err;else if(!p.text.includes('SEARCH')||p.text.includes('SCAN '+d.table)){msg='The result is right, but the plan is: '+p.text+'. It must use the index (SEARCH).'}else{good=true;msg='Correct and fast. Plan: '+p.text}}else{good=true;msg=g.msg}}
  if(good)SA.set('doctor',d.id,{ok:true});side();$('fb').innerHTML='<div class="msg '+(good?'ok':'no')+'">'+esc(msg)+'</div>'+(good?'<div class="msg info"><b>What was wrong:</b> '+d.why+'</div>':'')}}
/* grade with the setup applied to both databases */
async function grade2(d,user){const a=await SA.open(d.db),b=await SA.open(d.db);if(d.setup){a.run(d.setup);b.run(d.setup)}
 const ua=SA.exec(a,user);if(ua.err)return{ok:false,msg:'SQLite says: '+ua.err};const ra=SA.exec(b,d.sol);a.close();b.close();
 if(ua.cols.length!==ra.cols.length)return{ok:false,msg:'Your answer has '+ua.cols.length+' column(s) but '+ra.cols.length+' are needed.'};
 if(ua.rows.length!==ra.rows.length)return{ok:false,msg:'Your answer returned '+ua.rows.length+' row(s) but '+ra.rows.length+' are expected.'};
 const cell=v=>v===null?'NULL':(typeof v==='number'?String(Math.round(v*100)/100):String(v));const n=r=>{const x=r.rows.map(q=>JSON.stringify(q.map(cell)));return d.ordered?x:x.sort()};const x=n(ua),y=n(ra);
 for(let i=0;i<x.length;i++)if(x[i]!==y[i])return{ok:false,msg:'The shape is right but some values differ'+(d.ordered?' or the order is wrong':'')+'.'};return{ok:true,msg:'Correct.'}}
function go(id){cur=id;location.hash=id;side();show()}
$('side').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)go(b.dataset.id)});
SA.ready().then(()=>{if(!DR.find(x=>x.id===cur))cur=(DR.find(x=>!ok(x.id))||DR[0]).id;side();show()});
</script><script src="nav.js"></script><!--SYNC--><script src="sync.js"></script><!--/SYNC-->
</body></html>
