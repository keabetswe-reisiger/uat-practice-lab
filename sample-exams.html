<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sample exams</title>
<meta name="theme-color" content="#0d0c0a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#16202f;--mute:#667085;--line:#e4e7ec;--brand:#11203b;--accent:#b08d57;--blue:#2563eb;--green:#16794a;--red:#c0392b;--amber:#b7791f}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header h1{font-size:18px;margin:0}header h1 span{color:var(--accent)}.sp{flex:1}
header a{color:#fff;border:1px solid #ffffff44;border-radius:8px;padding:5px 11px;font-size:13px;text-decoration:none}
main{max-width:1180px;margin:auto;padding:16px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
h2{margin:0 0 4px;font-size:19px}h3{margin:10px 0 4px;font-size:16px;color:var(--brand)}.mute{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}@media(max-width:900px){.two{grid-template-columns:1fr}}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--accent)}.bar i.ok{background:var(--green)}.bar i.bad{background:var(--red)}
.big{font-size:34px;font-weight:800;line-height:1.1}.tag{font:12px ui-monospace,monospace;background:var(--line);border-radius:99px;padding:1px 9px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 3px}input,select,textarea{font:inherit;width:100%;border:1px solid #b8c0cc;border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
button{font:inherit;border:1px solid #b8c0cc;background:#fff;color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}button.pri{background:var(--brand);color:#fff;border-color:var(--brand)}button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.note{background:#eef3fb;border-left:3px solid var(--blue);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.cof{background:#faf5ea;border-left:3px solid var(--accent);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:14px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:14px}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.right{border-color:var(--green);background:#e8f5ee}.opt.wrong{border-color:var(--red);background:#fbeceb}

</style><!--BRAND--><link rel="stylesheet" href="brand.css"><!--/BRAND-->
</head><body>
<header><h1>Official sample exams <span>the real grader, not my questions</span></h1><span class="sp"></span><a href="exam.html">Exam prep</a><a href="readiness.html">Readiness</a><a href="index.html">Home</a></header>
<main><div id="v"></div></main>
<script>

const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='sample-v1';const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}};let S=load();S.runs=S.runs||[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
const CH=[['1','Fundamentals of testing',8],['2','Testing throughout the SDLC',6],['3','Static testing',4],['4','Test analysis and design',11],['5','Managing the test activities',9],['6','Test tools',2]];
const PASS=26,TOTAL=40,GOOD=32;
const today=()=>new Date().toISOString().slice(0,10);
function stats(){const r=S.runs;const best=r.length?Math.max(...r.map(x=>x.score)):null;const last3=r.slice(-3);const avg=last3.length?last3.reduce((a,x)=>a+x.score,0)/last3.length:null;
 const ch=CH.map(([n,name,max])=>{let got=0,tot=0;r.forEach(x=>{if(x.ch&&x.ch[n]!=null){got+=x.ch[n];tot+=max}});return{n,name,max,got,tot,acc:tot?got/tot:null}});
 const weak=ch.filter(c=>c.acc!=null).sort((a,b)=>a.acc-b.acc)[0]||null;return{best,avg,ch,weak,good:r.filter(x=>x.score>=GOOD).length}}
function view(){const st=stats();const r=S.runs;
 const top=`<div class="card" style="border-left:4px solid var(--accent)"><h2>Official sample exams</h2><div>The questions in this app are original practice items. The <b>official sample exams</b> are written by the people who write the real exam, so they are the best check of whether you are ready. They are free: look on istqb.org or on your national testing board's website, do one under exam conditions (40 questions, 60 minutes, no notes), then log the result here.</div><div class="cof">Practice questions are tasting your own recipe. An official sample exam is the grader's cup: it tells you how the real judge scores.</div><div class="mute">Pass mark ${PASS}/${TOTAL} (65%). The Readiness gate asks for <b>2 official sample exams at ${GOOD}/${TOTAL} or more (80%)</b>, which leaves a safety margin.</div></div>`;
 const sum=`<div class="grid"><div class="card"><div class="mute">Sample exams logged</div><div class="big">${r.length}</div></div><div class="card"><div class="mute">Best score</div><div class="big">${st.best==null?'none yet':st.best+'/'+TOTAL}</div></div><div class="card"><div class="mute">Average of last 3</div><div class="big">${st.avg==null?'none yet':st.avg.toFixed(1)+'/'+TOTAL}</div></div><div class="card"><div class="mute">At ${GOOD}+ (gate needs 2)</div><div class="big ${st.good>=2?'ok':''}">${st.good}/2</div></div></div>`;
 const trend=r.length?`<div class="card"><h3>Your scores over time</h3>${r.map(x=>`<div style="display:flex;gap:8px;align-items:center"><span class="mute" style="width:150px;flex:none">${esc(x.date)} ${esc(x.name)}</span><div class="bar" style="flex:1"><i class="${x.score>=PASS?'ok':'bad'}" style="width:${x.score/TOTAL*100}%"></i></div><b style="width:64px;text-align:right">${x.score}/${TOTAL}</b></div>`).join('')}<div class="mute">Green means at or above the pass mark of ${PASS}.</div></div>`:'';
 const chs=st.ch.some(c=>c.tot)?`<div class="card"><h3>Accuracy by syllabus chapter</h3><div class="mute">Only exams where you entered chapter scores are counted.</div>${st.ch.map(c=>`<div style="margin-top:6px"><b>Chapter ${c.n}: ${esc(c.name)}</b> <span class="mute">${c.tot?c.got+' of '+c.tot+' ('+Math.round(c.acc*100)+'%)':'no data'}</span><div class="bar"><i class="${c.acc!=null&&c.acc<.65?'bad':''}" style="width:${(c.acc||0)*100}%"></i></div></div>`).join('')}${st.weak&&st.weak.acc<.8?`<div class="note">Weakest chapter so far: <b>Chapter ${st.weak.n}, ${esc(st.weak.name)}</b>. <a href="fix-gaps.html">Fix my gaps</a> or <a href="exam.html">revise it in Exam prep</a>.</div>`:''}</div>`:'';
 const rows=r.length?`<div class="card"><h3>Your log</h3><table><tr><th>Date</th><th>Exam</th><th>Score</th><th>Result</th><th></th></tr>${r.map((x,i)=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${x.score}/${TOTAL}</td><td class="${x.score>=PASS?'ok':'bad'}">${x.score>=PASS?'Pass':'Not yet'}</td><td><button data-del="${i}">Delete</button></td></tr>`).join('')}</table></div>`:'';
 const mocks=(()=>{try{return(JSON.parse(localStorage.getItem('exam-v1'))||{}).mocks||[]}catch{return[]}})();
 const cmp=(mocks.length&&st.best!=null)?`<div class="card"><h3>Practice mocks versus official</h3>Best practice mock here: <b>${Math.max(...mocks.map(m=>m.score))}/${TOTAL}</b>. Best official sample: <b>${st.best}/${TOTAL}</b>. ${st.best<Math.max(...mocks.map(m=>m.score))-4?'Your official score is clearly lower than your practice score. Trust the official one: the practice questions here may be easier for you now because you have seen them.':'These are close, which is a good sign.'}</div>`:'';
 const form=`<div class="card"><h2>Log a sample exam</h2><label for="f-name">Which exam?</label><select id="f-name"><option>Official Sample Exam A</option><option>Official Sample Exam B</option><option>Official Sample Exam C</option><option>Official Sample Exam D</option><option>Other official sample exam</option></select><label for="f-date">Date taken</label><input type="date" id="f-date" value="${today()}" max="${today()}"><label for="f-score">Total score (0 to ${TOTAL})</label><input type="number" id="f-score" min="0" max="${TOTAL}" inputmode="numeric" placeholder="for example 31"><div class="mute" style="margin-top:12px"><b>Optional, but very useful:</b> how many you got right in each chapter. If you fill these in, the total is worked out for you.</div><div class="grid" style="margin-top:6px">${CH.map(([n,name,max])=>`<div><label for="c${n}" style="margin-top:4px">Ch ${n} (of ${max})</label><input type="number" id="c${n}" min="0" max="${max}" inputmode="numeric"></div>`).join('')}</div><div id="msg" class="bad" role="alert" style="margin-top:8px"></div><div class="row" style="margin-top:8px"><button class="pri" data-add="1">Save result</button></div><div class="mute" style="margin-top:8px">Questions per chapter are the official v4.0 sample exam spread (8, 6, 4, 11, 9, 2). If your exam shows a different split, just enter the total.</div></div>`;
 $('v').innerHTML=top+sum+'<div class="two"><div>'+form+'</div><div>'+trend+chs+cmp+rows+'</div></div>'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.del!==undefined){S=load();S.runs=S.runs||[];S.runs.splice(+b.dataset.del,1);save();view();return}
 if(b.dataset.add){const msg=$('msg');const ch={};let any=0,sum=0,bad='';CH.forEach(([n,name,max])=>{const v=$('c'+n).value.trim();if(v!==''){const x=+v;if(!Number.isInteger(x)||x<0||x>max)bad='Chapter '+n+' must be a whole number from 0 to '+max+'.';ch[n]=x;sum+=x;any++}});
  if(bad){msg.textContent=bad;return}
  if(any&&any<CH.length){msg.textContent='Fill in all six chapters, or leave them all empty and enter only the total.';return}
  let score;if(any){score=sum}else{const v=$('f-score').value.trim();score=+v;if(v===''||!Number.isInteger(score)||score<0||score>TOTAL){msg.textContent='Enter a total score as a whole number from 0 to '+TOTAL+'.';return}}
  if(any&&$('f-score').value.trim()!==''&&+$('f-score').value!==sum){msg.textContent='The chapter scores add up to '+sum+', but you typed '+$('f-score').value+' as the total. Fix one of them.';return}
  S=load();S.runs=S.runs||[];S.runs.push({name:$('f-name').value,date:$('f-date').value||today(),score,ch:any?ch:null,ts:Date.now()});S.runs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);save();view();window.scrollTo(0,0)}});
view();

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script><script src="ticketcheck.js"></script><script src="ticketpanel.js"></script><script src="analogy.js"></script><script src="nav.js"></script><!--SYNC--><script src="sync.js"></script><!--/SYNC-->
</body></html>
