<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Interview prep | SQL Academy | UAT Lab</title><meta name="theme-color" content="#11203b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="sqa.css"><!--BRAND--><link rel="stylesheet" href="brand.css"><!--/BRAND--></head><body>
<main><h2 class="pt">Interview prep</h2><div id="intro"></div>
<div class="row" id="tabs" role="tablist"></div><div id="view"></div></main>
<script src="sql-wasm.js"></script><script src="sqa-dbs.js"></script><script src="sqa-exam-bank.js"></script><script src="sqa-challenges.js"></script><script src="sqa-core.js"></script>
<script>
SA.frame('sqa-exam.html');const $=SA.$,esc=SA.esc,E=window.EXAM,CH=window.CHALLENGES,T=window.TALK;
$('intro').innerHTML=SA.startHere({plain:'Four ways to prepare: practise questions by topic with instant explanations, sit a timed 40-question mock exam, race the clock on real SQL challenges, and rehearse spoken answers.',coffee:'Before opening a new shop you run a mock morning: customers arrive, the clock runs, and afterwards you review what went wrong. This page is that mock morning for SQL.',example:'Q: Which clause filters groups after aggregation?\nA: HAVING',exampleNote:'Employers often ask this exact trap: WHERE filters rows, HAVING filters groups.',steps:['Start with Practice by topic and read every explanation, even when you were right.','When you score 80% or more on a topic, move on.','Try the mock exam under the time limit. It marks you at the end only.','Do the timed SQL challenges, then rehearse the talk-it-through cards out loud.'],glossary:[['Mock exam','A practice test sat under real time pressure.'],['Pass mark','70% in this mock. Real exams set their own.'],['Grain','What one row of a result stands for.'],['Anti-join','Finding rows with no match, using LEFT JOIN ... IS NULL or NOT EXISTS.']]});
const tabs=[['practice','Practice by topic'],['mock','Mock exam (40)'],['timed','Timed SQL challenges'],['talk','Talk it through']];let tab='practice';
$('tabs').innerHTML=tabs.map(t=>'<button data-t="'+t[0]+'">'+t[1]+'</button>').join('');
function setTab(t){tab=t;[...$('tabs').children].forEach(b=>{b.className=b.dataset.t===t?'pri':''});({practice:vPractice,mock:vMock,timed:vTimed,talk:vTalk})[t]()}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){stopTimers();setTab(b.dataset.t)}};
let timers=[];const stopTimers=()=>{timers.forEach(clearInterval);timers=[]};
/* ---- practice by topic ---- */
function vPractice(){const topics=[...new Set(E.map(q=>q.topic))];const done=E.filter(q=>(SA.get('exam','p_'+q.id)||{}).ok).length;
 $('view').innerHTML='<div class="card"><h2 style="margin-top:0">Choose a topic</h2><p class="mute">'+E.length+' original questions. '+done+' answered correctly so far.</p><div class="grid">'+topics.map(t=>{const qs=E.filter(q=>q.topic===t),d=qs.filter(q=>(SA.get('exam','p_'+q.id)||{}).ok).length;return '<a class="tile" href="#" data-topic="'+esc(t)+'"><b>'+esc(t)+'</b>'+d+' of '+qs.length+' correct</a>'}).join('')+'</div></div><div id="pq"></div>';
 $('view').onclick=e=>{const a=e.target.closest('[data-topic]');if(!a)return;e.preventDefault();runTopic(a.dataset.topic)}}
function runTopic(topic){const qs=E.filter(q=>q.topic===topic);let i=0,right=0;const host=$('pq');
 function next(){if(i>=qs.length){host.innerHTML='<div class="card"><h2>'+esc(topic)+': finished</h2><div class="msg '+(right/qs.length>=.8?'ok':'info')+'">You got '+right+' of '+qs.length+' ('+Math.round(100*right/qs.length)+'%). '+(right/qs.length>=.8?'Good: move to the next topic.':'Read the explanations again and retry this topic.')+'</div><button class="pri" id="again">Retry this topic</button></div>';$('again').onclick=()=>runTopic(topic);return}
  const q=qs[i];host.innerHTML='<div class="card"><div class="mute">'+esc(topic)+' | question '+(i+1)+' of '+qs.length+'</div><div id="m"></div><div class="row" style="margin-top:8px"><span class="sp"></span><button id="nx" class="pri" disabled>Next</button></div></div>';
  SA.mcq($('m'),[q.q,...q.o,q.why],i*13+qs.length,ok=>{if(ok)right++;SA.set('exam','p_'+q.id,{ok:ok||(SA.get('exam','p_'+q.id)||{}).ok});$('nx').disabled=false});
  $('nx').onclick=()=>{i++;next()};host.scrollIntoView({behavior:'smooth'})}
 next()}
/* ---- mock exam ---- */
function vMock(){const log=SA.get('exam','mocklog')||[];
 $('view').innerHTML='<div class="card"><h2 style="margin-top:0">40-question mock</h2><p>40 questions drawn from all topics. You have <b>60 minutes</b>. Answers are not shown until you finish. Pass mark: <b>70%</b> (28 of 40).</p><button class="pri" id="go">Start the mock</button>'+(log.length?'<h3>Your attempts</h3><table class="plain"><tr><th>Date</th><th>Score</th><th>Result</th></tr>'+log.slice(-8).reverse().map(r=>'<tr><td>'+esc(r.d)+'</td><td>'+r.s+' / '+r.n+'</td><td>'+(r.s/r.n>=.7?'Pass':'Not yet')+'</td></tr>').join('')+'</table>':'')+'</div>';
 $('go').onclick=startMock}
function startMock(){const seed=Date.now()%100000;const order=SA.shuf(E.map((q,i)=>i),seed).slice(0,40);const qs=order.map(i=>E[i]);const ans={};let cur=0,left=60*60;
 function draw(){const q=qs[cur];const opts=SA.shuf([0,1,2,3],seed+cur);
  $('view').innerHTML='<div class="card"><div class="row"><b>Question '+(cur+1)+' of 40</b><span class="sp"></span><b id="clock">'+fmt(left)+'</b></div><div class="mute">'+esc(q.topic)+'</div><p><b>'+q.q+'</b></p>'+opts.map(k=>'<button class="opt'+(ans[cur]===k?' right':'')+'" data-k="'+k+'">'+q.o[k]+'</button>').join('')+'<div class="row" style="margin-top:10px"><button id="pv" '+(cur===0?'disabled':'')+'>Previous</button><button id="nx" '+(cur===39?'disabled':'')+'>Next</button><span class="sp"></span><button id="fin" class="pri">Finish and mark</button></div><div class="mute" style="margin-top:8px">Answered '+Object.keys(ans).length+' of 40</div><div class="row" style="margin-top:6px">'+qs.map((x,i)=>'<button class="sm'+(i===cur?' pri':ans[i]!==undefined?'':'')+'" data-j="'+i+'" style="min-width:36px">'+(i+1)+(ans[i]!==undefined?'*':'')+'</button>').join('')+'</div></div>'}
 function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
 function finish(){stopTimers();let s=0;const byT={};qs.forEach((q,i)=>{const ok=ans[i]===0;if(ok)s++;byT[q.topic]=byT[q.topic]||[0,0];byT[q.topic][1]++;if(ok)byT[q.topic][0]++});
  const log=SA.get('exam','mocklog')||[];log.push({d:new Date().toLocaleDateString('en-ZA'),s,n:40});SA.set('exam','mocklog',log);
  $('view').innerHTML='<div class="card"><h2 style="margin-top:0">Mock result</h2><div class="msg '+(s>=28?'ok':'no')+'">You scored '+s+' of 40 ('+Math.round(s*2.5)+'%). '+(s>=28?'Pass.':'Not yet: the pass mark is 28.')+'</div><h3>By topic</h3><table class="plain"><tr><th>Topic</th><th>Right</th></tr>'+Object.entries(byT).map(([t,v])=>'<tr><td>'+esc(t)+'</td><td>'+v[0]+' / '+v[1]+'</td></tr>').join('')+'</table><h3>Review the ones you missed</h3>'+(qs.map((q,i)=>ans[i]===0?'':'<div class="card"><b>'+(i+1)+'. '+q.q+'</b><div class="msg ok">Right answer: '+q.o[0]+'</div><div class="msg info">'+(ans[i]===undefined?'Not answered. ':'You chose: '+q.o[ans[i]]+'. ')+q.why+'</div></div>').join('')||'<p>No mistakes. Excellent.</p>')+'<button class="pri" id="r">Back</button></div>';$('r').onclick=vMock}
 draw();timers.push(setInterval(()=>{left--;const c=$('clock');if(c)c.textContent=fmt(left);if(left<=0)finish()},1000));
 $('view').onclick=e=>{const o=e.target.closest('.opt');if(o){ans[cur]=+o.dataset.k;draw();return}const j=e.target.closest('[data-j]');if(j){cur=+j.dataset.j;draw();return}if(e.target.id==='nx'){cur++;draw()}if(e.target.id==='pv'){cur--;draw()}if(e.target.id==='fin'){if(Object.keys(ans).length<40&&!confirm('You have unanswered questions. Finish anyway?'))return;finish()}}}
/* ---- timed SQL challenges ---- */
function vTimed(){$('view').innerHTML='<div class="card"><h2 style="margin-top:0">Pick a challenge</h2><p class="mute">Each has a time limit. The clock starts when you open it. Finishing early records your time.</p><div class="grid">'+CH.map(c=>{const r=SA.get('chal',c.id)||{};return '<a class="tile" href="#" data-c="'+c.id+'"><b>'+esc(c.title)+'</b>'+c.minutes+' min | '+DBS[c.db].title+(r.ok?'<br>Best: '+Math.floor(r.secs/60)+'m '+r.secs%60+'s':'')+'</a>'}).join('')+'</div></div><div id="cb"></div>';
 $('view').onclick=e=>{const a=e.target.closest('[data-c]');if(!a)return;e.preventDefault();runChal(CH.find(c=>c.id===a.dataset.c))}}
function runChal(c){stopTimers();let left=c.minutes*60,t0=Date.now(),over=false;const host=$('cb');
 host.innerHTML='<div class="card"><div class="row"><h2 style="margin:0">'+esc(c.title)+'</h2><span class="sp"></span><b id="cl">'+Math.floor(left/60)+':'+String(left%60).padStart(2,'0')+'</b></div><p>'+c.prompt+(c.ordered?' <span class="mute">Order matters.</span>':'')+'</p><details class="g"><summary>Tables</summary><div id="sch">Loading...</div></details><div id="ed"></div><div id="fb"></div></div>';
 SA.schemaHTML(c.db).then(h=>{if($('sch'))$('sch').innerHTML=h});
 SA.editor($('ed'),{db:c.db,sql:'',q:{db:c.db,sol:c.sol,ordered:c.ordered},onCheck:g=>{if(g.ok&&!over){const s=Math.round((Date.now()-t0)/1000);stopTimers();const o=SA.get('chal',c.id)||{};if(!o.ok||s<o.secs)SA.set('chal',c.id,{ok:true,secs:s});$('fb').innerHTML='<div class="msg ok">Solved in '+Math.floor(s/60)+'m '+(s%60)+'s '+(s<=c.minutes*60?'(inside the limit).':'')+'</div><details class="g"><summary>One model answer</summary><pre class="code">'+esc(c.sol)+'</pre></details>'}}});
 timers.push(setInterval(()=>{left--;const el=$('cl');if(left<=0){over=true;if(el)el.textContent='Time is up';stopTimers();$('fb').innerHTML='<div class="msg no">Time is up. You can keep working, but this attempt will not record a time.</div><details class="g"><summary>One model answer</summary><pre class="code">'+esc(c.sol)+'</pre></details>'}else if(el)el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')},1000));host.scrollIntoView({behavior:'smooth'})}
/* ---- talk it through ---- */
function vTalk(){let i=0;function draw(){const k=SA.get('exam','talk_'+i)||{};$('view').innerHTML='<div class="card"><div class="mute">Card '+(i+1)+' of '+T.length+'</div><h2 style="margin-top:4px">'+esc(T[i][0])+'</h2><p class="mute">Say your answer out loud first, then reveal the model answer.</p><button id="rev">Show the model answer</button><div id="ans"></div><div class="row" style="margin-top:10px"><button id="pv" '+(i===0?'disabled':'')+'>Previous</button><button id="nx" '+(i===T.length-1?'disabled':'')+'>Next</button></div></div>';
  $('rev').onclick=()=>{$('ans').innerHTML='<div class="msg info">'+esc(T[i][1])+'</div><div class="row"><button data-g="1">I said most of that</button><button data-g="0">I need to review this</button></div><div class="mute">'+(k.g===1?'Last time: confident.':k.g===0?'Last time: needs review.':'')+'</div>'};
  $('view').onclick=e=>{const g=e.target.closest('[data-g]');if(g){SA.set('exam','talk_'+i,{g:+g.dataset.g});g.parentElement.insertAdjacentHTML('afterend','<div class="msg ok">Saved.</div>');return}if(e.target.id==='nx'){i++;draw()}if(e.target.id==='pv'){i--;draw()}}}
 draw()}
SA.ready().then(()=>setTab('practice'));
</script><script src="nav.js"></script><!--SYNC--><script src="sync.js"></script><!--/SYNC-->
</body></html>
