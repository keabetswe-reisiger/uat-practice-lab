<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test Design Techniques</title>
<meta name="theme-color" content="#0d0c0a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#16202f;--mute:#667085;--line:#e4e7ec;--brand:#11203b;--accent:#b08d57;--blue:#2563eb;--green:#16794a;--red:#c0392b;--amber:#b7791f}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header h1{font-size:18px;margin:0}header h1 span{color:var(--accent)}.sp{flex:1}
header a{color:#fff;border:1px solid #ffffff44;border-radius:8px;padding:5px 11px;font-size:13px;text-decoration:none}
main{max-width:1180px;margin:auto;padding:16px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
h2{margin:0 0 4px;font-size:19px}h3{margin:0 0 4px;font-size:16px;color:var(--brand)}.mute{color:var(--mute);font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:600}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}button:disabled{opacity:.5;cursor:default}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}@media(max-width:900px){.two{grid-template-columns:1fr}}
.cof{border-left:3px solid var(--accent);padding:4px 10px;margin:8px 0;background:#b08d5714;border-radius:4px;font-size:15px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:7px 0;background:var(--card);font-weight:500}
.opt b{min-width:22px;color:var(--mute)}.opt.sel{border-color:var(--blue);box-shadow:0 0 0 2px #2563eb44}.opt.right{border-color:var(--green);background:#16794a22}.opt.wrong{border-color:var(--red);background:#c0392b22}
.qt{white-space:pre-wrap;font-size:16.5px}.res{border-radius:10px;padding:10px 12px;margin-top:10px;white-space:pre-wrap}.res.ok{background:#16794a1f}.res.no{background:#c0392b1f}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font:12px ui-monospace,monospace;background:var(--line);border-radius:99px;padding:1px 9px}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
input[type=number],select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 9px;width:90px}select{width:auto;max-width:100%}.two>*{min-width:0}
.line{position:relative;height:74px;margin:14px 4px 6px}.seg{position:absolute;top:22px;height:26px;border-radius:6px;font-size:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.seg.v{background:#16794a55;border:1px solid var(--green)}.seg.i{background:#c0392b33;border:1px solid var(--red)}
.pt{position:absolute;top:2px;transform:translateX(-50%);text-align:center;font:600 12px ui-monospace,monospace}.pt:after{content:"";display:block;width:2px;height:70px;background:var(--blue);margin:2px auto 0}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:5px 8px;text-align:center;font-size:14px}th{background:#00000010}td.l,th.l{text-align:left}
.cl{display:block;font-family:ui-monospace,Menlo,monospace;font-size:14px;padding:1px 8px}.cl.on{background:#16794a33}.cl.off{background:#c0392b18}
.st{display:inline-block;border:2px solid var(--line);border-radius:10px;padding:6px 12px;margin:3px;font-weight:700}.st.now{border-color:var(--blue);background:#2563eb22}.st.seen{border-color:var(--green)}
code{font-family:ui-monospace,Menlo,monospace;background:#00000012;border-radius:4px;padding:0 4px}
.scroll{overflow-x:auto}
</style><!--BRAND--><link rel="stylesheet" href="brand.css"><!--/BRAND-->
</head><body>
<header><h1>Test Design <span>Techniques</span></h1><span class="sp"></span><a href="exam.html">Exam prep</a><a href="index.html">Home</a></header>
<main><nav id="nav"></nav><div id="v"></div></main>
<script src="qgen.js"></script>
<script>
const G=window.QGEN;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='tech-v1';let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch{S={}}S.tab=S.tab||'ep';S.st=S.st||{};S.recent=S.recent||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
const TABS=[['ep','Equivalence partitions','FL-4.2.1',['ep_count','ep_set']],['bva','Boundary values','FL-4.2.2',['bva_set','bva_count']],['dt','Decision tables','FL-4.2.3',['dt_rules','dt_action']],['stt','State transitions','FL-4.2.4',['st_next','st_cov']],['cov','Statement & branch coverage','FL-4.3.x',['code_cov']],['est','Estimation','FL-5.1.4',['est_3pt','est_ratio','est_extrap']],['pri','Prioritising tests','FL-5.1.5',['prio_risk','prio_cov']]];
const tab=()=>TABS.find(t=>t[0]===S.tab);
/* --- practice block shared by every tab --- */
let PQ=null;
const newQ=types=>{const t=types[Math.floor(Math.random()*types.length)];PQ={q:G.make(t,1+Math.floor(Math.random()*1e9)),sel:null,done:false,t}};
function mastery(types){const r=[].concat(...types.map(t=>S.recent[t]||[])).slice(-10);return{n:r.length,c:r.filter(x=>x).length}}
function practiceHTML(types){if(!PQ||!types.includes(PQ.t))newQ(types);const q=PQ.q;const m=mastery(types);
 return `<div class="card"><h3>Practise (new numbers every time)</h3><div class="mute">Your last ${m.n||'0'} answers here: <b>${m.c}</b> correct ${m.n>=8&&m.c/m.n>=.8?'· mastered (80%+ over the last 8-10)':''}</div><div class="bar" style="margin:4px 0 10px"><i style="width:${m.n?m.c/m.n*100:0}%"></i></div>
 <div class="qt">${esc(q.q)}</div>${q.o.map((o,i)=>`<button class="opt ${PQ.done?(i===q.a?'right':PQ.sel===i?'wrong':''):PQ.sel===i?'sel':''}" data-sel="${i}" ${PQ.done?'disabled':''}><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}
 ${PQ.done?`<div class="res ${PQ.sel===q.a?'ok':'no'}"><b>${PQ.sel===q.a?'Correct':'Not quite: the answer is '+'ABCD'[q.a]}.</b>\n${esc(q.why)}</div><div style="margin-top:10px"><button class="pri" data-nq="1">Next question →</button></div>`:`<div style="margin-top:10px"><button class="pri" data-chk="1" ${PQ.sel===null?'disabled':''}>Check answer</button></div>`}</div>`}
/* --- tab content --- */
function epHTML(){const lo=S.lo??10,hi=S.hi??50;const mx=hi+Math.max(10,Math.round((hi-lo)*.4)),mn=Math.max(0,lo-Math.max(10,Math.round((hi-lo)*.4)));const sc=v=>((v-mn)/(mx-mn))*100;
 const b1=S.b1??25;const lo2=Math.min(Math.max(lo+1,b1),hi);
 return `<div class="card"><h2>Equivalence partitioning (EP)</h2><div class="cof">You do not taste every cup from a 1000-cup day. You group cups that behave the same (all espressos from this grinder setting) and taste one from each group.</div><p><b>Idea:</b> split the possible inputs into groups (<i>partitions</i>) where the system should treat every value the same. Test <b>one value from each partition</b>, valid <i>and invalid</i>.</p><ol><li>Find the rule (valid range).</li><li>List the valid partitions, then the invalid ones (below, above, wrong type).</li><li>Pick one value in each. 100% EP coverage = every partition exercised at least once.</li></ol></div>
 <div class="card"><h3>Try it: a coffee order accepts ${lo} to ${hi} cups</h3><div>Lowest valid <input type="number" id="lo" value="${lo}"> Highest valid <input type="number" id="hi" value="${hi}"> Price changes at <input type="number" id="b1" value="${b1}"></div>
 <div class="line"><div class="seg i" style="left:0;width:${sc(lo)}%">below ${lo}: invalid</div><div class="seg v" style="left:${sc(lo)}%;width:${sc(lo2)-sc(lo)}%">${lo}–${lo2-1}</div><div class="seg v" style="left:${sc(lo2)}%;width:${sc(hi+1)-sc(lo2)}%">${lo2}–${hi}</div><div class="seg i" style="left:${sc(hi+1)}%;width:${100-sc(hi+1)}%">above ${hi}: invalid</div>${[lo-2,Math.round((lo+lo2)/2),Math.round((lo2+hi)/2),hi+3].map(v=>`<div class="pt" style="left:${sc(v)}%">${v}</div>`).join('')}</div>
 <div class="mute">4 partitions (2 valid + 2 invalid), so you need at least <b>4 tests</b>, one per partition. The blue lines are one possible set of test values.</div></div>`}
function bvaHTML(){const lo=S.blo??18,hi=S.bhi??65,three=S.b3===true;const mx=hi+12,mn=Math.max(0,lo-12);const sc=v=>((v-mn)/(mx-mn))*100;
 const vals=(three?[lo-1,lo,lo+1,hi-1,hi,hi+1]:[lo-1,lo,hi,hi+1]);
 return `<div class="card"><h2>Boundary value analysis (BVA)</h2><div class="cof">A cup holds 300 ml. Bugs hide at the rim: 299, 300 and 301 ml. Nobody tests 150 ml; the overflow lives at the edge.</div><p><b>Idea:</b> developers make mistakes at the edges of a range (a &lt; written instead of ≤). So test the <b>boundary values</b> (the lowest and highest valid values) and their neighbours.</p><ul><li><b>2-value BVA:</b> each boundary value and the closest value in the neighbouring partition. Range 1–100 gives 0, 1, 100, 101 (4 values).</li><li><b>3-value BVA:</b> each boundary value and both neighbours. Range 1–100 gives 0, 1, 2, 99, 100, 101 (6 values). It catches a mistake that 2-value BVA can miss.</li></ul></div>
 <div class="card"><h3>Try it: a form accepts ages ${lo} to ${hi}</h3><div>Lowest <input type="number" id="blo" value="${lo}"> Highest <input type="number" id="bhi" value="${hi}"> <select id="b3"><option value="2" ${!three?'selected':''}>2-value BVA</option><option value="3" ${three?'selected':''}>3-value BVA</option></select></div>
 <div class="line"><div class="seg i" style="left:0;width:${sc(lo)}%">invalid</div><div class="seg v" style="left:${sc(lo)}%;width:${sc(hi+1)-sc(lo)}%">valid ${lo}–${hi}</div><div class="seg i" style="left:${sc(hi+1)}%;width:${100-sc(hi+1)}%">invalid</div>${vals.map(v=>`<div class="pt" style="left:${sc(v)}%">${v}</div>`).join('')}</div><div class="mute"><b>${vals.length} test values:</b> ${vals.join(', ')}</div></div>`}
function dtHTML(){const C=['Has loyalty card','Order over R100','Happy hour'];const rule=S.dtr??0;const R=[{n:'10% discount only if card AND order over R100',f:(c,b,h)=>c&&b},{n:'Free cookie if happy hour OR (card AND order over R100)',f:(c,b,h)=>h||(c&&b)},{n:'Free delivery if order over R100 AND (card OR happy hour)',f:(c,b,h)=>b&&(c||h)}];
 const rows=[];for(let i=0;i<8;i++){const c=!!(i&4),b=!!(i&2),h=!!(i&1);rows.push([c,b,h,R[rule].f(c,b,h)])}
 return `<div class="card"><h2>Decision table testing</h2><div class="cof">"Free cookie on happy hour, or if you have a card and spend over R100". Many conditions combine, and it is easy to forget one combination. A decision table lists them all.</div><p><b>Idea:</b> write the <b>conditions</b> as rows, every <b>combination</b> as a column (a <i>rule</i>), and the resulting <b>actions</b>. With <b>n</b> yes/no conditions a full table has <b>2<sup>n</sup></b> columns (3 conditions = 8). Coverage = columns exercised ÷ feasible columns. <code>T</code> = true, <code>F</code> = false, <code>–</code> = does not matter.</p></div>
 <div class="card"><h3>Try it: pick a business rule and see the full table</h3><select id="dtr">${R.map((x,i)=>`<option value="${i}" ${i===rule?'selected':''}>${esc(x.n)}</option>`).join('')}</select><div class="scroll" style="margin-top:10px"><table><tr><th class="l">Rule</th>${rows.map((_,i)=>`<th>R${i+1}</th>`).join('')}</tr>${C.map((n,k)=>`<tr><td class="l">${n}</td>${rows.map(r=>`<td>${r[k]?'T':'F'}</td>`).join('')}</tr>`).join('')}<tr><td class="l"><b>Action happens?</b></td>${rows.map(r=>`<td>${r[3]?'<b>X</b>':''}</td>`).join('')}</tr></table></div><div class="mute" style="margin-top:6px">8 rules, so 8 test cases cover every column. Columns that give the same action for any value of a condition can be merged (minimised) using <code>–</code>.</div></div>`}
function sttHTML(){const M=G.MACH;const mi=S.mi??0;const m=M[mi];if(!S.sim||S.sim.mi!==mi)S.sim={mi,cur:m.states[0]===m.ev[0][0]?m.states[0]:m.ev[0][0],seen:[m.ev[0][0]],used:[],log:[]};const sm=S.sim;const evs=[...new Set(m.ev.map(x=>x[1]))];
 const pct=(a,b)=>Math.round(a/b*100);
 return `<div class="card"><h2>State transition testing</h2><div class="cof">An order is New, then Paid, then Brewing, then Served. You cannot Serve an unpaid order. State testing checks the allowed moves work and the forbidden ones are refused.</div><p><b>Idea:</b> a system is always in one <b>state</b>. An <b>event</b> moves it along a <b>transition</b> to another state, but only if that move is valid. A test is a <b>sequence of events</b>. Coverage types in the exam: <b>all states</b>, <b>valid transitions</b> (0-switch) and <b>all transitions</b> (valid plus attempted invalid ones).</p></div>
 <div class="two"><div class="card"><h3>Pick a machine</h3><select id="mi">${M.map((x,i)=>`<option value="${i}" ${i===mi?'selected':''}>${x.name}</option>`).join('')}</select><div class="scroll"><table style="margin-top:8px"><tr><th class="l">From</th><th>Event</th><th>To</th></tr>${m.ev.map(t=>`<tr><td class="l">${t[0]}</td><td>${t[1]}</td><td>${t[2]}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h3>Simulator: send events and watch</h3><div>${m.states.map(s=>`<span class="st ${s===sm.cur?'now':sm.seen.includes(s)?'seen':''}">${s}</span>`).join('')}</div><div style="margin:8px 0">${evs.map(e=>`<button data-ev="${e}">${e}</button> `).join('')}</div><div class="mute">States visited: <b>${sm.seen.length}/${m.states.length}</b> (${pct(sm.seen.length,m.states.length)}%) · Valid transitions used: <b>${sm.used.length}/${m.ev.length}</b> (${pct(sm.used.length,m.ev.length)}%)</div><div style="margin-top:6px;font-size:14px">${sm.log.slice(-6).map(esc).join('<br>')||'<span class="mute">Press an event button. Try an event that is not allowed in the current state.</span>'}</div><button data-simreset="1" style="margin-top:8px">Reset</button></div></div>`}
const COV={tests:[[5,3]],a:4,b:5};
function covHTML(){const a=S.ca??4,b=S.cb??5;const T=S.ct||[[6,3]];const code=['READ x, y','IF x > '+a+' THEN','   total = total + 1','END IF','IF y < '+b+' THEN','   discount = 5','ELSE','   discount = 0','END IF','PRINT total, discount'];
 const ex=new Set([0,9]),br=new Set();T.forEach(([x,y])=>{if(x>a){ex.add(2);br.add('if1 true')}else br.add('if1 false');if(y<b){ex.add(5);br.add('if2 true')}else{ex.add(7);br.add('if2 false')}});
 const stmts=[0,2,5,7,9];const sc=stmts.filter(i=>ex.has(i)).length;
 return `<div class="card"><h2>Statement and branch coverage</h2><div class="cof">Statement coverage: did we run every step of the opening checklist? Branch coverage: did we also try both paths at every "if the milk is cold…" decision?</div><p><b>Statement coverage</b> = executed statements ÷ total statements. <b>Branch coverage</b> = branches taken ÷ total branches (each decision has a true and a false outcome, even with no <code>else</code>). <b>100% branch coverage guarantees 100% statement coverage, but not the other way round.</b></p></div>
 <div class="card"><h3>Try it: choose test inputs and watch the code light up</h3><div>x &gt; <input type="number" id="ca" value="${a}"> y &lt; <input type="number" id="cb" value="${b}"></div><div style="margin:8px 0">Tests (x, y): ${T.map((t,i)=>`<button data-rmt="${i}">(${t.join(', ')}) ✕</button> `).join('')} <button data-addt="1">+ add test</button></div>
 <div class="two"><div>${code.map((l,i)=>`<span class="cl ${[0,2,5,7,9].includes(i)?(ex.has(i)?'on':'off'):''}">${i+1}  ${esc(l)}</span>`).join('')}</div><div><b>Statement coverage:</b> ${sc} of ${stmts.length} (${Math.round(sc/stmts.length*100)}%)<div class="bar" style="margin:4px 0"><i style="width:${sc/stmts.length*100}%"></i></div><b>Branch coverage:</b> ${br.size} of 4 (${Math.round(br.size/4*100)}%)<div class="bar" style="margin:4px 0"><i style="width:${br.size/4*100}%"></i></div><div class="mute">Branches taken: ${[...br].join(', ')||'none'}</div></div></div></div>`}
function estHTML(){const a=S.ea??6,m=S.em??9,b=S.eb??18,dev=S.ed??90;const E=(a+4*m+b)/6,sd=(b-a)/6;const f=x=>(Math.round(x*10)/10);
 return `<div class="card"><h2>Estimating test effort</h2><div class="cof">"How long to count the stock?" Last quarter took 8 hours for 400 items. This quarter has 600 similar items, so about 12 hours.</div><p>The exam names four techniques: <b>ratios</b> (history of dev:test), <b>extrapolation</b> (average of recent iterations), <b>Wideband Delphi</b> (experts estimate, discuss, re-estimate) and <b>three-point</b> estimation.</p></div>
 <div class="two"><div class="card"><h3>Three-point estimation</h3><div>Optimistic a <input type="number" id="ea" value="${a}"> Most likely m <input type="number" id="em" value="${m}"> Pessimistic b <input type="number" id="eb" value="${b}"></div><p style="margin-bottom:0"><b>E</b> = (a + 4m + b) / 6 = (${a} + ${4*m} + ${b}) / 6 = <b>${f(E)}</b><br><b>SD</b> = (b − a) / 6 = <b>${f(sd)}</b><br><span class="mute">So the work is probably between ${f(E-sd)} and ${f(E+sd)}.</span></p></div>
 <div class="card"><h3>Ratio-based estimation</h3><div>Development effort <input type="number" id="ed" value="${dev}"> person-days at a dev:test ratio of 3:2</div><p style="margin-bottom:0">Test effort = ${dev} × 2/3 = <b>${f(dev*2/3)}</b> person-days.</p></div></div>`}
function priHTML(){return `<div class="card"><h2>Prioritising test cases</h2><div class="cof">Before opening the shop: check the till and the grinder first (a failure there stops the whole day), and the window display last.</div><p>Run the most valuable tests first, because you may run out of time.</p><ul><li><b>Risk-based:</b> highest risk (likelihood × impact) first.</li><li><b>Coverage-based:</b> the test that adds the <i>most not-yet-covered</i> items next.</li><li><b>Requirements-based:</b> follow the priority of the requirements the tests cover.</li></ul><p><b>Always respect dependencies:</b> if test B needs test A to run first, A goes first even if B is riskier.</p></div>`}
function render(){$('nav').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" class="${S.tab===t[0]?'pri':''}">${t[1]}</button>`).join('');const t=tab();
 const body={ep:epHTML,bva:bvaHTML,dt:dtHTML,stt:sttHTML,cov:covHTML,est:estHTML,pri:priHTML}[S.tab]();$('v').innerHTML=body+practiceHTML(t[3])}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.tab){S.tab=d.tab;PQ=null;save();render();return}
 if(d.sel!==undefined&&PQ&&!PQ.done){PQ.sel=+d.sel;render();return}
 if(d.chk&&PQ&&PQ.sel!==null){PQ.done=true;const ok=PQ.sel===PQ.q.a;const r=S.recent[PQ.t]=(S.recent[PQ.t]||[]);r.push(ok);if(r.length>10)r.shift();save();render();return}
 if(d.nq){newQ(tab()[3]);render();return}
 if(d.ev){const m=G.MACH[S.mi??0],sm=S.sim;const tr=m.ev.find(x=>x[0]===sm.cur&&x[1]===d.ev);if(tr){sm.log.push(`${sm.cur} --${d.ev}--> ${tr[2]}  (valid)`);sm.cur=tr[2];if(!sm.seen.includes(tr[2]))sm.seen.push(tr[2]);const k=tr[0]+'|'+tr[1];if(!sm.used.includes(k))sm.used.push(k)}else sm.log.push(`${sm.cur} + "${d.ev}": invalid here, nothing happens (this is an invalid transition attempt)`);save();render();return}
 if(d.simreset){S.sim=null;save();render();return}
 if(d.rmt!==undefined){(S.ct||(S.ct=[[6,3]])).splice(+d.rmt,1);save();render();return}
 if(d.addt){const x=+prompt('x value?','6'),y=+prompt('y value?','3');if(!isNaN(x)&&!isNaN(y)){(S.ct||(S.ct=[[6,3]])).push([x,y]);save();render()}return}});
document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;
 if(id==='lo'){S.lo=Math.max(1,+v||1)}else if(id==='hi'){S.hi=Math.max((S.lo??10)+3,+v||13)}else if(id==='b1'){S.b1=+v}
 else if(id==='blo'){S.blo=Math.max(2,+v||2)}else if(id==='bhi'){S.bhi=Math.max((S.blo??18)+4,+v)}else if(id==='b3'){S.b3=v==='3'}
 else if(id==='dtr'){S.dtr=+v}else if(id==='mi'){S.mi=+v;S.sim=null}
 else if(id==='ca'){S.ca=+v}else if(id==='cb'){S.cb=+v}
 else if(['ea','em','eb','ed'].includes(id)){S[id]=+v}else return;save();render()});
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script><script src="nav.js"></script><!--SYNC--><script src="sync.js"></script><!--/SYNC-->
</body></html>
