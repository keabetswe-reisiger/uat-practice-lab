<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Case studies | SQL Academy | UAT Lab</title><meta name="theme-color" content="#11203b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="sqa.css"><!--BRAND--><link rel="stylesheet" href="brand.css"><!--/BRAND--></head><body>
<main><h2 class="pt">Case studies</h2><div id="intro"></div><div id="list"></div><div id="proj"></div></main>
<script src="sql-wasm.js"></script><script src="sqa-dbs.js"></script><script src="sqa-projects.js"></script><script src="sqa-core.js"></script>
<script>
SA.frame('sqa-projects.html');const $=SA.$,esc=SA.esc,PR=window.PROJECTS;
$('intro').innerHTML=SA.startHere({plain:'A case study is a small real-world job. A business gives you messy questions and you answer them with SQL, one step at a time, ending with a short note to the owner. This is the closest thing here to a real analyst task.',coffee:'The owner does not say "write a GROUP BY". They say "which products make us money?". Your job is to turn that sentence into a query.',example:'-- Owner: "How many orders did we cancel?"\nSELECT COUNT(*) AS cancelled\nFROM orders\nWHERE status = \'cancelled\';',exampleNote:'Read the business question, decide what one row of the answer is, then write the query.',steps:['Open a case study and read the brief.','Work through the steps in order. Each is checked automatically.','Use the hint if you are stuck.','Write your note to the owner at the end. It is saved in your browser.'],glossary:[['Brief','The short description of what the business wants.'],['Grain','What one row of your answer stands for.'],['Fan-out','Joins repeating rows and inflating sums. Sum each side separately.'],['Deliverable','The thing you hand over: here, a short note.']]});
$('list').innerHTML='<div class="grid">'+PR.map(p=>{const d=p.steps.filter(s=>(SA.get('proj',s.id)||{}).ok).length;return '<a class="tile" href="#'+p.id+'" data-p="'+p.id+'"><b>'+esc(p.title)+'</b><span class="tag '+p.level+'">'+p.level+'</span> '+DBS[p.db].title+'<br>'+d+' of '+p.steps.length+' steps done</a>'}).join('')+'</div>';
let cur=null;
function open(id){const p=PR.find(x=>x.id===id);if(!p)return;cur=p;if(location.hash.slice(1)!==id)history.replaceState(null,'','#'+id);let si=Math.max(0,p.steps.findIndex(s=>!(SA.get('proj',s.id)||{}).ok));
 function draw(){const s=p.steps[si];const done=p.steps.filter(x=>(SA.get('proj',x.id)||{}).ok).length;
  $('proj').innerHTML='<div class="card"><h2 style="margin-top:0">'+esc(p.title)+'</h2><p>'+p.brief+'</p><div class="bar"><i style="width:'+(100*done/p.steps.length)+'%"></i></div><div class="mute">'+done+' of '+p.steps.length+' steps done</div></div><div class="layout"><aside class="side">'+p.steps.map((x,i)=>'<button class="'+(i===si?'on ':'')+((SA.get('proj',x.id)||{}).ok?'done':'')+'" data-i="'+i+'">Step '+(i+1)+'</button>').join('')+'<button data-i="note" class="'+(si==='note'?'on':'')+'">Your note</button></aside><div id="step"></div></div>';
  if(si==='note'){const k='note_'+p.id;$('step').innerHTML='<div class="card"><h2 style="margin-top:0">Your note to the owner</h2><p>'+p.deliver+'</p><textarea class="sql" id="nt" style="font-family:inherit" placeholder="Write here...">'+esc((SA.get('proj',k)||{}).t||'')+'</textarea><p class="mute">Saved automatically in this browser.</p></div>';$('nt').oninput=e=>SA.set('proj',k,{t:e.target.value});return}
  $('step').innerHTML='<div class="card"><h3 style="margin-top:0">Step '+(si+1)+' of '+p.steps.length+'</h3><p>'+s.prompt+(s.ordered?' <span class="mute">Row order matters.</span>':'')+'</p><details class="g"><summary>Tables</summary><div id="sch">Loading...</div></details><div id="ed"></div><div class="row" style="margin-top:8px"><button id="h">Hint</button><button id="a">Show a model answer</button><span class="sp"></span><button id="nx" class="pri">Next step</button></div><div id="hh"></div></div>';
  SA.schemaHTML(p.db).then(h=>{if($('sch'))$('sch').innerHTML=h});let tries=0;
  SA.editor($('ed'),{db:p.db,sql:'',q:{db:p.db,sol:s.sol,ordered:s.ordered},onCheck:g=>{tries++;if(g.ok){SA.set('proj',s.id,{ok:true});const b=document.querySelector('.side button[data-i="'+si+'"]');if(b)b.classList.add('done')}}});
  $('h').onclick=()=>{$('hh').innerHTML='<div class="msg info"><b>Hint:</b> '+s.hint+'</div>'};
  $('a').onclick=()=>{if(!tries&&!confirm('Try first? Show the answer anyway?'))return;$('hh').innerHTML='<div class="msg info"><b>One model answer:</b><pre class="code">'+esc(s.sol)+'</pre></div>'};
  $('nx').onclick=()=>{si=si+1>=p.steps.length?'note':si+1;draw()}}
 draw();$('proj').onclick=e=>{const b=e.target.closest('.side button[data-i]');if(b){si=b.dataset.i==='note'?'note':+b.dataset.i;draw()}};$('proj').scrollIntoView({behavior:'smooth'})}
$('list').onclick=e=>{const a=e.target.closest('[data-p]');if(a){e.preventDefault();open(a.dataset.p)}};
SA.ready().then(()=>{const h=location.hash.slice(1);if(PR.find(p=>p.id===h))open(h)});
</script><script src="nav.js"></script><!--SYNC--><script src="sync.js"></script><!--/SYNC-->
</body></html>
