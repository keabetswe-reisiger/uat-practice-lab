<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test This App</title>
<meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fff;--card:#fff;--ink:#16202f;--mute:#4a5568;--line:#d5dae2;--brand:#7a5a1e;--accent:#7a5a1e;--blue:#7a5a1e;--green:#11663f;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}header h1{font-size:18px;margin:0}.sp{flex:1}header a{border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13px;text-decoration:none;color:inherit}
main{max-width:1180px;margin:auto;padding:16px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}h2{margin:0 0 4px;font-size:19px}h3{margin:10px 0 4px;font-size:15px}.mute{color:var(--mute);font-size:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}@media(max-width:980px){.two{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 3px}input,select,textarea{font:inherit;width:100%;border:1px solid #b8c0cc;border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer;border:1px solid #b8c0cc;background:#fff;color:var(--ink);padding:7px 13px;border-radius:9px;font-weight:600}button.pri{background:#c9a66e;border-color:#b38e52;color:#1d1608}
.tag{font:12px ui-monospace,monospace;background:#eef1f5;border:1px solid var(--line);border-radius:99px;padding:1px 9px}
pre{background:#f3f4f6;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;margin:6px 0}
.q{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.q span{font-size:12.5px;border-radius:99px;padding:1px 9px;border:1px solid var(--line)}.q .y{background:#11663f1a;border-color:#11663f}.q .n{background:#b423181a;border-color:#b42318}
.cof{border-left:3px solid #b38e52;background:#c9a66e24;padding:6px 10px;border-radius:4px;margin:8px 0}
.ex{margin:8px 0;border:1px solid #d5dae2;border-radius:10px;padding:0 12px;background:#faf7f0}.ex summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}.exb{font-size:14.5px;line-height:1.6;padding:0 0 12px}#f-why{margin-top:6px}</style><!--BRAND--><link rel="stylesheet" href="brand.css"><!--/BRAND-->
</head><body>
<header><h1>Test This App</h1><span class="sp"></span><a href="portfolio.html">Portfolio</a><a href="tickets.html">Tickets</a><a href="index.html">Home</a></header>
<main><div id="v"></div></main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='appbugs-v1';let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch{S={}}S.items=S.items||[];S.editing=null;
const save=()=>{try{const o=Object.assign({},S);delete o.editing;localStorage.setItem(KEY,JSON.stringify(o))}catch{}};
const PAGES=['Home','Start here guide','Kinds of testing','Careful tester toolkit','Test arcade','Tickets','API lab','SQL lab','Exam prep','Technique trainer','Final test (unseen app)','Interview practice','Work skills','Automation lab','Portfolio','Readiness','Practice outside the app','Online shop','Mobile banking','Business CRM','Shared documents','Form playground','Order API console','Access check','Safe login','Coffee ordering app','Clinic booking app','StockWatch app','Menu bar','Sync and backup','Other'];
const DEV=()=>{const u=navigator.userAgent;const b=/Edg\//.test(u)?'Edge':/Firefox\//.test(u)?'Firefox':/Chrome\//.test(u)?'Chrome':/Safari\//.test(u)?'Safari':'Browser';const os=/Android/.test(u)?'Android':/iPhone|iPad/.test(u)?'iOS':/Windows/.test(u)?'Windows':/Mac OS/.test(u)?'macOS':/Linux/.test(u)?'Linux':'';return b+(os?' on '+os:'')+', screen '+innerWidth+' x '+innerHeight};
const SEVS=['Critical','High','Medium','Low'];const normSev=v=>({Major:'High',Minor:'Low'}[v]||v);
const bid=(r,i)=>r.id||('BUG-'+(101+i));
/* quality check: what a developer needs from a defect report */
function quality(r){const L=r.steps.split('\n').filter(x=>x.trim()).length;const t=r.title.trim();
 return[['A clear title (more than 10 characters, not just "bug")',t.length>10&&!/^(bug|error|problem|broken|issue)\.?$/i.test(t)],['Steps a stranger can repeat (at least 2 lines)',L>=2],['What you expected',r.exp.trim().length>=8],['What actually happened',r.act.trim().length>=8],['Where it happened (browser and screen size)',r.dev.trim().length>=6],['Pre-conditions (what must be true before step 1)',(r.pre||'').trim().length>=8],['Evidence (what screenshot or recording you would attach)',(r.evid||'').trim().length>=8]]}
const md=(r,i)=>{const n=i==null?0:i;const sv=normSev(r.sev)+(r.why&&r.why.trim()?' ('+r.why.trim()+')':'');const st=r.steps.split('\n').filter(x=>x.trim()).map((x,k)=>(/^\s*\d+[.)]/.test(x)?x.trim():(k+1)+'. '+x.trim())).join('\n');
 return `### Filled-In Bug Report\n* **Bug ID / Title:** [${bid(r,n)}] ${r.title}\n* **Environment:** ${r.dev} / ${r.page}\n* **Severity / Priority:** ${sv}\n* **Pre-conditions:** ${r.pre||'(none written)'}\n* **Step-by-Step Reproduction:**\n${st}\n* **Expected Result:** ${r.exp}\n* **Actual Result:** ${r.act}\n* **Attachments / Evidence:** ${r.evid||'(none written)'}\n`};
function form(r){r=r||{page:'Home',sev:'Medium',why:'',title:'',pre:'',steps:'',exp:'',act:'',evid:'',dev:DEV()};const sv=normSev(r.sev);
 return `<div class="card"><h2>${S.editing!==null?'Edit this report':'Write a Filled-In Bug Report'}</h2><div class="mute">Write it so a developer who has never seen the problem can repeat it and fix it. The boxes follow a professional bug report, in this order.</div>
 <details class="ex"><summary>See a filled-in example</summary><div class="exb"><b>Bug ID / Title:</b> [BUG-104] Free delivery incorrectly applied on orders totaling exactly R100<br><b>Environment:</b> Staging Environment / Google Chrome (Desktop) / Version 124.0<br><b>Severity / Priority:</b> Medium (incorrect financial or business logic applied at checkout)<br><b>Pre-conditions:</b> User is logged in and has an empty shopping cart.<br><b>Step-by-Step Reproduction:</b><br>1. Navigate to the online shop catalog.<br>2. Add a single product priced at exactly R100.00 to the cart.<br>3. Proceed to the checkout summary page.<br>4. Observe the delivery fee under the order totals.<br><b>Expected Result:</b> A standard delivery fee applies, because free delivery needs an order <b>above</b> R100.00 (R100.01 or more).<br><b>Actual Result:</b> The system applies <b>Free Delivery</b> although the subtotal is exactly R100.00.<br><b>Attachments / Evidence:</b> Screenshot: checkout screen showing an R100 subtotal with an R0.00 delivery fee.</div></details>
 <label>1. Title (the Bug ID is added for you)</label><input id="f-title" value="${esc(r.title)}" placeholder="Specific, e.g. Menu covers the Pay button on a phone">
 <label>2. Where in the app?</label><select id="f-page">${PAGES.map(p=>`<option ${p===r.page?'selected':''}>${p}</option>`).join('')}</select>
 <label>3. Environment: browser and screen</label><input id="f-dev" value="${esc(r.dev)}">
 <label>4. Severity / Priority</label><select id="f-sev">${SEVS.map(p=>`<option ${p===sv?'selected':''}>${p}</option>`).join('')}</select><input id="f-why" value="${esc(r.why||'')}" placeholder="Why, in a few words, e.g. wrong money shown at checkout"><div class="mute">Critical: wrong money or data, or the page is unusable. High: a feature is broken. Medium: works but wrong in some cases. Low: looks wrong or is awkward.</div>
 <label>5. Pre-conditions</label><input id="f-pre" value="${esc(r.pre||'')}" placeholder="What must be true before step 1, e.g. Logged in, empty cart">
 <label>6. Step-by-Step Reproduction (one per line)</label><textarea id="f-steps" rows="4" placeholder="1. Open the Online shop on a phone&#10;2. Add any product&#10;3. Scroll down">${esc(r.steps)}</textarea>
 <label>7. Expected Result</label><input id="f-exp" value="${esc(r.exp)}" placeholder="The Pay button stays visible">
 <label>8. Actual Result</label><input id="f-act" value="${esc(r.act)}" placeholder="The menu sits on top of the Pay button">
 <label>9. Attachments / Evidence</label><input id="f-evid" value="${esc(r.evid||'')}" placeholder="Screenshot: the shop on a phone with the menu over the Pay button">
 <div style="margin-top:10px"><button class="pri" data-a="save">${S.editing!==null?'Save changes':'Add this report'}</button> ${S.editing!==null?'<button data-a="cancel">Cancel</button>':''}</div><div id="f-msg" class="mute"></div></div>`}
function list(){return S.items.length?S.items.map((r,i)=>{const q=quality(r);const n=q.filter(x=>x[1]).length;
 return `<div class="card"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag">${esc(r.page)}</span><span class="tag">${esc(normSev(r.sev))}</span><span class="tag">quality ${n}/7</span></div><h3 style="margin-top:6px">${esc(bid(r,i))} ${esc(r.title)}</h3><pre>${esc(md(r,i))}</pre>
 <div class="q">${q.map(([t,ok])=>`<span class="${ok?'y':'n'}">${ok?'Has: ':'Missing: '}${esc(t)}</span>`).join('')}</div>
 <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button data-a="edit" data-i="${i}">Edit</button><button data-a="copy" data-i="${i}">Copy</button><button data-a="del" data-i="${i}">Delete</button></div></div>`}).join(''):'<div class="card mute">No reports yet. Use the app like a real user and write down the first thing that looks wrong.</div>'}
function render(){const n=S.items.length,good=S.items.filter(r=>quality(r).every(x=>x[1])).length;
 $('v').innerHTML=`<div class="card" style="border-left:4px solid #b38e52"><h2>Why test this app?</h2><div>This Practice Lab is real software, so it has real problems: something that looks wrong on your phone, a confusing word, a button that does nothing. Finding and reporting them is the best practice there is, and your reports become portfolio evidence. I (the developer) will read the reports you copy to me and fix what is real.</div><div class="cof">When you find a dent in a customer's cup you do not just say "the cup is bad". You say which cup, what you saw and what you expected. Same here.</div><div class="mute">${n} report${n===1?'':'s'} written · ${good} with full quality (7 of 7). The goal in the ticket is 3 good ones.</div></div>
 <div class="two"><div>${form(S.editing!==null?S.items[S.editing]:null)}</div><div>${list()}${n?`<div class="card"><button data-a="copyall">Copy all reports (to send)</button> <button data-a="dl">Download as a file</button></div>`:''}</div></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.a==='save'){const r={page:$('f-page').value,sev:$('f-sev').value,why:$('f-why').value,title:$('f-title').value,pre:$('f-pre').value,steps:$('f-steps').value,exp:$('f-exp').value,act:$('f-act').value,evid:$('f-evid').value,dev:$('f-dev').value,ts:Date.now()};
  if(r.title.trim().length<4||r.steps.trim().length<4){$('f-msg').textContent='Add at least a title and some steps.';return}
  if(S.editing!==null){S.items[S.editing]=Object.assign(S.items[S.editing],r);S.editing=null}else{r.id='BUG-'+(Math.max(100,...S.items.map((x,k)=>+((x.id||'BUG-'+(101+k)).slice(4))))+1);S.items.push(r)}save();render();window.scrollTo(0,0);return}
 if(d.a==='cancel'){S.editing=null;render();return}
 if(d.a==='edit'){S.editing=+d.i;render();window.scrollTo(0,0);return}
 if(d.a==='del'){if(confirm('Delete this report?')){S.items.splice(+d.i,1);save();render()}return}
 if(d.a==='copy'){navigator.clipboard&&navigator.clipboard.writeText(md(S.items[+d.i],+d.i)).then(()=>{b.textContent='Copied'},()=>{b.textContent='Copy blocked by the browser'});return}
 if(d.a==='copyall'){navigator.clipboard&&navigator.clipboard.writeText('# Bugs found in the Practice Lab\n\n'+S.items.map((r,i)=>md(r,i)).join('\n')).then(()=>{b.textContent='Copied'},()=>{b.textContent='Copy blocked by the browser'});return}
 if(d.a==='dl'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['# Bugs found in the Practice Lab\n\n'+S.items.map((r,i)=>md(r,i)).join('\n')],{type:'text/markdown'}));a.download='practice-lab-bug-reports.md';a.click();return}});
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script><script src="tickets.js"></script><script src="ticketpanel.js"></script><script src="analogy.js"></script><script src="nav.js"></script><!--SYNC--><script src="sync.js"></script><!--/SYNC-->
</body></html>
