*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header h1{font-size:18px;margin:0}header h1 span{color:var(--accent)}.sp{flex:1}
header a{color:#fff;border:1px solid #ffffff44;border-radius:8px;padding:5px 11px;font-size:13px;text-decoration:none}
main{max-width:900px;margin:auto;padding:14px 16px 90px}nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:10px;font-weight:600}button:disabled{opacity:.5;cursor:default}
button.on,button.pri{background:var(--blue);border-color:var(--blue);color:#fff}@media(prefers-color-scheme:dark){button.on,button.pri{color:#0f131a}}

h2{margin:0 0 6px;font-size:20px}h3{margin:0 0 4px;font-size:15.5px;color:var(--brand)}@media(prefers-color-scheme:dark){h3{color:var(--accent)}}
.mute{color:var(--mute);font-size:14px}.plain{border-left:3px solid var(--blue);padding-left:10px}.cof{border-left:3px solid var(--accent);padding:5px 10px;margin-top:8px;background:#b08d5714;border-radius:4px;font-size:14.5px}
.hero{background:linear-gradient(135deg,#11203b,#26406e);color:#fff;border:0}.hero .mute{color:#cfd8e6}.bar{height:9px;background:#ffffff33;border-radius:99px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--accent)}

.chips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.chips button{font:600 12.5px ui-monospace,Menlo,monospace;padding:3px 8px;border-radius:7px}

table.r{border-collapse:collapse;font-size:13.5px;min-width:60%;margin-top:8px}table.r th,table.r td{border:1px solid var(--line);padding:4px 9px;text-align:left}table.r th{background:var(--bg)}.scroll{overflow:auto;max-height:300px}
.res{border-radius:10px;padding:10px 12px;margin-top:10px}.res.ok{background:#16794a1f}.res.no{background:#c0392b1f}.res.info{background:#2563eb1a}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.steps button{padding:5px 10px;font-size:13px}.steps .done{border-color:var(--green)}

.k{color:var(--blue);font-weight:700;cursor:pointer}.xl{background:#2563eb12;border:1px solid #2563eb33;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14.5px}.xl:empty{display:none}.xl-row{margin:3px 0}
.wz{border-left:4px solid var(--accent)}.stage{background:#b08d5714;border-radius:8px;padding:8px 10px;margin:8px 0}
table.intro td.hl,table.intro th.hl{background:#2563eb33;outline:2px solid var(--blue)}

<header><h1>🕵️ <span>SQL</span> Data Detective</h1><div class="sp"></div><a href="tickets.html">Tickets</a><a href="start-here.html">Start here</a><a href="index.html">Home</a></header>

<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ======== the coffee shop database (data bugs are planted on purpose) ======== */
const PRODUCTS=[[1,'Flat White','Coffee',38],[2,'Cappuccino','Coffee',42],[3,'Espresso','Coffee',28],[4,'Filter Coffee','Coffee',25],[5,'Iced Latte','Coffee',45],[6,'Blueberry Muffin','Food',30],[7,'Croissant','Food',32],[8,'Beans 1kg','Retail',280]];
const CUST=[[1,'Thandi Ndlovu','Johannesburg','2025-03-12'],[2,'Pieter Botha','Pretoria','2025-06-01'],[3,'Aisha Patel','Durban','2025-07-19'],[4,'Sipho Dlamini','Johannesburg','2025-09-02'],[5,'Lerato Mokoena','Pretoria','2025-10-30'],[6,'James Smith','Cape Town','2026-01-14'],[7,'Naledi Khumalo','Johannesburg','2026-02-08'],[8,'Ruan van Wyk','Cape Town','2026-03-21'],[9,'Fatima Osman','Durban','2026-05-05'],[10,'Zodwa Sithole','Pretoria','2026-08-17']];
const STOCK=[[1,40,'2026-11-20'],[2,25,'2026-11-15'],[3,60,'2027-03-01'],[4,18,'2026-10-20'],[5,-5,'2026-12-01'],[6,32,'2026-10-25'],[7,0,'2026-11-30'],[8,-12,'2027-06-01']];
function orders(){const price=p=>PRODUCTS[p-1][3];const o=[];
 for(let i=1;i<=40;i++){const c=((i*3)%10)+1,p=((i*5)%8)+1,q=(i%4)+1;o.push([i,c,p,q,'2026-10-'+String((i%28)+1).padStart(2,'0'),q*price(p)])}
 [7,19,33].forEach(i=>o[i-1][5]+=10);                       // BUG: wrong totals
 o[11][1]=99;o[27][1]=77;                                    // BUG: customers that do not exist
 o[14][3]=-1;o[14][5]=-price(o[14][2]);o[35][3]=0;o[35][5]=0; // BUG: impossible quantities
 const d=[...o[4]];d[0]=41;o.push(d);                        // BUG: duplicate order
 return o}
let SQL=null,db=null;
function build(){db=new SQL.Database();db.run(`CREATE TABLE products(id INTEGER PRIMARY KEY,name TEXT,category TEXT,price INTEGER);CREATE TABLE customers(id INTEGER PRIMARY KEY,name TEXT,city TEXT,joined TEXT);CREATE TABLE orders(id INTEGER PRIMARY KEY,customer_id INTEGER,product_id INTEGER,qty INTEGER,order_date TEXT,total INTEGER);CREATE TABLE stock(product_id INTEGER,qty_on_hand INTEGER,expiry TEXT);`);
 const ins=(t,rows)=>{const n=rows[0].length;const st=db.prepare(`INSERT INTO ${t} VALUES(${Array(n).fill('?').join(',')})`);rows.forEach(r=>st.run(r));st.free()};
 ins('products',PRODUCTS);ins('customers',CUST);ins('orders',orders());ins('stock',STOCK)}
function run(sql){const r=db.exec(sql);return r.length?r[r.length-1]:{columns:[],values:[]}}
const norm=(res,ordered)=>{const rows=res.values.map(r=>r.map(v=>v===null?'NULL':String(v)).join('|'));return ordered?rows:rows.sort()};
function compare(user,sol){const o=/order\s+by/i.test(sol.sql);const s=run(sol.sql);const u=user;
 if(u.columns.length!==s.columns.length)return[false,`Your answer has ${u.columns.length} column(s), but the mission needs ${s.columns.length}.`];
 const a=norm(u,o),b=norm(s,o);if(a.length!==b.length)return[false,`Your query returned ${a.length} row(s); the answer has a different number of rows.`];
 for(let i=0;i<a.length;i++)if(a[i]!==b[i])return[false,'Right number of rows, but some values differ. Check your conditions'+(o?' and the order':'')+'.'];
 return[true,'']}
function table(res){if(!res.columns.length)return '<div class="mute">The query ran but returned no table (no rows).</div>';const rows=res.values.slice(0,100);
 return `<div class="scroll"><table class="r"><tr>${res.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${v===null?'<i class="mute">NULL</i>':esc(v)}</td>`).join('')}</tr>`).join('')}</table></div><div class="mute">${res.values.length} row${res.values.length===1?'':'s'}${res.values.length>100?' (showing 100)':''}</div>`}
function tryRun(sql){try{return{res:run(sql)}}catch(e){return{err:friendly(String(e.message||e))}}}
function friendly(m){const t=m.replace(/^Error:\s*/,'');let tip='Check spelling, commas and quotes. Text values need single quotes, like \'Pretoria\'.';
 if(/no such table/i.test(t))tip='That table name does not exist. Open “The tables” to see the names.';else if(/no such column/i.test(t))tip='That column name does not exist. Open “The tables” to see the exact column names.';else if(/syntax error/i.test(t))tip='SQL could not understand the sentence. Check word order: SELECT … FROM … WHERE … ORDER BY …';
 return `<b>SQL says:</b> ${esc(t)}<br><span class="mute">Tip: ${tip}</span>`}

/* ======== lessons ======== */
const L=[
{t:'Ask the database a question',plain:'A <b>database</b> is a set of <b>tables</b>, like spreadsheets. <code>SELECT</code> says what you want to see, <code>FROM</code> says which table. That is already 80% of everyday SQL.',cof:'The table is the price list on the wall. SELECT is reading part of it out loud.',ex:'SELECT * FROM products;',why:'<code>*</code> means “all columns”.',mission:'Show only the <b>name</b> and <b>price</b> of every product.',sol:'SELECT name, price FROM products',h:['You want two columns, so list them after SELECT, separated by a comma.','SELECT column1, column2 FROM table','SELECT name, price FROM products']},
{t:'Filter with WHERE',plain:'<code>WHERE</code> keeps only the rows that match a rule. Use <code>=</code>, <code>&gt;</code>, <code>&lt;</code>. Text goes in single quotes.',cof:'“Only show me the food items” — you skip every coffee on the price list.',ex:"SELECT name, price FROM products WHERE category = 'Food';",why:"The rule category = 'Food' decides which rows are kept.",mission:'Show the <b>name</b> and <b>price</b> of products that cost <b>more than 35</b>.',sol:'SELECT name, price FROM products WHERE price > 35',h:['The rule is about price, and “more than” means the &gt; sign.','…FROM products WHERE price > ___','SELECT name, price FROM products WHERE price > 35']},
{t:'Sort and limit',plain:'<code>ORDER BY</code> sorts the result (<code>DESC</code> = biggest first). <code>LIMIT</code> keeps only the first few rows.',cof:'“What are my three priciest items?” Sort the list by price, read the top three.',ex:'SELECT name, price FROM products ORDER BY price DESC;',why:'DESC means high to low. Without it you get low to high.',mission:'Show the <b>3 most expensive</b> products: <b>name</b> and <b>price</b>, most expensive first.',sol:'SELECT name, price FROM products ORDER BY price DESC LIMIT 3',h:['Sort by price, high to low, then stop after 3 rows.','…ORDER BY price DESC LIMIT ___','SELECT name, price FROM products ORDER BY price DESC LIMIT 3']},
{t:'Combine rules: AND, OR',plain:'<code>AND</code> = both rules must be true. <code>OR</code> = either rule is enough. Dates written as 2026-01-01 can be compared with &gt;=.',cof:'“Pretoria customers who joined this year” (both true) vs “Durban or Cape Town” (either).',ex:"SELECT name, city FROM customers WHERE city = 'Durban' OR city = 'Cape Town';",why:'Either city is enough for a customer to appear.',mission:"Show the <b>name</b> of customers in <b>Pretoria</b> who joined on or after <b>2026-01-01</b>.",sol:"SELECT name FROM customers WHERE city = 'Pretoria' AND joined >= '2026-01-01'",h:['Two rules that must both be true: use AND.',"…WHERE city = 'Pretoria' AND joined >= '…'","SELECT name FROM customers WHERE city = 'Pretoria' AND joined >= '2026-01-01'"]},
{t:'Count and add up',plain:'<code>COUNT(*)</code> counts rows. <code>SUM(column)</code> adds numbers. These are how testers check “do the totals match?”.',cof:'At closing time you count the slips (COUNT) and add up the till (SUM).',ex:'SELECT COUNT(*) FROM orders;',why:'The answer is one row with one number.',mission:'Add up the <b>total</b> column of the <b>orders</b> table: the money in all orders.',sol:'SELECT SUM(total) FROM orders',h:['Use SUM on the total column.','SELECT SUM(___) FROM orders','SELECT SUM(total) FROM orders']},
{t:'Group things',plain:'<code>GROUP BY</code> makes one line per group, and counts or adds inside each group.',cof:'“How many of each drink did we sell?” Sort the slips into piles per drink, then count each pile.',ex:'SELECT category, COUNT(*) FROM products GROUP BY category;',why:'One row per category, with how many products it has.',mission:'For each <b>product_id</b>, count how many orders it has. Show <b>product_id</b> and the count, ordered by product_id.',sol:'SELECT product_id, COUNT(*) FROM orders GROUP BY product_id ORDER BY product_id',h:['Group the orders table by product_id.','SELECT product_id, COUNT(*) FROM orders GROUP BY ___ ORDER BY ___','SELECT product_id, COUNT(*) FROM orders GROUP BY product_id ORDER BY product_id']},
{t:'Join tables together',plain:'Information lives in different tables. <code>JOIN … ON</code> matches rows using a shared id. Here orders store a <code>product_id</code>, and products store the name for that id.',cof:'The order slip says “product 3”. The price list says product 3 is Espresso. A join links the slip to the price list.',ex:'SELECT o.id, p.name FROM orders o JOIN products p ON p.id = o.product_id LIMIT 5;',why:'<code>o</code> and <code>p</code> are short nicknames for the tables.',mission:'For every order show the <b>order id</b> and the <b>product name</b>, ordered by order id.',sol:'SELECT o.id, p.name FROM orders o JOIN products p ON p.id = o.product_id ORDER BY o.id',h:['Start from orders, join products where product ids match.','SELECT o.id, p.name FROM orders o JOIN products p ON p.id = o.___ ORDER BY o.id','SELECT o.id, p.name FROM orders o JOIN products p ON p.id = o.product_id ORDER BY o.id']},
{t:'Find what is missing (your first bug hunt)',plain:'A normal JOIN drops rows with no match. A <code>LEFT JOIN</code> keeps them, and rows with no match have <code>NULL</code> on the right side. <code>IS NULL</code> finds them. Testers use this to find <b>orphan</b> records.',cof:'A delivery slip for a customer who is not in your customer book. The slip exists; the customer does not.',ex:'SELECT c.name FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NULL;',why:'Customers with no orders. This returns nothing: an empty result is sometimes the good news.',mission:'Find the <b>ids of orders</b> whose customer <b>does not exist</b> in the customers table.',sol:'SELECT o.id FROM orders o LEFT JOIN customers c ON c.id = o.customer_id WHERE c.id IS NULL',h:['Start from orders, LEFT JOIN customers, keep rows where the customer side is empty.','…LEFT JOIN customers c ON c.id = o.customer_id WHERE c.id IS ___','SELECT o.id FROM orders o LEFT JOIN customers c ON c.id = o.customer_id WHERE c.id IS NULL']}];
/* ======== detective cases ======== */
const CASES=[
{t:'The wrong totals',story:'Finance says the money doesn’t add up. Every order total should equal <b>qty × the product’s price</b>.',mission:'Find the <b>ids</b> of orders whose total is wrong.',sol:'SELECT o.id FROM orders o JOIN products p ON p.id = o.product_id WHERE o.total <> o.qty * p.price',h:['You need the price, which lives in products, so JOIN it.','…WHERE o.total <> o.qty * p.price  (<> means “is not equal to”)','SELECT o.id FROM orders o JOIN products p ON p.id = o.product_id WHERE o.total <> o.qty * p.price'],sev:'Major',what:'orders where total does not equal qty × price'},
{t:'The double order',story:'A customer says they were charged twice. Look for orders that are <b>exact copies</b>: same customer, product, date and quantity.',mission:'Show <b>customer_id, product_id, order_date, qty</b> and how many times that combination appears, only where it appears <b>more than once</b>.',sol:'SELECT customer_id, product_id, order_date, qty, COUNT(*) FROM orders GROUP BY customer_id, product_id, order_date, qty HAVING COUNT(*) > 1',h:['Group by all four columns and count each group.','New word: <code>HAVING</code> filters groups (WHERE filters rows). …GROUP BY a, b, c, d HAVING COUNT(*) > 1','SELECT customer_id, product_id, order_date, qty, COUNT(*) FROM orders GROUP BY customer_id, product_id, order_date, qty HAVING COUNT(*) > 1'],sev:'Major',what:'duplicate orders'},
{t:'Impossible quantities',story:'Nobody can order zero or minus one coffees. Find the bad rows.',mission:'Find the <b>ids</b> of orders where <b>qty is 0 or less</b>.',sol:'SELECT id FROM orders WHERE qty <= 0',h:['A simple WHERE on the qty column.','…WHERE qty <= ___','SELECT id FROM orders WHERE qty <= 0'],sev:'Major',what:'orders with quantity 0 or negative'},
{t:'Negative stock',story:'The storeroom can’t hold minus five milk cartons. Check the stock table.',mission:'Show <b>product_id</b> and <b>qty_on_hand</b> for stock where the quantity is <b>below zero</b>.',sol:'SELECT product_id, qty_on_hand FROM stock WHERE qty_on_hand < 0',h:['WHERE the quantity is less than 0.','SELECT product_id, qty_on_hand FROM stock WHERE qty_on_hand < ___','SELECT product_id, qty_on_hand FROM stock WHERE qty_on_hand < 0'],sev:'Critical',what:'stock records with a negative quantity'},
{t:'Expired but still on the shelf',story:'Today is <b>2026-11-02</b>. Anything with an expiry date before today and stock still on hand is a food-safety problem.',mission:'Show the <b>product_id</b> of stock that is <b>expired</b> (expiry before 2026-11-02) and still has <b>quantity above zero</b>.',sol:"SELECT product_id FROM stock WHERE expiry < '2026-11-02' AND qty_on_hand > 0",h:['Two rules at once: expired AND quantity above zero.',"…WHERE expiry < '2026-11-02' AND qty_on_hand > 0","SELECT product_id FROM stock WHERE expiry < '2026-11-02' AND qty_on_hand > 0"],sev:'Critical',what:'expired products that still have stock on hand'}];
const KW=[['SELECT','choose which columns to show'],['FROM','which table to look in'],['WHERE','keep only rows that match a rule'],['ORDER BY','sort the result (DESC = high to low)'],['LIMIT','stop after this many rows'],['COUNT / SUM','count rows / add numbers'],['GROUP BY','one line per group'],['HAVING','filter the groups'],['JOIN … ON','link two tables by a shared id'],['LEFT JOIN','keep rows even with no match'],['IS NULL','the value is empty / missing'],['AND / OR','both rules / either rule']];
const SCHEMA=[['products','id, name, category, price'],['customers','id, name, city, joined'],['orders','id, customer_id, product_id, qty, order_date, total'],['stock','product_id, qty_on_hand, expiry']];
const CHIPS=['SELECT','*','FROM','WHERE','ORDER BY','DESC','LIMIT','COUNT(*)','SUM(','GROUP BY','HAVING','JOIN','ON','LEFT JOIN','IS NULL','AND','OR',"''",'<>','>=','<=',',','(',')'];

/* ======== state + ui ======== */
const KEY='sqllab-v1';let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch{S={}}S.done=S.done||{};S.cases=S.cases||{};S.xp=S.xp||0;S.peek=S.peek||{};S.drafts=S.drafts||{};S.teach=S.teach!==false;S.iq=S.iq||{};S.tab=S.tab||'intro';S.i=S.i||0;S.c=S.c||0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
const RANKS=[[0,'Data Rookie'],[60,'Query Cadet'],[160,'Data Detective'],[260,'Chief Inspector']];const rk=()=>{let r=0;RANKS.forEach((x,i)=>{if(S.xp>=x[0])r=i});return r};
const tabs=[['intro','0 · Meet the data'],['learn','1 · Learn SQL'],['cases','2 · Data Detective cases'],['play','3 · Playground']];
let hint={},last={};
function drawTop(){const r=rk(),nx=RANKS[r+1],pct=nx?Math.round((S.xp-RANKS[r][0])/(nx[0]-RANKS[r][0])*100):100;const dn=Object.keys(S.done).length,cn=Object.keys(S.cases).length;
 $('top').innerHTML=`<div class="card hero"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h2 style="margin:0">${RANKS[r][1]}</h2><span>${S.xp} XP</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="mute">${nx?(nx[0]-S.xp)+' XP to '+nx[1]:'Top rank!'} · Lessons ${dn}/${L.length} · Cases ${cn}/${CASES.length}</div></div>`;
 $('nav').innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('')}
const tables=()=>`<details class="card"><summary><b>📋 The tables</b> <span class="mute">(tap to see names)</span></summary>${SCHEMA.map(s=>`<div style="margin-top:6px"><code>${s[0]}</code> <span class="mute">${s[1]}</span></div>`).join('')}<div class="mute" style="margin-top:6px">Orders is the “sales slips” table; products is the price list; stock is the storeroom.</div></details>`;
const editor=(id,val)=>`<div class="chips">${CHIPS.map(c=>`<button type="button" data-chip="${esc(c)}|${id}">${esc(c)}</button>`).join('')}</div><textarea class="sql" id="${id}" spellcheck="false" placeholder="Type your SQL here, or tap the keyword buttons above…">${esc(val||'')}</textarea>`;
function report(c){const q=c.sol;return `DATA DEFECT: ${c.what}\nEnvironment: Sunrise Café practice database\nHow found: SQL query\n  ${q}\nExpected: none (this should never happen)\nActual: see result rows from the query\nSeverity: ${c.sev}\nNext step: send to developer with the query so they can reproduce it.`}
function cur(){return S.tab==='learn'?L[S.i]:CASES[S.c]}
document.addEventListener('click',e=>{const d=e.target.dataset||{};
 if(d.tab){S.tab=d.tab;save();render();return}
 if(d.l!==undefined){S.i=+d.l;hint={};save();render();return}
 if(d.c!==undefined){S.c=+d.c;hint={};save();render();return}
 if(d.prev){S.i--;hint={};save();render();return}if(d.next){S.i++;hint={};save();render();return}
 if(d.chip){const[txt,id]=d.chip.split('|');const t=$(id);const a=t.selectionStart??t.value.length,b=t.selectionEnd??a;const add=(/^[,)]$/.test(txt)?'':(a&&!/\s$/.test(t.value.slice(0,a))?' ':''))+txt+(/^[,(]$|^SUM\($/.test(txt)||txt==="''"?'':' ');t.value=t.value.slice(0,a)+add+t.value.slice(b);t.focus();const p=a+add.length-(txt==="''"?2:0);t.setSelectionRange(p,p);t.dispatchEvent(new Event('input'));return}
 if(d.ex){const r=tryRun(L[S.i].ex);$('exout').innerHTML=r.err?`<div class="res no">${r.err}</div>`:table(r.res);return}
 if(d.run){const t=$(d.run).value;const r=tryRun(t);$('out').innerHTML=r.err?`<div class="res no">${r.err}</div>`:table(r.res);return}

let IM='table';
function introHTML(){const r=run('SELECT * FROM orders LIMIT 6');const hl=(ri,ci)=>IM==='table'?'hl':IM==='row'?(ri===1?'hl':''):IM==='col'?(ci===3?'hl':''):IM==='cell'?(ri===1&&ci===3?'hl':''):'';
 const txt={table:'This whole grid is a <b>table</b>. It is called <code>orders</code>. Think of a stack of sales slips.',row:'This highlighted line is a <b>row</b>: one record. One row = <b>one order slip</b>.',col:'This highlighted strip is a <b>column</b>: one kind of information. Every slip has a “qty” box, so qty is a column.',cell:'This one box is a <b>cell</b>: a single value. This slip’s qty is 3.'}[IM];
 const done=Object.keys(S.iq).length===IQ.length&&IQ.every((q,i)=>S.iq[i]===q.a);
 return `<div class="card"><h2>0 · Meet the data</h2><div class="plain">Before any SQL, you need to know what you are asking questions <i>about</i>. A <b>database</b> is a collection of <b>tables</b>. Each table looks like a spreadsheet.</div><div class="cof">☕ Picture a stack of sales slips. Each slip has boxes: customer, product, quantity, total. The stack is the table. One slip is a row. One box type (“quantity”) is a column.</div></div>
 <div class="card"><div class="btns" style="margin:0 0 8px">${[['table','The table'],['row','A row'],['col','A column'],['cell','A cell']].map(([k,l])=>`<button data-im="${k}" class="${IM===k?'on':''}">${l}</button>`).join('')}</div><div class="scroll"><table class="r intro"><tr>${r.columns.map((c,ci)=>`<th class="${hl(-1,ci)}">${esc(c)}</th>`).join('')}</tr>${r.values.map((x,ri)=>`<tr>${x.map((v,ci)=>`<td class="${hl(ri,ci)}">${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div><div class="res info" style="margin-top:8px">${txt}</div></div>
 <div class="card"><h3>Tiny quiz (3 questions)</h3>${IQ.map((q,i)=>`<div style="margin:10px 0"><div><b>${i+1}.</b> ${q.q}</div>${q.o.map((o,j)=>`<button class="opt" data-iq="${i}|${j}" ${S.iq[i]!==undefined&&S.iq[i]===q.a?'disabled':''}>${o}</button>`).join('')}${S.iq[i]!==undefined?`<div class="res ${S.iq[i]===q.a?'ok':'no'}">${S.iq[i]===q.a?'✅ '+q.w:'Not quite, try another one.'}</div>`:''}</div>`).join('')}
 ${done?`<div class="res ok"><b>🎉 You understand the basics of a database.</b> ${S.xp>=0&&!S.introXp?'':''}</div><div class="btns"><button class="pri" data-tab="learn">Start lesson 1 →</button></div>`:''}</div>`}
/* --- render --- */
const teachBar=()=>`<div class="card" style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><div><b>🎓 Teaching mode: ${S.teach?'ON':'OFF'}</b><div class="mute">${S.teach?'The app builds queries with you and explains every step in plain English.':'You are on your own. Explanations are still one tap away.'}</div></div><button data-teach="1">${S.teach?'Switch off':'Switch on'}</button></div>`;
const toolBtns=src=>`<button data-watch="${src}">👀 Watch it run</button>${S.teach?'':`<button data-explain="1">🗣 Explain in plain English</button>`}`;
const xlBox=()=>`<div id="xl" class="xl"></div><div id="watch">${WT&&WT.src!=='ex'?watchHTML():''}</div>`;
function render(){drawTop();const v=$('v');
 if(!SQL){v.innerHTML='<div class="card">Loading the SQL engine…</div>';return}
 if(S.tab==='intro'){v.innerHTML=introHTML();return}
 if(S.tab==='learn'){const l=L[S.i],id='ed';
  v.innerHTML=`${teachBar()}<div class="card"><h2>New to SQL? Start here.</h2><div class="plain"><b>SQL</b> (say “sequel”) is how you ask a database questions. The screens of an app only show part of the data. Testers use SQL to check that what is <i>stored</i> matches what the screen <i>says</i>, to find duplicates and missing records, and to set up test data.</div><div class="cof">☕ The screen is the menu board. The database is the storeroom ledger. SQL lets you open the ledger and check it.</div><details style="margin-top:8px"><summary><b>Cheat sheet</b>: the 12 words you need</summary><table class="kw">${KW.map(k=>`<tr><td><code>${k[0]}</code></td><td>${k[1]}</td></tr>`).join('')}</table></details></div>
   ${tables()}<div class="steps">${L.map((x,i)=>`<button data-l="${i}" class="${i===S.i?'on':''} ${S.done[i]?'done':''}">${S.done[i]?'✓ ':''}${i+1}</button>`).join('')}</div>
   <div class="card"><h3>Lesson ${S.i+1} of ${L.length}</h3><h2>${l.t}</h2><div class="plain">${l.plain}</div><div class="cof">☕ ${l.cof}</div>
   <h3 style="margin-top:12px">Try the example <span class="mute">(tap any blue word to learn what it means)</span></h3><pre class="rep" style="margin:4px 0">${kwHTML(l.ex)}</pre><div id="tokinfo" class="mute"></div>
   ${S.teach?`<div class="xl">${xlHTML(l.ex)}</div>`:''}<div class="btns"><button data-ex="1">▶ Run the example</button><button data-watch="ex">👀 Watch it run</button></div><div class="mute" style="margin-top:4px">${l.why}</div><div id="exout">${WT&&WT.src==='ex'?watchHTML():''}</div></div>
   ${S.teach?wizardHTML():''}
   <div class="card" style="border-left:4px solid var(--blue)"><h3>🎯 Your mission</h3><div>${l.mission}</div>${editor(id,S.drafts['L'+S.i])}${xlBox()}
   <div class="btns"><button data-run="${id}">▶ Run</button><button class="pri" data-check="L">✓ Check my answer</button><button data-hint="L">💡 Hint</button><button data-sol="L">Show answer</button>${toolBtns('ed')}</div><div id="out"></div></div>
   <div class="btns"><button data-prev="1" ${S.i===0?'disabled':''}>← Previous</button><button data-next="1" ${S.i===L.length-1?'disabled':''}>Next lesson →</button></div>`}
 if(S.tab==='cases'){const c=CASES[S.c];const all=CASES.every((_,i)=>S.cases[i]);
  v.innerHTML=`${teachBar()}<div class="card"><h2>🕵️ The Sunrise Café data mystery</h2><div class="plain">Something is wrong with the café’s data. You are the detective. Each case is a <b>real kind of data bug</b> that testers hunt for. Solve a case, then you get a ready-made <b>bug report</b> to practise reporting it.</div><div class="mute" style="margin-top:6px">New to SQL? Finish lessons 1–8 first. In teaching mode every case is built with you step by step.</div></div>${tables()}
   <div class="steps">${CASES.map((x,i)=>`<button data-c="${i}" class="${i===S.c?'on':''} ${S.cases[i]?'done':''}">${S.cases[i]?'✓ ':''}Case ${i+1}</button>`).join('')}</div>
   <div class="card"><h3>Case ${S.c+1} of ${CASES.length}</h3><h2>${c.t}</h2><div>${c.story}</div></div>
   ${S.teach?wizardHTML():''}
   <div class="card" style="border-left:4px solid var(--blue)"><h3>🎯 Your mission</h3><div>${c.mission}</div>${editor('ed',S.drafts['C'+S.c])}${xlBox()}
   <div class="btns"><button data-run="ed">▶ Run</button><button class="pri" data-check="C">✓ Check my answer</button><button data-hint="C">💡 Hint</button><button data-sol="C">Show answer</button>${toolBtns('ed')}</div><div id="out"></div></div>
   ${S.cases[S.c]?`<div class="card"><h3>📝 Your bug report (copy and tidy)</h3><pre class="rep" id="rep">${esc(report(c))}</pre><div class="btns"><button data-copy="1">Copy report</button></div></div>`:''}
   ${all?`<div class="card hero"><h2>🎉 Case closed!</h2><div>You found all 5 data bugs, plus the orphan orders from lesson 8. That is genuine tester work: checking the data behind the app.</div></div>`:''}`}
 if(S.tab==='play'){v.innerHTML=`${teachBar()}<div class="card"><h2>Playground</h2><div class="mute">Free practice. Nothing here is scored. Try anything; you cannot break the real thing. <button data-reset="1">Reset the data</button></div></div>${tables()}<div class="card">${editor('ed',S.drafts.P||'SELECT * FROM orders LIMIT 10;')}${xlBox()}<div class="btns"><button class="pri" data-run="ed">▶ Run</button>${toolBtns('ed')}</div><div id="out"></div></div>`}
 updXl()}
document.addEventListener('click',e=>{const d=e.target.dataset||{};
 if(d.teach){S.teach=!S.teach;save();render();return}
 if(d.explain){explainOn=true;updXl();return}
 if(d.tok){const k=d.tok;$('tokinfo').innerHTML=`ℹ️ <b>${k}</b>: ${KWMAP[k]||''}`;return}
 if(d.im){IM=d.im;render();return}
 if(d.iq){const[i,j]=d.iq.split('|').map(Number);S.iq[i]=j;const all=IQ.every((q,x)=>S.iq[x]===q.a);if(all&&!S.introXp){S.introXp=1;S.xp+=10}save();drawTop();render();return}
 if(d.wz!==undefined){const w=WZ[WS.key][WS.step],o=w.o[+d.wz];WS.ok=!!o[1];WS.msg=(o[1]?'✅ ':'❌ ')+o[2]+(o[1]?'':'<br><span class="mute">Try another one.</span>');if(o[1]){WS.parts.push({kw:w.kw,text:o[0]});WS.step++;if(WS.step<WZ[WS.key].length)WS.msg='✅ '+o[2]}render();return}
 if(d.wzreset){WS={key:'',step:0,parts:[],msg:'',ok:false};render();return}
 if(d.wzfill){const t=$('ed');t.value=wzQuery();t.dispatchEvent(new Event('input'));t.scrollIntoView({behavior:'smooth',block:'center'});return}
 if(d.watch){const sql=d.watch==='ex'?L[S.i].ex:$('ed').value;const st=stagesFor(sql);if(!st){const w=$('watch');if(w)w.innerHTML='<div class="card wz"><div class="res no">Type a query like <code>SELECT … FROM …</code> first, then I can show it running.</div></div>';else $('exout').innerHTML='<div class="res no">Could not read that query.</div>';return}
  WT={st,i:0,cnt:[],src:d.watch};const w=tgt();w.innerHTML=watchHTML();w.scrollIntoView({behavior:'smooth',block:'nearest'});return}
 if(d.wstep){WT.i=Math.max(0,Math.min(WT.st.length-1,WT.i+ +d.wstep));const w=tgt();w.innerHTML=watchHTML();return}
 if(d.wclose){const w=tgt();WT=null;if(w)w.innerHTML='';return}});
document.addEventListener('input',e=>{if(e.target.id==='ed')updXl()});

initSqlJs({locateFile:f=>f}).then(s=>{SQL=s;build();render()}).catch(e=>{$('v').innerHTML='<div class="card">Could not load the SQL engine: '+esc(e.message||e)+'</div>'});
</script><!--SYNC--><script src="sync.js"></script><!--/SYNC-->
</body></html>
