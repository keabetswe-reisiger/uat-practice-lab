<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StockWatch UAT Practice</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1f2430;--mute:#6b7280;--line:#e3ddd3;--brand:#5b3a29;--accent:#b08d57;--pass:#1b7f4b;--fail:#c0392b;--block:#b7791f;--pend:#8a8f98}
@media(prefers-color-scheme:dark){:root{--bg:#16181d;--card:#20242c;--ink:#eceff4;--mute:#9aa3b2;--line:#323844;--brand:#d9b38c}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{font-size:18px;margin:0;color:var(--brand)}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1400px;margin:auto}
@media(max-width:950px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.panel>h2{margin:0 0 2px;font-size:16px}.sub{color:var(--mute);font-size:13px;margin:0 0 10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 11px;border-radius:6px}
button.primary,.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
@media(prefers-color-scheme:dark){button.primary,.tabs button.on{color:#16181d}}
input,select,textarea{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.env{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.banner{padding:6px 10px;border-radius:6px;font-weight:700;font-size:13px;margin-bottom:8px}
.stg{background:#1b7f4b22;color:var(--pass)}.prod{background:#c0392b22;color:var(--fail)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.msg{padding:7px 10px;border-radius:6px;margin-top:8px;font-size:14px}.err{background:#c0392b22;color:var(--fail)}.ok{background:#1b7f4b22;color:var(--pass)}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--ink)}
.t-exp{background:#c0392b;color:#fff}.t-soon{background:#b7791f;color:#fff}.t-low{background:#2b6cb0;color:#fff}
.tc{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px}
.tc h3{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;color:#fff;white-space:nowrap;height:fit-content}
.b-Pending{background:var(--pend)}.b-Pass{background:var(--pass)}.b-Fail{background:var(--fail)}.b-Blocked{background:var(--block)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.stat{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}.stat b{display:block;font-size:21px}
.tip{background:#b08d5722;border-left:3px solid var(--accent);padding:8px 10px;font-size:13px;border-radius:4px;margin-bottom:10px}
.key{background:var(--brand);color:#fff;padding:10px 12px;border-radius:8px;margin:10px 0;font-weight:600}
@media(prefers-color-scheme:dark){.key{color:#16181d}}
.scroll{max-height:76vh;overflow:auto;padding-right:4px}
.lock{opacity:.35;pointer-events:none}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:13px}.top span{border:1px solid var(--line);border-radius:6px;padding:3px 8px}
</style>
<!--PWA--><meta name="theme-color" content="#0d0c0a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><!--/PWA-->
<!--BRAND--><link rel="stylesheet" href="brand.css"><!--/BRAND-->
</head>
<body>
<header><h1>StockWatch UAT Practice <small style="color:var(--mute);font-weight:400">· round 2 · harder bugs</small></h1><button id="reset">Reset workbook</button></header>
<main>

<section class="panel">
  <h2>System under test: StockWatch (mock)</h2>
  <p class="sub">Stock receiving, expiry tracking, stock-take and waste for a coffee shop. Resets when you refresh. “Today” in this system is fixed at <b>2026-10-26</b>.</p>
  <div class="env">
    <div><label>Environment</label><select id="env"><option>Staging</option><option>Production</option><option>Dev</option></select></div>
    <div><label>Version</label><select id="ver"><option>v1</option><option selected>v2</option></select></div>
    <div><label>Logged in as</label><select id="role"><option value="Lerato|Storeman">Lerato (Storeman)</option><option value="Sipho|Manager">Sipho (Manager)</option></select></div>
  </div>
  <div id="banner"></div>
  <div id="app"><div class="tabs" id="nav"></div><div class="top" id="top"></div><div id="screen"></div></div>
</section>

<section class="panel">
  <h2>UAT workbook</h2>
  <p class="sub">Brief → pre-flight → test → report → sign off.</p>
  <div class="tabs" id="wtabs"></div>
  <div class="scroll" id="wview"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* =================== SYSTEM UNDER TEST (deliberate bugs, see answer key) =================== */
const TODAY='2026-10-26';
const day=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5;
const daysTo=s=>day(s)-day(TODAY);
let items=[
 {id:1,name:'Arabica beans 1kg',cost:180,min:15,exp:true,batches:[{qty:40,exp:'2027-03-01'}]},
 {id:2,name:'Fresh milk 1L',cost:18,min:24,exp:true,batches:[{qty:24,exp:'2026-10-29'}]},
 {id:3,name:'Cups 12oz',cost:1.2,min:200,exp:false,batches:[{qty:500,exp:null}]},
 {id:4,name:'Vanilla syrup',cost:95,min:6,exp:true,batches:[{qty:12,exp:'2027-01-15'}]},
 {id:5,name:'Muffins',cost:14,min:10,exp:true,batches:[{qty:30,exp:'2026-10-27'}]},
 {id:6,name:'Oat milk 1L',cost:32,min:10,exp:true,batches:[{qty:6,exp:'2026-10-25'}]}];
let screen='stock',wasteLog=[],wasteTotal=0,counts=[],nextCount=1;
const qty=i=>i.batches.reduce((s,b)=>s+b.qty,0);
const isLow=i=>qty(i)<=i.min;
let lowAtLoad=items.filter(isLow).length;                       // BUG L1: low-stock header count is computed once and never refreshed
const me=()=>{const[n,r]=$('role').value.split('|');return{name:n,role:r}};
function nextExpiry(i){const d=i.batches.filter(b=>b.exp&&b.qty>0).map(b=>b.exp).sort();return d.length?d[d.length-1]:'—'}   // BUG E3: shows the latest expiry; should be the earliest (FEFO)
function status(i){
  const t=[];const d=i.batches.filter(b=>b.exp&&b.qty>0).map(b=>daysTo(b.exp));
  if(d.length){const m=Math.min(...d);if(m<0)t.push(['Expired','t-exp']);else if(m<3)t.push(['Expiring soon','t-soon'])}   // BUG E4: 3 days away should also be "Expiring soon" (<= 3)
  if(isLow(i))t.push(['Low stock','t-low']);return t;
}
function deduct(i,n){for(const b of i.batches.slice().sort((a,c)=>(a.exp||'9').localeCompare(c.exp||'9'))){const take=Math.min(b.qty,n);b.qty-=take;n-=take;if(!n)break}}

function renderEnv(){
  const e=$('env').value;
  $('banner').innerHTML=`<div class="banner ${e==='Staging'?'stg':'prod'}">${e==='Staging'?'STAGING · safe to test':e==='Production'?'PRODUCTION · live stock data. Do NOT run UAT here':'DEV · unstable, not for UAT'} · ${$('ver').value}</div>`;
  $('app').classList.toggle('lock',e==='Production');
}
function renderNav(){
  const tabs=[['stock','Stock'],['receive','Receive'],['count','Stock-take']];
  if($('ver').value==='v2')tabs.push(['waste','Waste']);
  if(!tabs.some(t=>t[0]===screen))screen='stock';
  $('nav').innerHTML=tabs.map(([k,l])=>`<button data-go="${k}" class="${screen===k?'on':''}">${l}</button>`).join('');
  $('top').innerHTML=`<span>Low stock: <b>${lowAtLoad}</b></span><span>Expired lines: <b>${items.filter(i=>status(i).some(s=>s[0]==='Expired')).length}</b></span>`;
}
const opts=()=>items.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('');
function renderScreen(){
  renderNav();let h='';
  if(screen==='stock')h=items.map(i=>`<div class="row"><span><b>${esc(i.name)}</b><br><small>Next expiry: ${nextExpiry(i)}</small></span><span style="text-align:right"><b>${qty(i)}</b> on hand (min ${i.min})<br>${status(i).map(([t,c])=>`<span class="tag ${c}">${t}</span>`).join(' ')}</span></div>`).join('');
  if(screen==='receive')h=`<label>Item</label><select id="ri">${opts()}</select><label>Quantity received</label><input id="rq" type="number">
    <label>Expiry date (items that expire)</label><input id="re" type="date"><div class="btns"><button class="primary" id="rsub">Receive stock</button></div><div id="rmsg"></div>`;
  if(screen==='count')h=`<label>Item</label><select id="ci">${opts()}</select><label>Counted quantity</label><input id="cq" type="number">
    <div class="btns"><button class="primary" id="csub">Submit count</button></div><div id="cmsg"></div>
    <h4 style="margin:12px 0 4px">Counts</h4>`+(counts.length?counts.map(c=>`<div class="row"><span>${esc(c.name)}: system ${c.sys}, counted ${c.cnt}<br><small>Variance ${c.v>0?'+':''}${c.v} (${c.pct}%)</small></span>${c.done?'<span class="tag">Adjusted</span>':`<button data-approve="${c.id}">Approve adjustment</button>`}</div>`).join(''):'<p class="sub">No counts yet.</p>');
  if(screen==='waste')h=`<label>Item</label><select id="wi">${opts()}</select><label>Quantity wasted</label><input id="wq" type="number">
    <label>Reason</label><select id="wr"><option value="">Select…</option><option>Expired</option><option>Damaged</option><option>Spillage</option><option>Other</option></select>
    <div class="btns"><button class="primary" id="wsub">Record waste</button></div><div id="wmsg"></div>
    <div class="row"><span>Total waste value</span><b>R${wasteTotal.toFixed(2)}</b></div>`+wasteLog.map(w=>`<div class="sub" style="margin:0">${esc(w.name)} × ${w.q} · ${w.reason||'no reason'} · R${w.val.toFixed(2)}</div>`).join('');
  $('screen').innerHTML=h;
}
document.addEventListener('click',e=>{
  const t=e.target,d=t.dataset||{},m=me();
  if(d.go){screen=d.go}
  else if(d.approve){                                            // BUG P6: Storeman can approve; should be Manager only
    const c=counts.find(x=>x.id==d.approve),i=items.find(x=>x.id===c.iid);
    if(c.v<0)deduct(i,-c.v);else i.batches[0].qty+=c.v;c.done=true;
  }
  else if(t.id==='rsub'){
    const i=items.find(x=>x.id==$('ri').value),q=Number($('rq').value),ex=$('re').value,msg=$('rmsg');
    if(!q){msg.innerHTML='<div class="msg err">Enter a quantity.</div>';return}                 // BUG R2: only blocks 0; negative numbers pass and reduce stock
    if(i.exp){
      if(!ex){msg.innerHTML='<div class="msg err">Expiry date is required.</div>';return}
      if(ex<TODAY){msg.innerHTML='<div class="msg err">Cannot receive expired stock.</div>';return}   // BUG R1: stock expiring today (or tomorrow-or-later is the rule) slips through; should require expiry after today
    }
    i.batches.push({qty:q,exp:i.exp?ex:null});renderScreen();$('rmsg').innerHTML='<div class="msg ok">Stock received.</div>';return;
  }
  else if(t.id==='csub'){
    const i=items.find(x=>x.id==$('ci').value),cnt=$('cq').value;
    if(cnt===''||Number(cnt)<0){$('cmsg').innerHTML='<div class="msg err">Enter a valid counted quantity.</div>';return}
    const sys=qty(i),c=Number(cnt),v=c-sys;
    counts.unshift({id:nextCount++,iid:i.id,name:i.name,sys,cnt:c,v,pct:(v/(c||1)*100).toFixed(1),done:false});   // BUG V5: variance % divides by counted, should divide by system qty
  }
  else if(t.id==='wsub'){
    const i=items.find(x=>x.id==$('wi').value),q=Number($('wq').value),r=$('wr').value,msg=$('wmsg');
    if(!q||q<=0){msg.innerHTML='<div class="msg err">Enter a quantity.</div>';return}
    if(q>qty(i)){msg.innerHTML='<div class="msg err">Cannot waste more than is on hand.</div>';return}
    if(!r&&q<10){msg.innerHTML='<div class="msg err">A reason is required.</div>';return}        // BUG W7: reason only enforced for small quantities
    deduct(i,q);const val=q*i.cost;wasteLog.unshift({name:i.name,q,reason:r,val});
    wasteTotal=val;                                                                              // BUG W8: overwrites the running total instead of adding
    renderScreen();$('wmsg').innerHTML='<div class="msg ok">Waste recorded.</div>';return;
  }
  else return;
  renderScreen();
});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='env'||id==='ver'||id==='role'){renderEnv();renderScreen()}});

/* =================== WORKBOOK =================== */
const BRIEF=[
 ['Purpose (why it exists)',[
  ['What problem does this solve?','The shop tracks stock on paper and WhatsApp. Milk and muffins expire unnoticed, counts do not match the books, and nobody knows what is being wasted.'],
  ['Who are the users and what must they do?','Storeman: receive deliveries, run stock-takes, record waste. Manager: see low/expiring stock and approve stock-take adjustments.'],
  ['What does “working correctly” look like?','Stock on hand is always right. Oldest stock is flagged first. Expired stock cannot be received. Only a Manager can change the books after a count. Waste is always explained and costed correctly.']]],
 ['Cycle (when)',[
  ['Which week are we in?','Week 2 of 3. Use the week selector to see how the release impact changes.'],
  ['What was planned in Week 1?','Scope: Stock list with status tags, Receive, Stock-take with approval, Waste (new in v2).'],
  ['When is the build ready and feedback due?','On Staging now. Feedback due Friday of Week 3.'],
  ['A problem found late in Week 3?','Critical delays release; Major/Minor go to the next cycle as known issues unless the Product Owner decides otherwise.']]],
 ['Environments (where)',[
  ['Where do I test?','Staging only. Never Production (real stock numbers).'],
  ['Which version?','v2. v1 is live and has no Waste screen.'],
  ['How close is Staging to Prod?','Same rules and roles; 6 sample items. System date is fixed at 2026-10-26 so results are repeatable.'],
  ['Each test (A × B)?','Input you give (A) and result expected (B).']]],
 ['Sign-off (the tick ✓)',[
  ['Who approves?','The Shop Owner (Product Owner).'],
  ['How do I report a failure?','Defect log (title, severity, steps, expected vs actual) to the Dev Lead.']]]
];
const TCS=[
 {id:'TC-01',title:'Staging, v2 active',req:'Env',role:'Any',input:['Read the environment banner.'],exp:'STAGING and v2.',bug:null},
 {id:'TC-02',title:'Stock list shows quantities',req:'Stock',role:'Lerato',input:['Open Stock.'],exp:'Beans 40, milk 24, cups 500, syrup 12, muffins 30, oat milk 6.',bug:null},
 {id:'TC-03',title:'Expired item flagged',req:'Stock',role:'Lerato',input:['Open Stock.','Look at Oat milk 1L (expiry 2026-10-25).'],exp:'Tagged “Expired”.',bug:null},
 {id:'TC-04',title:'Item expiring tomorrow flagged',req:'Stock',role:'Lerato',input:['Look at Muffins (expiry 2026-10-27).'],exp:'Tagged “Expiring soon”.',bug:null},
 {id:'TC-05',title:'Expiring-soon window is 3 days inclusive',req:'Stock',role:'Lerato',input:['Look at Fresh milk 1L (expiry 2026-10-29, exactly 3 days away).'],exp:'Tagged “Expiring soon” (rule: within 3 days).',bug:'E4'},
 {id:'TC-06',title:'Low stock when at or below minimum',req:'Stock',role:'Lerato',input:['Fresh milk has 24 on hand, minimum 24.'],exp:'Tagged “Low stock”.',bug:null},
 {id:'TC-07',title:'Receive: next expiry is the earliest batch',req:'Receive',role:'Lerato',input:['Receive 10 Arabica beans, expiry 2026-12-01.','Open Stock.'],exp:'Beans: next expiry 2026-12-01 (oldest first).',bug:'E3'},
 {id:'TC-08',title:'Receive: past expiry refused',req:'Receive',role:'Lerato',input:['Receive 5 Muffins, expiry 2026-10-20.'],exp:'Refused: cannot receive expired stock.',bug:null},
 {id:'TC-09',title:'Receive: stock expiring today refused',req:'Receive',role:'Lerato',input:['Receive 5 Muffins, expiry 2026-10-26 (today).'],exp:'Refused: expiry must be after today.',bug:'R1'},
 {id:'TC-10',title:'Receive: zero quantity refused',req:'Receive',role:'Lerato',input:['Receive 0 Cups.'],exp:'Refused.',bug:null},
 {id:'TC-11',title:'Receive: negative quantity refused',req:'Receive',role:'Lerato',input:['Receive -20 Cups.','Check Stock.'],exp:'Refused; cups still 500.',bug:'R2'},
 {id:'TC-12',title:'Low-stock count updates after receiving',req:'Receive',role:'Lerato',input:['Note “Low stock” count at the top (2).','Receive 20 Fresh milk, expiry 2026-11-30.'],exp:'Low stock count becomes 1 (only Oat milk).',bug:'L1'},
 {id:'TC-13',title:'Stock-take variance (units)',req:'Stock-take',role:'Lerato',input:['Count Arabica beans = 38.'],exp:'Variance -2.',bug:null},
 {id:'TC-14',title:'Stock-take variance percentage',req:'Stock-take',role:'Lerato',input:['Count Arabica beans = 38 (system 40).'],exp:'Variance -5.0% (variance ÷ system quantity).',bug:'V5'},
 {id:'TC-15',title:'Only a Manager can approve adjustments',req:'Stock-take',role:'Lerato',input:['As Lerato submit a count.','Look for the approve option.'],exp:'Storeman cannot approve; only Sipho (Manager) can.',bug:'P6'},
 {id:'TC-16',title:'Approved adjustment fixes stock',req:'Stock-take',role:'Sipho',input:['As Sipho count Arabica beans = 38, Approve.','Open Stock.'],exp:'Beans on hand 38.',bug:null},
 {id:'TC-17',title:'Waste: cannot exceed stock on hand',req:'Waste',role:'Lerato',input:['Waste 7 Oat milk (6 on hand), reason Expired.'],exp:'Refused: more than on hand.',bug:null},
 {id:'TC-18',title:'Waste: reason always required',req:'Waste',role:'Lerato',input:['Waste 12 Fresh milk with no reason.'],exp:'Refused: reason required.',bug:'W7'},
 {id:'TC-19',title:'Waste: reason required for small quantity',req:'Waste',role:'Lerato',input:['Waste 2 Muffins with no reason.'],exp:'Refused: reason required.',bug:null},
 {id:'TC-20',title:'Waste total accumulates',req:'Waste',role:'Lerato',input:['Waste 2 Muffins (R28), reason Damaged.','Waste 3 Muffins (R42), reason Expired.'],exp:'Total waste value R70.00.',bug:'W8'},
 {id:'TC-21',title:'Waste screen exists only in v2',req:'Env',role:'Any',input:['Set version v1.','Look at the tabs.'],exp:'No Waste tab on v1; it appears on v2.',bug:null}
];
const BUGS={E4:['Expiring-soon flag misses items exactly 3 days away','Major'],E3:['Next expiry shows the latest batch, not the earliest','Major'],R1:['Stock expiring today can be received','Major'],R2:['Negative receive quantity accepted (reduces stock)','Critical'],L1:['Low-stock count not refreshed after receiving','Minor'],V5:['Variance % uses counted qty instead of system qty','Major'],P6:['Storeman can approve stock-take adjustments','Critical'],W7:['Waste reason not required for quantities of 10+','Major'],W8:['Total waste value overwritten, not accumulated','Critical']};
const WT=[['brief','1 Briefing'],['pre','2 Pre-flight'],['tests','3 Tests'],['defects','4 Defects'],['sign','5 Sign-off']];
const KEY='stockwatch-practice-v1';
const fresh=()=>({tab:'brief',week:2,pre:{},res:{},defects:[],needs:{},so:{tester:'',decision:'',notes:''},key:false});
let W;try{W=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{W=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(W))}catch{}};
const PRE=['Environment banner says STAGING (not Production or Dev)','Version is v2 (the build under test)','I know which role this test needs','I have re-read the expected rules (3-day window, manager-only approval, etc.)','I know where to report a failed test (Dev Lead, via defect log)'];
const NEEDS=['Stock on hand is always right.','Items close to expiry are flagged correctly and the oldest stock shows first.','Expired stock cannot be received.','Only a Manager can change the books after a count.','Waste is always explained and costed correctly.'];
const stat=id=>W.res[id]?.status||'Pending';
const impact=(sev,wk)=>wk<3?'Fix within this cycle':sev==='Critical'?'DELAYS the release':'Moves to next cycle as a known issue';
const tally=()=>{const c={Pass:0,Fail:0,Blocked:0,Pending:0};TCS.forEach(t=>c[stat(t.id)]++);return c};

function wview(){
  $('wtabs').innerHTML=WT.map(([k,l])=>`<button data-wt="${k}" class="${W.tab===k?'on':''}">${l}</button>`).join('');
  const v=$('wview');
  if(W.tab==='brief')v.innerHTML=`<div class="tip"><b>Coffee analogy:</b> this is your own stock room. Does the count match the shelf, is the milk date right, and can only the owner change the books?</div>
   <div class="key">The one question behind everything: “Does this do what the real user needs it to do?”</div>
   <label>Current week of the cycle</label><select data-week="1">${[1,2,3].map(n=>`<option value="${n}" ${W.week==n?'selected':''}>Week ${n}${n===1?' (planning)':n===2?' (build on Staging)':' (feedback due)'}</option>`).join('')}</select>`+
   BRIEF.map(([h,qs])=>`<h4 style="margin:14px 0 4px">${h}</h4><table>${qs.map(([q,a])=>`<tr><td style="width:38%"><b>${q}</b></td><td>${a}</td></tr>`).join('')}</table>`).join('')+
   `<p style="margin-top:12px"><button class="primary" data-wt="pre">Go to pre-flight →</button></p>`;
  if(W.tab==='pre')v.innerHTML=`<p>Tick each item <b>before</b> you start.</p>`+PRE.map((p,i)=>`<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px"><input type="checkbox" data-pre="${i}" ${W.pre[i]?'checked':''}> ${p}</label>`).join('')+
   `<p style="margin-top:10px">${PRE.every((_,i)=>W.pre[i])?'<span class="msg ok">Ready to test.</span>':'<span class="msg err">Not ready yet.</span>'}</p>`;

 uat:{h:'What is user acceptance testing?',

.lrn-card .lab{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute,#666);margin:12px 0 2px}
.lrn-card .box{background:var(--line,#eee);border-radius:8px;padding:8px 10px;font-size:14px}
.lrn-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.lrn-chips button,.lrn-x{font:inherit;cursor:pointer;border:1px solid var(--line,#ccc);background:var(--card,#fff);color:var(--ink,#222);border-radius:6px;padding:4px 10px}
.lrn-card a{color:var(--brand,#5b3a29)}`;
const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
const E=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function open(key,extra){
  const t=T[key];if(!t)return;
  let b=`<h3>${E(t.h)}</h3>`;
  if(t.special==='resources'){
    b+=`<div class="lab">Syllabi and articles</div>`+SOURCES.map(s=>`<p style="margin:6px 0"><a href="${s.u}" target="_blank" rel="noopener">${E(s.t)}</a><br><small>${E(s.n)}</small></p>`).join('')+
       `<div class="lab">Books (as cited by the ISTQB syllabi)</div>`+BOOKS.map(x=>`<p style="margin:6px 0"><b>${E(x[1])}</b> (${x[2]}) by ${E(x[0])}${x[3]?', '+x[3]:''}<br><small>${E(x[4])}</small></p>`).join('')+
       `<p class="sub" style="font-size:12px">Quotes in the pop-ups come from the two ISTQB syllabi. Web articles were summarised, not quoted. Practical-tip boxes are the author’s own advice.</p>`;
  }else{
    b+=`<p>${E(t.say)}</p>`;
    if(t.q&&t.q.length)b+=`<div class="lab">From the source</div>`+t.q.map(([q,c])=>`<blockquote>${E(q)}<cite>${E(c)}</cite></blockquote>`).join('');
    if(t.web)b+=`<div class="lab">From web guides</div><div class="box">${E(t.web)}</div>`;
    if(t.tip)b+=`<div class="lab">${t.tip.startsWith('Practical')?'Practical tip':'Note'}</div><div class="box">${E(t.tip)}</div>`;
    b+=`<div class="lab">How it applies in this app</div><p style="margin:0">${E(t.how)}</p>`;
    if(extra)b+=`<div class="lab">This test</div><div class="box">${E(extra)}</div>`;
    const rel=(t.rel||[]).concat(['resources']);
    b+=`<div class="lrn-chips">${rel.map(r=>`<button data-lrn="${r}">${E(T[r].h.split(' (')[0])}</button>`).join('')}</div>`;
  }
  b+=`<div style="text-align:right;margin-top:14px"><button class="lrn-x" data-lrnx="1">Close</button></div>`;
  const old=document.querySelector('.lrn-ov');if(old)old.remove();
  const ov=document.createElement('div');ov.className='lrn-ov';ov.innerHTML=`<div class="lrn-card" role="dialog" aria-modal="true">${b}</div>`;document.body.appendChild(ov);
  ov.querySelector('.lrn-x,.lrn-chips button')&&ov.querySelector('.lrn-x').focus();
}
const close=()=>{const o=document.querySelector('.lrn-ov');if(o)o.remove()};
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest&&t.closest('[data-lrnx]'))return close();
  if(t.classList&&t.classList.contains('lrn-ov'))return close();
  const k=t.closest&&t.closest('[data-lrn]');
  if(k){e.stopPropagation();e.preventDefault();return open(k.dataset.lrn)}
  const q=t.closest&&t.closest('[data-lrntc]');
  if(q){e.stopPropagation();e.preventDefault();const id=q.dataset.lrntc,tc=(CFG.tests||{})[id];if(tc)open(tc.k,tc.note)}
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
const dock=document.createElement('div');dock.className='lrn-dock';
dock.innerHTML='<button data-lrnstep="1">About this step</button><button data-lrn="resources">Sources</button>';document.body.appendChild(dock);
dock.querySelector('[data-lrnstep]').addEventListener('click',e=>{e.stopPropagation();const tab=(CFG.getTab&&CFG.getTab())||'';open(TABMAP[tab]||'uat')});
if(CFG.tests){
  const decorate=()=>{document.querySelectorAll('.tc h3').forEach(h=>{
    if(h.querySelector('[data-lrntc]'))return;const m=h.textContent.trim().match(/^(TC-\d+)/);
    if(m&&CFG.tests[m[1]]){const b=document.createElement('button');b.type='button';b.className='lrn-i';b.dataset.lrntc=m[1];b.title='How this test works';b.textContent='technique';h.appendChild(b)}})};
  new MutationObserver(decorate).observe(document.body,{childList:true,subtree:true});decorate();
}
})();

/* Phone support: App/Workbook switch on narrow screens + service worker registration. */
(function(){
const css=`@media(max-width:950px){
 body{font-size:16px}input,select,textarea{font-size:16px!important}button{min-height:38px}
 main{padding:10px!important;gap:10px!important;padding-bottom:84px!important}
 .mob-bar{position:sticky;top:0;z-index:40;display:flex;gap:6px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
 .mob-bar button{flex:1;font-weight:600}.mob-bar button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
 .scroll{max-height:none!important}.lrn-dock{bottom:10px;right:10px}.lrn-dock button{padding:9px 14px}
 header h1 small{display:none}
}
@media(max-width:600px){.env{grid-template-columns:1fr!important}}
@media(min-width:951px){.mob-bar{display:none}}
@media(max-width:950px) and (prefers-color-scheme:dark){.mob-bar button.on{color:#16181d}}`;
const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
const panels=document.querySelectorAll('main > .panel');
if(panels.length===2){
  const bar=document.createElement('div');bar.className='mob-bar';
  bar.innerHTML='<button data-p="0">1 · App to test</button><button data-p="1">2 · Workbook</button>';
  document.querySelector('header').after(bar);
  let cur=0;try{cur=+sessionStorage.getItem('mobpanel')||0}catch{}
  const show=i=>{cur=i;panels.forEach((p,k)=>{p.style.display=window.matchMedia('(max-width:950px)').matches&&k!==i?'none':''});
    bar.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===i));try{sessionStorage.setItem('mobpanel',i)}catch{};window.scrollTo(0,0)};
  bar.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(+b.dataset.p)});
  window.matchMedia('(max-width:950px)').addEventListener('change',()=>show(cur));
  show(cur);
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
