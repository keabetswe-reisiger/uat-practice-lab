<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UAT Training Lab</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1f2430;--mute:#6b7280;--line:#e3ddd3;--brand:#5b3a29;--accent:#b08d57;--pass:#1b7f4b;--fail:#c0392b;--block:#b7791f;--pend:#8a8f98}
@media(prefers-color-scheme:dark){:root{--bg:#16181d;--card:#20242c;--ink:#eceff4;--mute:#9aa3b2;--line:#323844;--brand:#d9b38c;--accent:#b08d57}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:18px;margin:0;color:var(--brand)}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1300px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel>h2{margin:0 0 4px;font-size:16px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:6px}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
@media(prefers-color-scheme:dark){button.primary{color:#16181d}}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.totals .row{border-top:1px dashed var(--line)}
.totals .grand{font-weight:700;font-size:17px}
.msg{padding:8px 10px;border-radius:6px;margin-top:8px;font-size:14px}
.err{background:#c0392b22;color:var(--fail)}.ok{background:#1b7f4b22;color:var(--pass)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
@media(prefers-color-scheme:dark){.tabs button.on{color:#16181d}}
.tc{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.tc h3{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.tc ol{margin:6px 0 6px 18px;padding:0;font-size:14px}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;color:#fff;white-space:nowrap}
.b-Pending{background:var(--pend)}.b-Pass{background:var(--pass)}.b-Fail{background:var(--fail)}.b-Blocked{background:var(--block)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.stat b{display:block;font-size:22px}
.tip{background:#b08d5722;border-left:3px solid var(--accent);padding:8px 10px;font-size:13px;border-radius:4px;margin-bottom:10px}
.scroll{max-height:72vh;overflow:auto;padding-right:4px}
</style>
<!--PWA--><meta name="theme-color" content="#0d0c0a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><!--/PWA-->
<!--BRAND--><link rel="stylesheet" href="brand.css"><!--/BRAND-->
</head>
<body>
<header>
  <h1>☕ UAT Training Lab</h1>
  <div><button id="reset">Reset everything</button></div>
</header>
<main>

<!-- LEFT: SYSTEM UNDER TEST -->
<section class="panel">
  <h2>System under test: Brew &amp; Go ordering</h2>
  <p class="sub">Pretend a client built this and you must decide if it is acceptable. Use it exactly as a customer would.</p>
  <div class="menu" id="menu"></div>
  <h3 style="margin:16px 0 4px;font-size:14px">Your cart</h3>
  <div id="cart"></div>
  <label>Discount code</label>
  <div style="display:flex;gap:6px"><input id="code" placeholder="Enter code"><button id="applyCode">Apply</button></div>
  <div id="codeMsg"></div>
  <label><input type="checkbox" id="deliver" style="width:auto"> Deliver to me</label>
  <div class="totals" id="totals"></div>
  <label>Name</label><input id="name">
  <label>Phone number</label><input id="phone" inputmode="numeric">
  <div class="btns"><button class="primary" id="checkout">Place order</button></div>
  <div id="orderMsg"></div>
</section>

<!-- RIGHT: UAT WORKBOOK -->
<section class="panel">
  <h2>UAT workbook</h2>
  <p class="sub">Your job: check each requirement, record what really happened, log defects, then sign off or reject.</p>
  <div class="tabs" id="tabs"></div>
  <div class="scroll" id="view"></div>
</section>
</main>

<script>
/* ---------- System under test (contains deliberate bugs, see answer key) ---------- */
const MENU=[{id:'esp',name:'Espresso',price:30},{id:'cap',name:'Cappuccino',price:40},{id:'lat',name:'Latte',price:45},{id:'muf',name:'Muffin',price:25}];
let cart={};          // id -> qty
let discountPct=0;
const $=id=>document.getElementById(id);
const money=n=>'R'+n.toFixed(2);

function calc(){
  const subtotal=Object.entries(cart).reduce((s,[id,q])=>s+MENU.find(m=>m.id===id).price*q,0);
  const discount=subtotal*discountPct/100;
  const delivery=$('deliver').checked?(subtotal>100?0:20):0;       // BUG B4: should be >= 100
  return{subtotal,discount,delivery,total:subtotal-discount+delivery};
}
function renderMenu(){
  $('menu').innerHTML=MENU.map(m=>`<div class="item"><b>${m.name}</b><span>${money(m.price)}</span><button data-add="${m.id}">Add to cart</button></div>`).join('');
}
function renderCart(){
  const ids=Object.keys(cart);
  $('cart').innerHTML=ids.length?ids.map(id=>{const m=MENU.find(x=>x.id===id);return `<div class="row"><span>${m.name}</span><span><button data-dec="${id}">−</button> <b>${cart[id]}</b> <button data-inc="${id}">+</button> <button data-del="${id}">✕</button></span><span>${money(m.price*cart[id])}</span></div>`}).join(''):'<p class="sub">Cart is empty.</p>';
  const t=calc();
  $('totals').innerHTML=`<div class="row"><span>Subtotal</span><span>${money(t.subtotal)}</span></div>
  <div class="row"><span>Discount</span><span>−${money(t.discount)}</span></div>
  <div class="row"><span>Delivery</span><span>${money(t.delivery)}</span></div>
  <div class="row grand"><span>Total</span><span>${money(t.total)}</span></div>`;
}
document.addEventListener('click',e=>{
  const d=e.target.dataset||{};
  if(d.add){cart[d.add]=(cart[d.add]||0)+1}
  else if(d.inc){cart[d.inc]++}
  else if(d.dec){cart[d.dec]--}                                   // BUG B3: no minimum of 1
  else if(d.del){delete cart[d.del]}
  else return;
  renderCart();
});
$('deliver').onchange=renderCart;
$('applyCode').onclick=()=>{
  const c=$('code').value.trim();
  if(c==='WELCOME10'){discountPct=10;$('codeMsg').innerHTML='<div class="msg ok">10% discount applied.</div>'}   // BUG B2: case-sensitive
  else{discountPct=0;$('codeMsg').innerHTML='<div class="msg err">Invalid discount code.</div>'}
  renderCart();
};
$('checkout').onclick=()=>{
  const m=$('orderMsg'),name=$('name').value.trim(),phone=$('phone').value.trim();
  if(!Object.keys(cart).length){m.innerHTML='<div class="msg err">Your cart is empty.</div>';return}
  if(!name){m.innerHTML='<div class="msg err">Please enter your name.</div>';return}
  if(!/^\d{9,10}$/.test(phone)){m.innerHTML='<div class="msg err">Enter a valid phone number.</div>';return}  // BUG B1: allows 9 digits
  const t=calc();
  const shown=t.total-t.delivery;                                  // BUG B5: confirmation omits delivery
  const n='BG-'+Math.floor(1000+Math.random()*9000);
  m.innerHTML='';const box=document.createElement('div');box.className='msg ok';
  box.textContent=`Thanks ${name}! Order ${n} placed. Total charged: ${money(shown)}`;m.appendChild(box);
};

/* ---------- UAT workbook data ---------- */
const REQS=[
 ['REQ-1','Customer can add menu items to the cart.'],
 ['REQ-2','Customer can change quantity; quantity can never go below 1 (use remove to delete).'],
 ['REQ-3','Code WELCOME10 gives 10% off the subtotal. Codes are not case-sensitive. Bad codes show an error.'],
 ['REQ-4','Delivery costs R20. Delivery is free when the subtotal is R100 or more.'],
 ['REQ-5','Name is required. Phone must be exactly 10 digits.'],
 ['REQ-6','An empty cart cannot be checked out.'],
 ['REQ-7','The confirmation shows an order number and the same total the customer saw before paying.']
];
const TCS=[
 {id:'TC-01',req:'REQ-1',title:'Add an item to the cart',steps:['Click “Add to cart” on Espresso.'],exp:'Espresso appears in cart, qty 1, total R30.00.',bug:null},
 {id:'TC-02',req:'REQ-2',title:'Increase quantity',steps:['Add Latte.','Click + twice.'],exp:'Qty 3 and line price R135.00.',bug:null},
 {id:'TC-03',req:'REQ-2',title:'Quantity cannot drop below 1',steps:['Add Muffin.','Click − twice.'],exp:'Quantity stays at 1 (never 0 or negative).',bug:'B3'},
 {id:'TC-04',req:'REQ-3',title:'Valid discount code',steps:['Add Cappuccino.','Enter WELCOME10, Apply.'],exp:'Discount R4.00, total R36.00.',bug:null},
 {id:'TC-05',req:'REQ-3',title:'Code is not case-sensitive',steps:['Add Cappuccino.','Enter welcome10 (lowercase), Apply.'],exp:'10% discount is applied.',bug:'B2'},
 {id:'TC-06',req:'REQ-3',title:'Invalid code is rejected',steps:['Add Cappuccino.','Enter COFFEE99, Apply.'],exp:'Error “Invalid discount code” and no discount.',bug:null},
 {id:'TC-07',req:'REQ-4',title:'Delivery fee below R100',steps:['Add Espresso.','Tick “Deliver to me”.'],exp:'Delivery R20.00, total R50.00.',bug:null},
 {id:'TC-08',req:'REQ-4',title:'Free delivery at exactly R100 (boundary)',steps:['Add Espresso, click + once (R60).','Add Cappuccino (R100 subtotal).','Tick “Deliver to me”.'],exp:'Delivery R0.00, total R100.00.',bug:'B4'},
 {id:'TC-09',req:'REQ-5',title:'Phone must be 10 digits',steps:['Add any item.','Name: Thabo. Phone: 082123456 (9 digits).','Place order.'],exp:'Order is refused with a phone error.',bug:'B1'},
 {id:'TC-10',req:'REQ-5',title:'Name is required',steps:['Add any item.','Leave name blank, phone 0821234567.','Place order.'],exp:'Order is refused asking for a name.',bug:null},
 {id:'TC-11',req:'REQ-6',title:'Empty cart cannot be ordered',steps:['Leave cart empty.','Place order.'],exp:'“Your cart is empty” error.',bug:null},
 {id:'TC-12',req:'REQ-7',title:'Confirmation total matches cart total',steps:['Add Espresso, tick Deliver (total R50.00).','Name Thabo, phone 0821234567.','Place order.'],exp:'Confirmation says total R50.00.',bug:'B5'}
];
const BUGS={B1:'Phone accepts 9 digits (should be exactly 10).',B2:'Discount code is case-sensitive.',B3:'Quantity can drop to 0 and below.',B4:'Free delivery starts above R100, not at R100 (boundary error).',B5:'Confirmation total leaves out the delivery fee.'};

/* ---------- Workbook state ---------- */
const KEY='uat-lab-v1';
const fresh=()=>({results:{},defects:[],signoff:{decision:'',notes:'',tester:''},tab:'guide',key:false});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS=[['guide','1 Guide'],['reqs','2 Requirements'],['tests','3 Test cases'],['defects','4 Defects'],['report','5 Sign-off']];

function renderTabs(){
  $('tabs').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('');
}
function view(){
  renderTabs();
  const v=$('view');
  if(S.tab==='guide')v.innerHTML=`
   <div class="tip"><b>Coffee analogy:</b> UAT is the owner tasting the coffee before it goes on the menu. The barista (developer) already checked it works; you check it is what the customer actually asked for.</div>
   <p><b>How a UAT cycle works</b></p>
   <ol>
    <li><b>Requirements</b>: read what the client agreed to (the “acceptance criteria”).</li>
    <li><b>Test cases</b>: run each one on the left. Follow the steps, compare <i>expected</i> to <i>actual</i>.</li>
    <li><b>Record</b> Pass, Fail or Blocked. Write the actual result in your own words.</li>
    <li><b>Defects</b>: every failure becomes a defect with a clear title, steps and severity.</li>
    <li><b>Sign-off</b>: Accept, Accept with conditions, or Reject, backed by evidence.</li>
   </ol>
   <p><b>Severity guide:</b> <b>Critical</b> = money or data wrong / system unusable. <b>Major</b> = a requirement broken, workaround exists. <b>Minor</b> = cosmetic or small annoyance.</p>
   <p><b>Training tips:</b> test boundaries (exactly R100, 9 vs 10 digits), try wrong-case and empty inputs, and don’t assume: only mark Pass when you saw the expected result. Some things work fine, so don’t invent failures. Reset the left app by refreshing the page.</p>
   <button class="primary" data-tab="tests">Start testing →</button>`;
  if(S.tab==='reqs')v.innerHTML=`<table><tr><th>ID</th><th>Acceptance criteria</th><th>Coverage</th></tr>${REQS.map(([id,t])=>{
     const tcs=TCS.filter(x=>x.req===id);const done=tcs.filter(x=>S.results[x.id]?.status&&S.results[x.id].status!=='Pending').length;
     return `<tr><td>${id}</td><td>${esc(t)}</td><td>${done}/${tcs.length} tested</td></tr>`}).join('')}</table>`;
  if(S.tab==='tests')v.innerHTML=TCS.map(t=>{
     const r=S.results[t.id]||{status:'Pending',actual:''};
     return `<div class="tc"><h3><span>${t.id} · ${esc(t.title)} <small style="color:var(--mute)">(${t.req})</small></span><span class="badge b-${r.status}">${r.status}</span></h3>
      <ol>${t.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
      <div><b>Expected:</b> ${esc(t.exp)}</div>
      <label>Actual result (what you saw)</label><textarea rows="2" data-actual="${t.id}">${esc(r.actual)}</textarea>
      <div class="btns"><button data-set="${t.id}|Pass">✓ Pass</button><button data-set="${t.id}|Fail">✗ Fail</button><button data-set="${t.id}|Blocked">⊘ Blocked</button></div></div>`}).join('');
  if(S.tab==='defects')v.innerHTML=(S.defects.length?S.defects.map((d,i)=>`<div class="tc"><h3><span>${d.id} · from ${d.tc}</span><button data-deldef="${i}">Delete</button></h3>
      <label>Title</label><input data-df="${i}|title" value="${esc(d.title)}">
      <label>Severity</label><select data-df="${i}|sev">${['Critical','Major','Minor'].map(s=>`<option ${d.sev===s?'selected':''}>${s}</option>`).join('')}</select>
      <label>Steps to reproduce / notes</label><textarea rows="3" data-df="${i}|notes">${esc(d.notes)}</textarea></div>`).join(''):'<p class="sub">No defects yet. Mark a test case as Fail and a defect is drafted for you to complete.</p>');
  if(S.tab==='report'){
    const c=countStats(),found=foundBugs();
    v.innerHTML=`<div class="stats"><div class="stat"><b>${c.Pass}</b>Pass</div><div class="stat"><b>${c.Fail}</b>Fail</div><div class="stat"><b>${c.Blocked}</b>Blocked</div><div class="stat"><b>${c.Pending}</b>Not run</div></div>
     <p>Pass rate: <b>${c.rate}%</b> · Open defects: <b>${S.defects.length}</b> (Critical ${S.defects.filter(d=>d.sev==='Critical').length}, Major ${S.defects.filter(d=>d.sev==='Major').length}, Minor ${S.defects.filter(d=>d.sev==='Minor').length})</p>
     <label>Tester name</label><input data-so="tester" value="${esc(S.signoff.tester)}">
     <label>Decision</label><select data-so="decision"><option value="">Choose…</option>${['Accept','Accept with conditions','Reject'].map(s=>`<option ${S.signoff.decision===s?'selected':''}>${s}</option>`).join('')}</select>
     <label>Justification (cite test cases and defects)</label><textarea rows="4" data-so="notes">${esc(S.signoff.notes)}</textarea>
     <div class="btns"><button class="primary" id="csv">Download report (CSV)</button><button id="print">Print / save PDF</button></div>
     <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
     <p><b>Check your skills</b></p>
     <button id="togKey">${S.key?'Hide':'Reveal'} answer key</button>
     ${S.key?`<table style="margin-top:8px"><tr><th>Bug</th><th>Description</th><th>Test case</th><th>You found it?</th></tr>${Object.entries(BUGS).map(([b,d])=>{const tc=TCS.find(t=>t.bug===b);return `<tr><td>${b}</td><td>${esc(d)}</td><td>${tc.id}</td><td>${found.has(b)?'✅':'❌ missed'}</td></tr>`}).join('')}</table>
     <p class="sub">False alarms (Fail on a test that should pass): ${falseAlarms().join(', ')||'none'}. Real testers avoid both misses and false alarms.</p>`:''}`;
  }
}
function countStats(){
  const c={Pass:0,Fail:0,Blocked:0,Pending:0};
  TCS.forEach(t=>c[S.results[t.id]?.status||'Pending']++);
  const run=c.Pass+c.Fail;c.rate=run?Math.round(c.Pass/run*100):0;return c;
}
const foundBugs=()=>new Set(TCS.filter(t=>t.bug&&S.results[t.id]?.status==='Fail').map(t=>t.bug));
const falseAlarms=()=>TCS.filter(t=>!t.bug&&S.results[t.id]?.status==='Fail').map(t=>t.id);

document.addEventListener('click',e=>{
  const t=e.target,d=t.dataset||{};
  if(d.tab){S.tab=d.tab}
  else if(d.set){
    const[id,st]=d.set.split('|');const tc=TCS.find(x=>x.id===id);
    S.results[id]={...(S.results[id]||{actual:''}),status:st};
    if(st==='Fail'&&!S.defects.some(x=>x.tc===id))
      S.defects.push({id:'DEF-'+String(S.defects.length+1).padStart(2,'0'),tc:id,title:tc.title+' fails',sev:'Major',notes:'Expected: '+tc.exp+'\nActual: '+(S.results[id].actual||'')});
  }
  else if(d.deldef!==undefined){S.defects.splice(+d.deldef,1)}
  else if(t.id==='togKey'){S.key=!S.key}
  else if(t.id==='csv'){return exportCsv()}
  else if(t.id==='print'){return window.print()}
  else return;
  save();view();
});
document.addEventListener('input',e=>{
  const d=e.target.dataset||{};
  if(d.actual){S.results[d.actual]={...(S.results[d.actual]||{status:'Pending'}),actual:e.target.value}}
  else if(d.df){const[i,k]=d.df.split('|');S.defects[+i][k]=e.target.value}
  else if(d.so){S.signoff[d.so]=e.target.value}
  else return;
  save();
});
function exportCsv(){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Test case','Requirement','Title','Expected','Status','Actual']];
  TCS.forEach(t=>{const r=S.results[t.id]||{};rows.push([t.id,t.req,t.title,t.exp,r.status||'Pending',r.actual||''])});
  rows.push([],['Defect','Test case','Title','Severity','Notes']);
  S.defects.forEach(d=>rows.push([d.id,d.tc,d.title,d.sev,d.notes]));
  rows.push([],['Tester',S.signoff.tester],['Decision',S.signoff.decision],['Justification',S.signoff.notes]);
  const blob=new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='uat-report.csv';a.click();
}
$('reset').onclick=()=>{if(confirm('Erase all your results, defects and sign-off?')){S=fresh();save();view()}};

renderMenu();renderCart();view();
</script>
<!--LEARN-->
<script>
window.LEARN_CFG={tabs:{"guide": "uat", "reqs": "criteria", "tests": "gwt", "defects": "defect", "report": "exit"},getTab:()=>S.tab,tests:{"TC-01": {"k": "gwt", "note": "Scenario test: set up the Given, do the When, compare with the Then. Write exactly what you saw."}, "TC-02": {"k": "gwt", "note": "Scenario test: set up the Given, do the When, compare with the Then. Write exactly what you saw."}, "TC-03": {"k": "bva", "note": "Boundary test: work out the exact edge in the requirement, then try just below, on, and just above it."}, "TC-04": {"k": "calc", "note": "Calculation test: work out the expected number by hand before you look at the screen."}, "TC-05": {"k": "ep", "note": "Partition test: decide which inputs belong in the same group (valid, blank, wrong case, wrong role) and compare a value from each."}, "TC-06": {"k": "ep", "note": "Partition test: decide which inputs belong in the same group (valid, blank, wrong case, wrong role) and compare a value from each."}, "TC-07": {"k": "bva", "note": "Boundary test: work out the exact edge in the requirement, then try just below, on, and just above it."}, "TC-08": {"k": "bva", "note": "Boundary test: work out the exact edge in the requirement, then try just below, on, and just above it."}, "TC-09": {"k": "bva", "note": "Boundary test: work out the exact edge in the requirement, then try just below, on, and just above it."}, "TC-10": {"k": "ep", "note": "Partition test: decide which inputs belong in the same group (valid, blank, wrong case, wrong role) and compare a value from each."}, "TC-11": {"k": "ep", "note": "Partition test: decide which inputs belong in the same group (valid, blank, wrong case, wrong role) and compare a value from each."}, "TC-12": {"k": "criteria", "note": "Criteria test: compare the result with the written acceptance rule, including labels and status wording."}}};
/* Learn pop-ups: explains how UAT theory applies to the app on screen.
   Quotes are verbatim from the sources listed in SOURCES; "Practical tip" boxes are the author's own, not from the books. */
(function(){
const CFG=window.LEARN_CFG||{};
const CTFL='ISTQB Certified Tester Foundation Level Syllabus v4.0.1 (2024)';
const ACT='ISTQB Certified Tester Acceptance Testing Syllabus v1.0 (2019)';
const SOURCES=[
 {t:CTFL,u:'https://www.istqb.org/certifications/certified-tester-foundation-level',n:'Free syllabus; the PDF is also in your Pictures/3/mess folder. Cites Myers (2011), Craig (2002), Whittaker for techniques.'},
 {t:ACT,u:'https://www.istqb.org/wp-content/uploads/2024/11/ISTQB-CT-AcT_Syllabus_v1.0_2019.pdf',n:'Free syllabus dedicated to acceptance testing, UAT, acceptance criteria and Given–When–Then.'},
 {t:'aqua-cloud: UAT entry and exit criteria (web article)',u:'https://aqua-cloud.io/uat-entry-and-exit-criteria/',n:'Vendor blog. Its numeric thresholds are examples, not standards.'},
 {t:'Bird Eats Bug: user acceptance testing (web article)',u:'https://birdeatsbug.com/blog/user-acceptance-testing',n:'Vendor blog on UAT steps and sign-off.'},
 {t:'University of Minnesota: UAT template guide (web)',u:'https://ddg.wcroc.umn.edu/?p=44386',n:'Sign-off as written confirmation.'},
 {t:'Marker.io: bug severity vs priority (web article)',u:'https://marker.io/blog/bug-severity-vs-priority',n:'Severity vs priority explained.'},
 {t:'Sauce Labs: bug severity vs priority (web article)',u:'https://saucelabs.com/resources/blog/bug-severity-vs-priority',n:'Severity vs priority best practices.'}
];
const BOOKS=[
 ['Mike Cohn','User Stories Applied: For Agile Software Development','2004','ISBN 978-0321205681','Source of good-practice rules for writing acceptance criteria (cited by the ISTQB AcT syllabus).'],
 ['Ken Pugh','Lean-Agile Acceptance Test-Driven Development','2011','ISBN 978-0321714084','Acceptance tests as a team conversation (cited by the AcT syllabus).'],
 ['John Ferguson Smart','BDD in Action','2014','ISBN 978-1617291654','Given–When–Then and behaviour-driven development (cited by the AcT syllabus).'],
 ['James Whittaker','Exploratory Software Testing','2009','ISBN 978-0321636416','Exploratory testing and error guessing (cited by the AcT and Foundation syllabi).'],
 ['Jeffrey Rubin & Dana Chisnell','Handbook of Usability Testing, 2nd ed.','2008','ISBN 978-0470185483','Testing with real users (cited by the AcT syllabus).'],
 ['Glenford Myers et al.','The Art of Software Testing, 3rd ed.','2011','','Boundary value analysis (cited in Foundation syllabus 4.2.2 as Myers 2011).']
];
const T={
 uat:{h:'What is user acceptance testing?',
  say:'UAT is the last check before go-live. The people the system is built for confirm it does what they actually need, not just what was written in a spec.',
  q:[['“Acceptance testing focuses on validation and on demonstrating readiness for deployment, which means that the system fulfills the user’s business needs. Ideally, acceptance testing should be performed by the intended users.”',CTFL+', §2.2.1 Test Levels']],
  how:'In this app you play the intended user. The system was already built and checked by developers; your job is not “does it run?” but “does it do what a Manager, Auditor or Storeman needs?”. The briefing tab holds those needs.',rel:['criteria','env','resources']},
 criteria:{h:'Acceptance criteria',
  say:'Acceptance criteria are the yes/no rules a feature must satisfy to be accepted. Each test you run is tied to one.',
  q:[['“acceptance criteria are measurable criteria, formulated as a statement (or a set of statements), which can be either true or false.”',ACT+', §2.1'],['“Well-written acceptance criteria are precise, measurable and concise.”',ACT+', §2.1'],['“Acceptance criteria represent the test conditions which determine ‘what’ to test. They do not contain the detailed test procedures.”',ACT+', §2.1']],
  how:'The requirement rows and the “Expected” results here are the acceptance criteria. If a rule is vague (for example “without lag”), note it: a criterion you cannot measure cannot be passed or failed cleanly.',rel:['gwt','uat']},
 gwt:{h:'Given – When – Then (and the A × B idea)',
  say:'Every test is a pair: the starting situation and action you give (A) and the result you expect (B). Given–When–Then splits that into set-up, action, result.',
  q:[['“The ‘Given’ block aims to put the test object in a state before performing test actions in the ‘When’ block. The ‘Then’ block specifies the consequences that can be observed from the actions defined in the ‘When’ block.”',ACT+', §2.2']],
  how:'Do the set-up first (log in as the right role, open the right screen), perform exactly one action, then compare what you saw with the expected result. Write what you actually saw in “Actual result”, in your own words.',rel:['criteria','ep','bva']},
 entry:{h:'Pre-flight = entry criteria',
  say:'Before testing starts, certain things must be true. Otherwise you waste time on problems that are not real defects.',
  q:[['“Entry criteria define the preconditions for undertaking a given activity. If entry criteria are not met, it is likely that the activity will prove to be more difficult, time-consuming, costly, and riskier.”',CTFL+', §5.1.3'],['“Typical entry criteria include: availability of resources (e.g., people, tools, environments, test data, budget, time), availability of testware (e.g., test basis, testable requirements, user stories, test cases)…”',CTFL+', §5.1.3']],
  web:'Web articles (e.g. aqua-cloud) add that the UAT environment should resemble production and test data should be prepared first. Treat their numeric thresholds as examples only.',
  how:'The pre-flight checklist is your entry criteria: Staging not Production, the right version, the right account, criteria re-read, and a place to report problems.',rel:['env','exit']},
 env:{h:'Environment and version',
  say:'Test on a copy that behaves like the real thing, and know exactly which version you are checking.',
  q:[['“System testing … it is preferable to test [some qualities] on a complete system in a representative test environment”',CTFL+', §2.2.1']],
  tip:'Production holds real data, so testing there can damage it. Dev changes constantly, so results are not repeatable. That is why the app locks when you pick Production.',
  how:'Check the banner (Staging / Production / Dev) and the version (v1 / v2) before every session. A test passing on v1 says nothing about v2.',rel:['entry']},
 ep:{h:'Equivalence partitioning',
  say:'Inputs fall into groups the system should treat the same way. Test one typical value from each group instead of every value.',
  q:[['“if a test case, that tests one value from an equivalence partition, detects a defect, this defect should also be detected by test cases that test any other value from the same partition. Therefore, one test for each partition is sufficient.”',CTFL+', §4.2.1']],
  how:'Look for groups: valid vs blank vs invalid input, upper vs lower case, Manager vs Auditor. If one value in a group works, the whole group should. If two values from the same group behave differently, you have found a defect.',rel:['bva','errguess']},
 bva:{h:'Boundary value analysis',
  say:'Mistakes cluster at the edges of a rule, such as “10 or more”, “within 3 days” or “after today”. Test the edge value and its neighbour on the other side.',
  q:[['“developers are more likely to make errors with these boundary values. Typical defects found by BVA are located where implemented boundaries are misplaced to positions above or below their intended positions or are omitted altogether.”',CTFL+', §4.2.2'],['2-value BVA: test the boundary value and its closest neighbour in the adjacent partition. 3-value BVA also adds the neighbour on the other side.',CTFL+', §4.2.2 (paraphrase)']],
  how:'Work out the exact edge in the requirement (for example “R100 or more”, “exactly 10 digits”, “3 days”) and test just below, on, and just above it.',rel:['ep','errguess']},
 errguess:{h:'Error guessing',
  say:'Use what you know about how software usually breaks to design tests that go looking for those faults.',
  q:[['“Error guessing is a test technique used to anticipate the occurrence of errors, defects, and failures, based on the tester’s knowledge”',CTFL+', §4.4.1'],['errors may relate to “input (e.g., correct input not accepted, parameters wrong or missing), output (e.g., wrong format, wrong result), logic (e.g., missing cases, wrong operator), computation…”',CTFL+', §4.4.1']],
  how:'Try the things users really do: negative numbers, blank fields, wrong case, doing steps in an unusual order, a second action after the first.',rel:['explor','bva']},
 explor:{h:'Exploratory testing',
  say:'Learn the system while testing it: design, run and judge tests as you go, then follow what looks odd.',
  q:[['“In exploratory testing, tests are simultaneously designed, executed, and evaluated while the tester learns about the test object.”',CTFL+', §4.4.2'],['“Exploratory testing is useful when there are few or inadequate specifications”',CTFL+', §4.4.2']],
  how:'After the scripted tests, spend 15 minutes with a goal such as “try to break scheduling”. Note anything surprising as a possible defect.',rel:['errguess']},
 role:{h:'Role and permission checks',
  say:'Different users must see and do different things. Test each rule as the right role and as a wrong role.',
  q:[['“Acceptance criteria … conditions that an implementation of the user story must meet to be accepted by stakeholders.”',CTFL+', §4.5.2']],
  tip:'Practical tip (not from the book): for every “only X can …” rule, run it twice, once as X (should work) and once as someone else (should be refused). Security-type failures are usually Critical.',
  how:'Switch the “Logged in as” selector. Compare what each role sees with what the briefing says that role may do.',rel:['criteria','sevpri']},
 state:{h:'Multi-step and state-dependent behaviour',
  say:'Some faults only show after several actions, because the system remembers earlier steps.',
  q:[],
  tip:'Practical tip (not from the book): after any change, go back to the other screens that should reflect it (dashboard counts, totals, logs), and repeat an action a second time. Many defects only appear on the second or third step.',
  how:'Re-visit related screens after each action and repeat an action twice. Compare running totals and counts with what you expect by hand.',rel:['errguess','gwt']},
 calc:{h:'Check the arithmetic yourself',
  say:'Never trust a calculated number until you have worked it out independently.',
  q:[],
  tip:'Practical tip (not from the book): do the sum on paper first, from the stated rule (for example variance ÷ system quantity), then compare. Rounding and the wrong base number are common causes of wrong figures.',
  how:'Write the expected figure in the test before you look at the screen.',rel:['gwt','bva']},
 defect:{h:'Writing a good defect report',
  say:'A defect report must give the developer enough to find, reproduce and fix the problem without asking you questions.',
  q:[['Provide “those responsible for handling and resolving reported defects with sufficient information to resolve the issue”',CTFL+', §5.5'],['A defect report typically includes a unique identifier, a title with a short summary, identification of the test object and test environment, the test steps that detected the anomaly, expected results and actual results, severity, priority, and references (for example to the test case).',CTFL+', §5.5 (paraphrase)']],
  how:'The defect form here drafts the title, steps and expected result. You add the actual result, set severity, and make sure someone else could repeat it.',rel:['sevpri','decoy']},
 sevpri:{h:'Severity vs priority, and release impact',
  say:'Severity is how bad the problem is for the user or system. Priority is how soon it should be fixed. They are related but different.',
  q:[['A defect report typically records both “Severity of the defect (degree of impact)” and “Priority to fix”.',CTFL+', §5.5 (paraphrase)']],
  web:'Web guides (Marker.io, Sauce Labs) describe severity as technical or user impact, usually judged by QA, and priority as urgency, usually set by the product or business owner. A low-severity bug can be high priority (a wrong logo just before launch), and the reverse. Typical triage questions: are users blocked, and is there a workaround? (Summarised from search results.)',
  tip:'In these apps: Critical = wrong money or stock numbers, a security or permission failure, or the feature is unusable. Major = a requirement broken but there is a workaround. Minor = small annoyance. The release-impact rule (Critical in Week 3 delays release) is this exercise’s rule, so confirm the real rule with your project.',
  how:'Choose the severity from the user’s point of view. The Release impact line then shows what the Week-3 rule means for that defect.',rel:['defect','exit']},
 decoy:{h:'Not every Fail is a defect',
  say:'Some things you report turn out to be correct behaviour, a misunderstanding, or a change request. Only mark Fail when the result differs from the written expectation.',
  q:[['reported anomalies “may turn out to be real defects or something else (e.g., false–positive result, change request)”',CTFL+', §5.5']],
  how:'The answer key shows “false alarms”. Many tests are designed to pass. Before you fail one, re-read the expected result and your steps.',rel:['defect']},
 exit:{h:'Sign-off = exit criteria and approval',
  say:'Testing ends when agreed conditions are met, and a named person formally approves the release based on your evidence.',
  q:[['“Exit criteria define what must be achieved to declare an activity completed.”',CTFL+', §5.1.3'],['“Running out of time or budget can also be viewed as valid exit criteria … if the stakeholders have reviewed and accepted the risk to go live without further testing.”',CTFL+', §5.1.3']],
  web:'Web guides describe sign-off as written confirmation from business representatives that they reviewed the results and accept the release, often in a short sign-off meeting. Typical exit conditions are: critical defects fixed and retested, planned tests run, and an agreed defect threshold. (aqua-cloud, University of Minnesota, Bird Eats Bug.)',
  how:'Your recommendation (Approve / Approve with known issues / Do not approve) goes to the approver named in the briefing. Cite test IDs and defect IDs. The approver decides; you provide the evidence. Answer the question “Does this do what the real user needs it to do?” for each user need.',rel:['sevpri','cycle']},
 cycle:{h:'The 3-week cycle and late defects',
  say:'A cycle has fixed weeks. Late findings force a trade-off between delaying the release and shipping with a known issue.',
  q:[['“Running out of time or budget can also be viewed as valid exit criteria … if the stakeholders have reviewed and accepted the risk”',CTFL+', §5.1.3']],
  tip:'Practical tip (not from the book): this is why the briefing asks what happens to a problem found late in Week 3. Agree the rule before testing starts, so severity is judged on the facts, not the deadline.',
  how:'Change the week selector and open Defects: the same defect has a different release impact in Week 3.',rel:['exit','sevpri']},
 resources:{h:'Sources and books',special:'resources'}
};
const TABMAP=CFG.tabs||{};
const css=`.lrn-dock{position:fixed;right:14px;bottom:14px;display:flex;gap:6px;z-index:50}
.lrn-dock button,.lrn-i{font:inherit;cursor:pointer;border:1px solid var(--line,#ccc);background:var(--card,#fff);color:var(--ink,#222);border-radius:99px;padding:6px 12px;box-shadow:0 2px 8px #0003}
.lrn-i{padding:0 7px;margin-left:6px;font-size:12px;box-shadow:none;height:fit-content;white-space:nowrap}
.lrn-ov{position:fixed;inset:0;background:#0007;z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.lrn-card{background:var(--card,#fff);color:var(--ink,#222);border:1px solid var(--line,#ccc);border-radius:12px;max-width:620px;width:100%;max-height:86vh;overflow:auto;padding:18px 20px;font:15px/1.5 system-ui,sans-serif}
.lrn-card h3{margin:0 0 6px;color:var(--brand,#5b3a29)}.lrn-card blockquote{margin:8px 0;padding:6px 10px;border-left:3px solid #b08d57;background:#b08d5714;font-size:14px}
.lrn-card cite{display:block;color:var(--mute,#666);font-size:12px;margin-top:2px;font-style:normal}
.lrn-card .lab{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute,#666);margin:12px 0 2px}
.lrn-card .box{background:var(--line,#eee);border-radius:8px;padding:8px 10px;font-size:14px}
.lrn-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.lrn-chips button,.lrn-x{font:inherit;cursor:pointer;border:1px solid var(--line,#ccc);background:var(--card,#fff);color:var(--ink,#222);border-radius:6px;padding:4px 10px}
.lrn-card a{color:var(--brand,#5b3a29)}`;
const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
const E=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function open(key,extra){
  const t=T[key];if(!t)return;
  let b=`<h3>${E(t.h)}</h3>`;
  if(t.special==='resources'){
    b+=`<div class="lab">Syllabi and articles</div>`+SOURCES.map(s=>`<p style="margin:6px 0"><a href="${s.u}" target="_blank" rel="noopener">${E(s.t)}</a><br><small>${E(s.n)}</small></p>`).join('')+
       `<div class="lab">Books (as cited by the ISTQB syllabi)</div>`+BOOKS.map(x=>`<p style="margin:6px 0"><b>${E(x[1])}</b> (${x[2]}) by ${E(x[0])}${x[3]?', '+x[3]:''}<br><small>${E(x[4])}</small></p>`).join('')+
       `<p class="sub" style="font-size:12px">Quotes in the pop-ups come from the two ISTQB syllabi. Web articles were summarised, not quoted. Practical-tip boxes are the author’s own advice.</p>`;
  }else{
    b+=`<p>${E(t.say)}</p>`;
    if(t.q&&t.q.length)b+=`<div class="lab">From the source</div>`+t.q.map(([q,c])=>`<blockquote>${E(q)}<cite>${E(c)}</cite></blockquote>`).join('');
    if(t.web)b+=`<div class="lab">From web guides</div><div class="box">${E(t.web)}</div>`;
    if(t.tip)b+=`<div class="lab">${t.tip.startsWith('Practical')?'Practical tip':'Note'}</div><div class="box">${E(t.tip)}</div>`;
    b+=`<div class="lab">How it applies in this app</div><p style="margin:0">${E(t.how)}</p>`;
    if(extra)b+=`<div class="lab">This test</div><div class="box">${E(extra)}</div>`;
    const rel=(t.rel||[]).concat(['resources']);
    b+=`<div class="lrn-chips">${rel.map(r=>`<button data-lrn="${r}">${E(T[r].h.split(' (')[0])}</button>`).join('')}</div>`;
  }
  b+=`<div style="text-align:right;margin-top:14px"><button class="lrn-x" data-lrnx="1">Close</button></div>`;
  const old=document.querySelector('.lrn-ov');if(old)old.remove();
  const ov=document.createElement('div');ov.className='lrn-ov';ov.innerHTML=`<div class="lrn-card" role="dialog" aria-modal="true">${b}</div>`;document.body.appendChild(ov);
  ov.querySelector('.lrn-x,.lrn-chips button')&&ov.querySelector('.lrn-x').focus();
}
const close=()=>{const o=document.querySelector('.lrn-ov');if(o)o.remove()};
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest&&t.closest('[data-lrnx]'))return close();
  if(t.classList&&t.classList.contains('lrn-ov'))return close();
  const k=t.closest&&t.closest('[data-lrn]');
  if(k){e.stopPropagation();e.preventDefault();return open(k.dataset.lrn)}
  const q=t.closest&&t.closest('[data-lrntc]');
  if(q){e.stopPropagation();e.preventDefault();const id=q.dataset.lrntc,tc=(CFG.tests||{})[id];if(tc)open(tc.k,tc.note)}
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
const dock=document.createElement('div');dock.className='lrn-dock';
dock.innerHTML='<button data-lrnstep="1">ⓘ About this step</button><button data-lrn="resources">📚 Sources</button>';document.body.appendChild(dock);
dock.querySelector('[data-lrnstep]').addEventListener('click',e=>{e.stopPropagation();const tab=(CFG.getTab&&CFG.getTab())||'';open(TABMAP[tab]||'uat')});
if(CFG.tests){
  const decorate=()=>{document.querySelectorAll('.tc h3').forEach(h=>{
    if(h.querySelector('[data-lrntc]'))return;const m=h.textContent.trim().match(/^(TC-\d+)/);
    if(m&&CFG.tests[m[1]]){const b=document.createElement('button');b.type='button';b.className='lrn-i';b.dataset.lrntc=m[1];b.title='How this test works';b.textContent='ⓘ technique';h.appendChild(b)}})};
  new MutationObserver(decorate).observe(document.body,{childList:true,subtree:true});decorate();
}
})();

/* Phone support: App/Workbook switch on narrow screens + service worker registration. */
(function(){
const css=`@media(max-width:950px){
 body{font-size:16px}input,select,textarea{font-size:16px!important}button{min-height:38px}
 main{padding:10px!important;gap:10px!important;padding-bottom:84px!important}
 .mob-bar{position:sticky;top:0;z-index:40;display:flex;gap:6px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
 .mob-bar button{flex:1;font-weight:600}.mob-bar button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
 .scroll{max-height:none!important}.lrn-dock{bottom:10px;right:10px}.lrn-dock button{padding:9px 14px}
 header h1 small{display:none}
}
@media(max-width:600px){.env{grid-template-columns:1fr!important}}
@media(min-width:951px){.mob-bar{display:none}}
@media(max-width:950px) and (prefers-color-scheme:dark){.mob-bar button.on{color:#16181d}}`;
const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
const panels=document.querySelectorAll('main > .panel');
if(panels.length===2){
  const bar=document.createElement('div');bar.className='mob-bar';
  bar.innerHTML='<button data-p="0">1 · App to test</button><button data-p="1">2 · Workbook</button>';
  document.querySelector('header').after(bar);
  let cur=0;try{cur=+sessionStorage.getItem('mobpanel')||0}catch{}
  const show=i=>{cur=i;panels.forEach((p,k)=>{p.style.display=window.matchMedia('(max-width:950px)').matches&&k!==i?'none':''});
    bar.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===i));try{sessionStorage.setItem('mobpanel',i)}catch{};window.scrollTo(0,0)};
  bar.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(+b.dataset.p)});
  window.matchMedia('(max-width:950px)').addEventListener('change',()=>show(cur));
  show(cur);
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
