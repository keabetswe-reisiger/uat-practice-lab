<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Careful Tester Toolkit</title>
<meta name="theme-color" content="#0d0c0a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#16202f;--mute:#667085;--line:#e4e7ec;--brand:#11203b;--accent:#b08d57;--blue:#2563eb;--green:#16794a;--red:#c0392b;--amber:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#0f131a;--card:#1a2029;--ink:#eaeef5;--mute:#98a2b3;--line:#2b3340;--brand:#0b1220;--accent:#d9b38c;--blue:#6ea0ff;--green:#4cc88a;--red:#ff7b6b;--amber:#f0b45a}}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header h1{font-size:18px;margin:0}header h1 span{color:var(--accent)}.sp{flex:1}
header a{color:#fff;border:1px solid #ffffff44;border-radius:8px;padding:5px 11px;font-size:13px;text-decoration:none}
main{max-width:1180px;margin:auto;padding:14px 16px 90px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:10px;font-weight:600}
button.on,button.pri{background:var(--blue);border-color:var(--blue);color:#fff}@media(prefers-color-scheme:dark){button.on,button.pri{color:#0f131a}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px #1018281a}
h2{margin:0 0 6px;font-size:20px}h3{margin:0 0 4px;font-size:16px;color:var(--brand)}@media(prefers-color-scheme:dark){h3{color:var(--accent)}}
.mute{color:var(--mute);font-size:14px}.cof{border-left:3px solid var(--accent);padding:4px 10px;margin-top:8px;background:#b08d5714;border-radius:4px;font-size:14.5px}
.ev{font-size:12.5px;color:var(--mute);margin-top:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
label.cb{display:flex;gap:9px;align-items:flex-start;padding:6px 2px;cursor:pointer}label.cb input{margin-top:5px}
input[type=text],textarea,select{font:inherit;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 10px}
.timer{font:700 40px ui-monospace,Menlo,monospace;text-align:center;margin:6px 0}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.log{font:13.5px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:240px;overflow:auto;white-space:pre-wrap}
.rc{background:#fff;color:#16202f;border:2px solid #cbd2dc;border-radius:8px;font:14px ui-monospace,Menlo,monospace;overflow:hidden}
.rc div{display:flex;justify-content:space-between;padding:4px 10px;border-bottom:1px dashed #d8dde6}.rc div:last-child{border:0}.rc .t{cursor:pointer}.rc .t:hover{background:#2563eb22}.rc .sel{background:#2563eb33!important;outline:2px solid #2563eb}.rc .hit{background:#16794a33}.rc .miss{background:#c0392b33}
.res{border-radius:10px;padding:10px 12px;margin-top:10px;background:#16794a1f}.res.no{background:#c0392b1f}
</style><!--BRAND--><link rel="stylesheet" href="brand.css"><!--/BRAND-->
</head><body>
<header><h1><span>Careful</span> Tester Toolkit</h1><div class="sp"></div><a href="start-here.html">Start here</a><a href="tickets.html">Tickets</a><a href="index.html">Home</a></header>
<main><nav id="nav"></nav><div id="v"></div></main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];const shuffle=(r,a)=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const KEY='careful-v1';let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch{S={}}
S.chk=S.chk||{};S.cov=S.cov||{};S.sessions=S.sessions||[];S.eye=S.eye||{plays:0,best:0};S.cur=S.cur||{charter:'',mins:30,notes:'',left:null,running:false,start:null};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
const TABS=[['mind','1 Why details slip'],['check','2 Checklists'],['oracle','3 Oracles & coverage'],['studio','4 Session studio'],['eye','5 Eagle-eye training']];let tab=S.tab||'mind';

/* ---------------- content ---------------- */
const MIND=[
 ['Inattentional blindness','When you concentrate hard on one check (“is the total right?”) you can completely miss something obvious elsewhere on the screen, such as a misspelled company name. Scripted checks make this more likely.','After every scripted check, do a <b>10-second look-around</b>: “what else on this screen looks odd?”','You count the shots so carefully you never notice the cup is cracked.'],
 ['Confirmation bias','You expect it to work, so you notice what confirms that and skim past what doesn’t.','Before you start, write down <b>one way you think it could fail</b> and try that first.','You taste the new blend hoping it’s good, and only notice the nice notes.'],
 ['Familiarity blindness','After seeing a screen 50 times your brain stops reading it.','Read the screen <b>out loud, word by word</b> once. Or look away for a minute, then look back.','The barista who has made 1,000 flat whites stops looking at the cup.'],
 ['Bias blind spot','Testers find it easier to see bias in others than in themselves, so “I’m careful” is not enough.','Use <b>outside prompts</b>: checklists, a pair-testing partner, and detailed notes, not memory.','A pilot still uses the checklist, however many flights they’ve flown.'],
 ['Pair up','A second person notices different things. A non-tester (a real user, a developer) is especially good.','When stuck or unsure, have someone else do the same steps and compare what you each saw.','Two baristas taste the same cup and describe different problems.'],
 ['Take detailed notes','Notes make you slow down and see. They also make your bug report accurate and repeatable.','Write what you <b>see</b> (exact words and numbers), not what you <b>think</b>.','“Table 4, 10:05, tea instead of a flat white”, not “drink wrong”.']];
const SRC=[['Inattentional blindness and scripted tests (DEV Community)','https://dev.to/mlapierre/inattentional-blindness-and-scripted-tests-2m24'],['Do You Have Blind Spots in Your Software Testing? (TestRail)','https://www.testrail.com/blog/blind-spots-software-testing/'],['Cognitive biases in software testing (PractiTest)','https://www.practitest.com/resource-center/article/cognitive-biases-in-software-testing/'],['Squash Bugs: Breaking Your Testing Biases (StickyMinds)','https://www.stickyminds.com/interview/squash-bugs-breaking-your-testing-biases-interview-gerie-owen-and-peter-varhol'],['How perceptual blindness affects software testing (ReqTest)','https://reqtest.com/testing-blog/how-perceptual-blindness-or-inattention-blindness-affects-software-testing'],['Session-based testing (Wikipedia)','https://en.wikipedia.org/wiki/Session-based_testing'],['Heuristics and oracles (UConn)','https://pmo.its.uconn.edu/2017/12/21/heuristics-and-oracles'],['SFDIPOT history (DevelopSense)','https://developsense.com/?p=1773']];
const CHK={before:['I am on the right environment (Staging, not Production) and the right version','I am logged in as the role the test names','I know the starting data (fresh state, or what the last test changed)','I read the Expected result twice, before touching anything','Notes are open and a timer or clock is visible','I wrote one way I think this could fail (beats confirmation bias)'],
 during:['I do one step at a time and look at the screen after each','I copy exact words and numbers (don’t paraphrase)','I take a screenshot or note the time for anything odd','After each check I do a 10-second look-around: what else looks odd?','If something confuses me I log a question, I don’t guess','I change only one thing between attempts'],
 after:['I compared Actual with Expected word by word','I asked: could this be my mistake (wrong role, stale data, wrong version)?','I repeated it once to see if it happens again','My steps could be followed by a stranger','Severity chosen with a reason','I logged it now, not “later”']};
const FEW=[['Familiar problems','Does it look like a bug we’ve seen before?','Search that ignores capital letters, or a total that’s one cent off.'],['Explainability','Can I explain why it behaves like this?','If you can’t explain why the count changed, dig.'],['World','Does it match how the real world works?','A booking in the past, 31 February, or a negative quantity.'],['History','Does it match how the previous version behaved?','v2 shows different search results from v1.'],['Image','Does it fit the company’s image and branding?','A typo in the brand name or wrong colour on the Production banner.'],['Comparable products','Do similar apps behave differently?','Other booking apps refuse double-bookings.'],['Claims','Does it match what the spec, ticket or help text says?','Ticket says “Pending Review”; screen says “Confirmed”.'],['User expectations','Would a reasonable user expect this?','Cancel should remove the item and update the counter.'],['Product (internal consistency)','Is it consistent with itself?','Dashboard says 3 upcoming but the Diary shows 2.'],['Purpose','Does it serve the reason the feature exists?','A doctor’s screen that shows other doctors’ patients defeats the purpose.'],['Standards & statutes','Does it follow rules, laws and standards?','Patient data must be protected (privacy law).']];
const SFD=[['Structure','What is it made of? (screens, modules, files)','Every tab opens; version v1 vs v2 differences.'],['Function','What does it do? (features, calculations, errors)','Book, cancel, search, filter, errors when input is wrong.'],['Data','What does it process? (valid, invalid, boundary, empty, huge)','Blank name, 1-char name, very long name, special characters é ’ &.'],['Interfaces','How does it connect? (UI, APIs, imports/exports, other systems)','The API, CSV export, notifications.'],['Platform','What does it depend on? (browser, device, OS, network)','Phone vs laptop, Chrome vs Safari, offline.'],['Operations','How will real people use it? (roles, normal and unusual use)','Doctor vs Manager; a busy Monday morning.'],['Time','How does time affect it? (dates, order, timing, waiting)','Appointment today/yesterday, two clicks at once, slow response.']];

/* ---------------- views ---------------- */
function view(){S.tab=tab;save();$('nav').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');
 if(tab==='mind')$('v').innerHTML=`<div class="card"><h2>Why careful people still miss bugs</h2><p>Missing a bug is rarely about being lazy. Your attention is limited, and it works in predictable ways. Here are six traps and a countermeasure for each.</p><div class="mute">Evidence note: this advice comes mostly from practitioner articles and conference talks rather than controlled studies, so treat it as proven habits to try, not guaranteed science.</div></div><div class="grid">`+MIND.map(m=>`<div class="card"><h3>${m[0]}</h3><p style="margin:2px 0">${m[1]}</p><p style="margin:6px 0"><b>Do this:</b> ${m[2]}</p><div class="cof">${m[3]}</div></div>`).join('')+`</div><div class="card"><h3>Sources I used</h3>${SRC.map(s=>`<div class="ev">• <a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></div>`).join('')}</div>`;
 if(tab==='check')$('v').innerHTML=`<div class="card"><h2>Pocket checklists</h2><p class="mute">Use them for every ticket. A checklist replaces memory, and memory is exactly what bias tricks. Ticks save on this device.</p><button data-reset="1">Clear all ticks (new ticket)</button></div>`+[['before','Before you start'],['during','While you test'],['after','Before you mark Pass / Fail']].map(([k,l])=>`<div class="card"><h3>${l}</h3>${CHK[k].map((t,i)=>`<label class="cb"><input type="checkbox" data-c="${k}${i}" ${S.chk[k+i]?'checked':''}> ${t}</label>`).join('')}<div class="mute">${CHK[k].filter((_,i)=>S.chk[k+i]).length}/${CHK[k].length}</div></div>`).join('');
 if(tab==='oracle')$('v').innerHTML=`<div class="card"><h2>How do I know it’s wrong?</h2><p>An <b>oracle</b> is anything that helps you decide “pass or fail?”. None is perfect: each can miss a real problem or raise a false alarm, so combine several. These are the “A FEW HICCUPPS” prompts used by professional testers.</p></div><div class="grid">`+FEW.map(f=>`<div class="card"><h3>${f[0]}</h3><div>${f[1]}</div><div class="mute" style="margin-top:4px">e.g. ${f[2]}</div></div>`).join('')+`</div>
  <div class="card"><h2>Did I cover enough? (SFDIPOT)</h2><p class="mute">Pick a feature, then tick the angles you actually tested. An empty angle is either not applicable or a gap.</p><input type="text" id="feat" placeholder="Feature (e.g. Book appointment)" value="${esc(S.cov.feat||'')}">${SFD.map((s,i)=>`<label class="cb"><input type="checkbox" data-cov="${i}" ${S.cov[i]?'checked':''}><span><b>${s[0]}</b>: ${s[1]}<br><span class="mute">e.g. ${s[2]}</span></span></label>`).join('')}<div class="res ${SFD.every((_,i)=>S.cov[i])?'':'no'}">${SFD.filter((_,i)=>!S.cov[i]).length?'Gaps to consider: '+SFD.filter((_,i)=>!S.cov[i]).map(s=>s[0]).join(', '):'All 7 angles considered.'}</div></div>`;
 if(tab==='studio')studio();
 if(tab==='eye')eye()}

/* ---------------- Session studio ---------------- */
let tick=null;
function fmt(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function remaining(){const c=S.cur;if(c.running)return c.left-(Date.now()-c.start)/1000;return c.left??c.mins*60}
function studio(){const c=S.cur;const PRE=['Explore Book appointment with odd dates and repeated bookings to discover ways to double-book or save wrong data.','Explore Patients search and filters with capital letters, spaces and special characters to discover results that are missing or wrong.','Explore the Doctor role across every screen to discover data or controls a doctor should not see.','Explore the Walk-in form with blank, huge and strange input to discover what gets saved when it should not.'];
 $('v').innerHTML=`<div class="card"><h2>Exploratory session studio</h2><p class="mute">Professional exploratory testing is done in time-boxed sessions with a written mission (a <b>charter</b>) and notes you can understand months later. This tool gives you the structure.</p>
 <label class="mute">Charter: “Explore [what] with [how] to discover [risks]”</label><textarea id="ch" rows="2">${esc(c.charter)}</textarea>
 <div class="btns">${PRE.map((p,i)=>`<button data-pre="${i}" style="font-weight:400;font-size:13px">Example ${i+1}</button>`).join('')}</div>
 <label class="mute" style="margin-top:10px;display:block">Session length</label><select id="mins">${[15,30,45,60,90].map(m=>`<option ${c.mins===m?'selected':''}>${m}</option>`).join('')}</select>
 <div class="timer" id="tm">${fmt(remaining())}</div><div class="btns" style="justify-content:center"><button class="pri" data-t="go">${c.running?'Pause':'Start / Resume'}</button><button data-t="reset">Reset</button></div></div>
 <div class="card"><h3>Notes (timestamped)</h3><input type="text" id="nt" placeholder="Type, then press a button"><div class="btns"><button data-n="NOTE">+ Note</button><button data-n="BUG">Bug</button><button data-n="QUESTION">Question</button><button data-n="IDEA">Idea</button><button data-n="ISSUE">Obstacle</button></div><div class="log" id="lg" style="margin-top:8px">${esc(c.notes)||'No notes yet.'}</div></div>
 <div class="card"><h3>Finish: quick debrief</h3><label class="mute">Time on the charter vs off it</label><select id="on"><option>Almost all on charter</option><option>About ¾ on charter</option><option>About half</option><option>Mostly off charter</option></select><label class="mute" style="margin-top:8px;display:block">What did I cover?</label><textarea id="cv" rows="2"></textarea><label class="mute" style="margin-top:8px;display:block">What did I NOT get to?</label><textarea id="nc" rows="2"></textarea>
 <div class="btns"><button class="pri" data-t="save">Save session</button></div></div>
 <div class="card"><h3>Saved sessions (${S.sessions.length})</h3>${S.sessions.map((s,i)=>`<div class="card" style="margin:8px 0"><b>${esc(s.when)}</b> · ${s.mins} min · ${esc(s.on)}<div class="mute">${esc(s.charter)}</div><div class="log" style="max-height:120px;margin-top:6px">${esc(s.notes)}</div><div class="mute">Covered: ${esc(s.cv)||'-'} · Not covered: ${esc(s.nc)||'-'}</div><div class="btns"><button data-cp="${i}">Copy</button><button data-del="${i}">Delete</button></div></div>`).join('')||'<div class="mute">None yet.</div>'}</div>`;
 clearInterval(tick);tick=setInterval(()=>{const t=$('tm');if(!t){clearInterval(tick);return}const r=remaining();t.textContent=fmt(r);if(S.cur.running&&r<=0){S.cur.running=false;S.cur.left=0;save();try{navigator.vibrate&&navigator.vibrate(300)}catch{}alert('Time is up. Finish your thought, then do the debrief.');studio()}},500)}
function stamp(){const d=new Date();return d.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
/* ---------------- Eagle-eye training ---------------- */
const ITEMS=[['Flat white',2,'R38.00'],['Cappuccino',1,'R42.00'],['Blueberry muffin',3,'R27.50'],['Filter coffee',2,'R25.00'],['Croissant',1,'R32.00'],['Iced latte',2,'R45.00']];
let E=null;
function newDiff(){const r=rng(Date.now());const its=shuffle(r,ITEMS).slice(0,4);const total=its.reduce((a,x)=>a+x[1]*parseFloat(x[2].slice(1)),0);
 const L=[['Sunrise Cafe','Tax invoice'],['Date','2026-11-03'],...its.map(x=>[x[0]+' x'+x[1],x[2]]),['Subtotal','R'+total.toFixed(2)],['VAT 15%','R'+(total*.15).toFixed(2)],['TOTAL','R'+(total*1.15).toFixed(2)]];
 const R=L.map(x=>[...x]);const idx=shuffle(r,L.map((_,i)=>i).filter(i=>i>0)).slice(0,3+Math.floor(r()*2));const kinds=[];
 idx.forEach(i=>{const[a,b]=R[i];if(i===1)R[i][1]='2026-03-11';else if(/x\d/.test(a)){const k=pick(r,['q','p','t']);if(k==='q')R[i][0]=a.replace(/x(\d)/,(m,d)=>'x'+((+d%9)+1));else if(k==='p')R[i][1]=b.replace(/(\d)\.(\d)(\d)/,'$1.$3$2').replace('R38.00','R83.00').replace('R42.00','R24.00');else R[i][0]=a.replace(/[aeiou]/,'o')}else R[i][1]=b.replace(/(\d)(?=\.\d\d$)/,d=>String((+d+1)%10)).replace(/^R/,'R');
  if(R[i][0]===L[i][0]&&R[i][1]===L[i][1])R[i][1]=L[i][1].replace(/\d(?=\D*$)/,d=>String((+d+3)%10))});
 return{L,R,diff:idx.filter(i=>R[i][0]!==L[i][0]||R[i][1]!==L[i][1])}}
const LOOK=[
 {task:'Check the arithmetic: is the total equal to the sum of the rows?',scr:['Sunrize Clinics · Receipt','Consultation  R450.00','Blood test    R220.00','TOTAL         R670.00'],odd:0,why:'Brand is “Sunrise”, spelled wrong. The total was right, but you were told to check only that.'},
 {task:'Check that the appointment is on the correct doctor.',scr:['Appointment #104','Doctor: Dr Thabo','Date: 2026-11-13','Status: Confimed'],odd:3,why:'“Confimed” is a typo in the status. Pure doctor-checking misses it.'},
 {task:'Verify the VAT is 15% of the subtotal.',scr:['Subtotal R200.00','VAT 15% R30.00','Total R230.00','Thank you for shoping with us'],odd:3,why:'“shoping” is misspelled. Easy to miss when staring at numbers.'},
 {task:'Verify the patient’s name matches the ID.',scr:['Patient: Zanele Mokoena','ID: ZM-4021','Branch: Sandton','Next visit: 2025-11-20'],odd:3,why:'The next visit date is in the past (2025). Matching names made you stop reading.'},
 {task:'Check the quantity equals the number of items listed.',scr:['Items: 3','• Muffin','• Coffee','• Croissant','Delivery: Free (orders ≥ R150)  ·  Order total: R95'],odd:4,why:'Free delivery on R95 contradicts the rule (≥ R150). The counting task hid it.'}];
function eye(){if(!E)E={mode:'menu'};
 if(E.mode==='menu'){$('v').innerHTML=`<div class="card"><h2>Train your eye</h2><p>Two drills that build the habits from tab 1. Both are generated randomly, so they never repeat.</p><div class="mute">Best spot-the-difference score: ${S.eye.best}% · plays: ${S.eye.plays}</div></div><div class="grid"><div class="card"><h3>Spot the differences</h3><p class="mute">Compare two almost-identical receipts and tap every row on the right that is different. Slow, systematic reading beats a quick glance.</p><button class="pri" data-e="diff">Start</button></div><div class="card"><h3>The look-around drill</h3><p class="mute">You get a narrow check to perform. Then you’re asked whether anything <i>else</i> was off. Trains the 10-second look-around.</p><button class="pri" data-e="look">Start</button></div></div>`;return}
 if(E.mode==='diff'){const d=E.d;const row=(x,i,side)=>`<div ${side==='R'?`class="t ${E.sel.has(i)&&!E.done?'sel':''}${E.done?(d.diff.includes(i)?(E.sel.has(i)?' hit':' miss'):(E.sel.has(i)?' miss':'')):''}" data-r="${i}"`:''}><span>${esc(x[0])}</span><span>${esc(x[1])}</span></div>`;
  $('v').innerHTML=`<div class="card"><div class="mute">Tap rows on the <b>right</b> receipt that differ from the left. Read, don’t glance. ${E.done?'':'There are '+d.diff.length+' differences.'}</div><div class="grid" style="margin-top:8px"><div class="rc">${d.L.map((x,i)=>row(x,i,'L')).join('')}</div><div class="rc">${d.R.map((x,i)=>row(x,i,'R')).join('')}</div></div>
  ${E.done?`<div class="res ${E.score>=75?'':'no'}"><b>Score ${E.score}%</b>: found ${E.hits}/${d.diff.length}${E.fp?`, ${E.fp} false alarm(s)`:''}. Green = correct, red = missed or wrong. <div class="cof">A careful barista reads the whole order slip, not just the drink name.</div></div><div class="btns"><button class="pri" data-e="diff">Another</button><button data-e="menu">Back</button></div>`:`<div class="btns"><button class="pri" data-e="chk">Check</button><button data-e="menu">Back</button></div>`}</div>`;return}
 if(E.mode==='look'){const q=E.q;if(E.stage===1){$('v').innerHTML=`<div class="card"><div class="mute">Question ${E.n+1} of 3</div><h3>Task: ${q.task}</h3><div class="rc" style="padding:8px 0">${q.scr.map(l=>`<div><span>${esc(l)}</span></div>`).join('')}</div><div class="btns"><button class="pri" data-e="l1">I’ve checked it</button></div></div>`;return}
  $('v').innerHTML=`<div class="card"><h3>Now: did you notice anything else odd on that screen?</h3><div class="mute">Tap the line you think is wrong, or “nothing”.</div>${q.scr.map((l,i)=>`<label class="cb"><input type="radio" name="o" value="${i}" ${E.done?'disabled':''}> ${esc(l)}</label>`).join('')}<label class="cb"><input type="radio" name="o" value="-1" ${E.done?'disabled':''}> Nothing else was wrong</label>
  ${E.done?`<div class="res ${E.ok?'':'no'}"><b>${E.ok?'You caught it.':'Easy to miss, and that is the point.'}</b> ${q.why}<div class="cof">Next time, finish the check, then spend 10 seconds reading the whole screen.</div></div><div class="btns"><button class="pri" data-e="${E.n>=2?'lend':'lnext'}">${E.n>=2?'Finish':'Next'}</button></div>`:`<div class="btns"><button class="pri" data-e="l2">Submit</button></div>`}</div>`}
 if(E.mode==='lend'){$('v').innerHTML=`<div class="card"><h2>Drill complete: ${E.caught}/3 caught</h2><p>${E.caught===3?'Excellent look-around habit.':'Everyone misses some. Build the 10-second look-around into every check.'}</p><div class="btns"><button class="pri" data-e="look">Again</button><button data-e="menu">Back</button></div></div>`}}
document.addEventListener('click',e=>{const d=e.target.dataset||{};
 if(d.tab){tab=d.tab;view();return}
 if(d.reset){S.chk={};save();view();return}
 if(d.pre!==undefined){const PRE=['Explore Book appointment with odd dates and repeated bookings to discover ways to double-book or save wrong data.','Explore Patients search and filters with capital letters, spaces and special characters to discover results that are missing or wrong.','Explore the Doctor role across every screen to discover data or controls a doctor should not see.','Explore the Walk-in form with blank, huge and strange input to discover what gets saved when it should not.'];S.cur.charter=PRE[+d.pre];save();studio();return}
 if(d.t==='go'){const c=S.cur;if(c.running){c.left=remaining();c.running=false}else{c.left=c.left??c.mins*60;if(c.left<=0)c.left=c.mins*60;c.start=Date.now();c.running=true;if(!c.notes)c.notes='Session started '+stamp()+'\n'}save();studio()}
 else if(d.t==='reset'){S.cur={charter:S.cur.charter,mins:S.cur.mins,notes:'',left:null,running:false,start:null};save();studio()}
 else if(d.t==='save'){const c=S.cur;S.sessions.unshift({when:new Date().toLocaleString('en-ZA',{dateStyle:'medium',timeStyle:'short'}),mins:c.mins,charter:c.charter||'(no charter)',notes:c.notes,on:$('on').value,cv:$('cv').value,nc:$('nc').value});S.cur={charter:'',mins:c.mins,notes:'',left:null,running:false,start:null};save();studio()}
 else if(d.n){const t=$('nt').value.trim();if(!t)return;S.cur.notes=(S.cur.notes||'')+stamp()+' ['+d.n+'] '+t+'\n';save();studio()}
 else if(d.cp!==undefined){const s=S.sessions[+d.cp];navigator.clipboard&&navigator.clipboard.writeText(`SESSION ${s.when} (${s.mins} min)\nCharter: ${s.charter}\n${s.notes}\nOn charter: ${s.on}\nCovered: ${s.cv}\nNot covered: ${s.nc}`).then(()=>alert('Session copied.'))}
 else if(d.del!==undefined){if(confirm('Delete this session?')){S.sessions.splice(+d.del,1);save();studio()}}
 else if(d.e){const k=d.e;
  if(k==='menu'){E={mode:'menu'}}
  else if(k==='diff'){E={mode:'diff',d:newDiff(),sel:new Set(),done:false}}
  else if(k==='chk'){const df=E.d.diff;E.hits=[...E.sel].filter(i=>df.includes(i)).length;E.fp=E.sel.size-E.hits;E.score=Math.max(0,Math.round((E.hits*25-E.fp*10)/(df.length*25)*100));E.done=true;S.eye.plays++;S.eye.best=Math.max(S.eye.best,E.score);save()}
  else if(k==='look'){E={mode:'look',n:0,caught:0,order:shuffle(rng(Date.now()),LOOK),stage:1};E.q=E.order[0]}
  else if(k==='l1'){E.stage=2}
  else if(k==='l2'){const c=document.querySelector('input[name=o]:checked');if(!c)return;E.ok=+c.value===E.q.odd;if(E.ok)E.caught++;E.done=true}
  else if(k==='lnext'){E.n++;E.q=E.order[E.n];E.stage=1;E.done=false}
  else if(k==='lend'){E.mode='lend'}
  eye()}
 else if(d.r!==undefined&&E&&E.mode==='diff'&&!E.done){const i=+d.r;E.sel.has(i)?E.sel.delete(i):E.sel.add(i);eye()}});
document.addEventListener('change',e=>{const d=e.target.dataset||{};
 if(d.c){S.chk[d.c]=e.target.checked;save();view()}else if(d.cov!==undefined){S.cov[d.cov]=e.target.checked;save();view()}
 else if(e.target.id==='mins'){S.cur.mins=+e.target.value;if(!S.cur.running){S.cur.left=null}save();studio()}});
document.addEventListener('input',e=>{if(e.target.id==='ch'){S.cur.charter=e.target.value;save()}else if(e.target.id==='feat'){S.cov.feat=e.target.value;save()}});
view();
</script><script src="tickets.js"></script><script src="ticketpanel.js"></script><script src="nav.js"></script><!--SYNC--><script src="sync.js"></script><!--/SYNC-->
