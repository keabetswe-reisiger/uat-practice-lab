<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Schema lab | SQL Academy | UAT Lab</title><meta name="theme-color" content="#11203b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="sqa.css"><!--BRAND--><link rel="stylesheet" href="brand.css"><!--/BRAND--></head><body>
<main><h2 class="pt">Schema lab</h2><div id="intro"></div><div class="row" id="pick"></div><div id="lab"></div></main>
<script src="sql-wasm.js"></script><script src="sqa-dbs.js"></script><script src="sqa-schema-data.js"></script><script src="sqa-core.js"></script>
<script>
SA.frame('sqa-schema.html');const $=SA.$,esc=SA.esc,SC=window.SCHEMAS;
$('intro').innerHTML=SA.startHere({plain:'Good SQL starts with good tables. In this lab you take a messy spreadsheet and split it into proper tables, see the diagram drawn from your choices, and then write the CREATE TABLE statements yourself. They are checked by a real database.',coffee:'One giant order sheet repeats "Thandi, Johannesburg" on every line. A tidy shop keeps one customer card per person, and the order slip carries only the card number.',example:'-- one customers table, written once\nCREATE TABLE customers(\n  customer_id INTEGER PRIMARY KEY,\n  customer_name TEXT NOT NULL,\n  customer_city TEXT\n);',exampleNote:'Orders then store only customer_id, a foreign key that points back to this table.',steps:['Pick a scenario and look at the flat sheet. Spot what repeats.','Give every column to the table it describes.','Name the link columns, then look at the diagram.','Write the CREATE TABLE statements and press Check.'],glossary:[['Normalisation','Splitting data so each fact is stored once.'],['Primary key','The column that identifies a row (underlined in the diagram).'],['Foreign key','A column that stores another table\'s key to link rows.'],['One-to-many','One customer, many orders. The "many" side holds the foreign key.']]});
let cur=SC[0].id;const done=id=>(SA.get('schema',id)||{}).ok;
function pick(){$('pick').innerHTML=SC.map(s=>'<button class="'+(s.id===cur?'pri':'')+'" data-s="'+s.id+'">'+esc(s.title)+(done(s.id)?' (done)':'')+'</button>').join('')}
$('pick').onclick=e=>{const b=e.target.closest('[data-s]');if(b){cur=b.dataset.s;pick();lab()}};
function flatTable(s){return '<div class="res"><table><tr>'+s.flat.cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+s.flat.rows.map(r=>'<tr>'+r.map(v=>'<td>'+(v===null?'<i>NULL</i>':esc(v))+'</td>').join('')+'</tr>').join('')+'</table></div>'}
function diagram(s,asg){const tabs=s.tables.map(t=>({name:t[0],pk:t[1],cols:t[2].map(c=>c[0])}));const W=190,gap=34,rowH=20;const x={};let maxH=0;tabs.forEach((t,i)=>{x[t.name]=10+i*(W+gap);maxH=Math.max(maxH,t.cols.length)});
 const cols=tabs.length,wTot=10+cols*(W+gap),hTot=40+maxH*rowH+30;let svg='<svg class="ersvg" viewBox="0 0 '+wTot+' '+hTot+'" role="img" aria-label="Diagram of the tables and their links">';
 const pos={};tabs.forEach(t=>{const h=28+t.cols.length*rowH;svg+='<rect x="'+x[t.name]+'" y="10" width="'+W+'" height="'+h+'" rx="8" fill="#fff" stroke="#b08d57" stroke-width="2"/><rect x="'+x[t.name]+'" y="10" width="'+W+'" height="26" rx="8" fill="#11203b"/><text x="'+(x[t.name]+10)+'" y="28" fill="#fff" font-size="14" font-weight="700">'+t.name+'</text>';
  t.cols.forEach((c,i)=>{const y=54+i*rowH;pos[t.name+'.'+c]=[x[t.name],y-5];svg+='<text x="'+(x[t.name]+10)+'" y="'+y+'" font-size="13" fill="#16202f"'+(c===t.pk?' font-weight="700" text-decoration="underline"':'')+'>'+c+(c===t.pk?' (key)':'')+'</text>'})});
 s.links.forEach((l,i)=>{const a=pos[l[0]+'.'+l[1]];const bt=tabs.find(t=>t.name===l[2]);const b=pos[l[2]+'.'+bt.pk];if(!a||!b)return;const self=l[0]===l[2];let d;
  if(self){d='M'+(a[0]+W)+' '+a[1]+' C'+(a[0]+W+40)+' '+a[1]+' '+(a[0]+W+40)+' '+(b[1]-30)+' '+(a[0]+W)+' '+(b[1]-30)}else{const right=a[0]<b[0];const xa=right?a[0]+W:a[0],xb=right?b[0]:b[0]+W;d='M'+xa+' '+a[1]+' C'+(xa+(right?30:-30))+' '+a[1]+' '+(xb+(right?-30:30))+' '+b[1]+' '+xb+' '+b[1]}
  svg+='<path d="'+d+'" fill="none" stroke="#7a5a1e" stroke-width="1.6" stroke-dasharray="4 3"/>'});
 svg+='</svg>';return svg+'<p class="mute">Dashed lines run from a foreign key to the table it points at.</p>'}
function lab(){const s=SC.find(x=>x.id===cur);const names=s.tables.map(t=>t[0]);const home={};s.tables.forEach(t=>t[2].forEach(c=>home[c[0]]=[t[0],c[1]]));
 $('lab').innerHTML='<div class="card"><h2 style="margin-top:0">'+esc(s.title)+'</h2><p>'+s.story+'</p><h3>The flat sheet</h3>'+flatTable(s)+'<h3>Step 1: give each column to its table</h3><div class="grid">'+s.flat.cols.map(c=>'<label>'+c+'<br><select data-c="'+c+'"><option value="">Choose a table</option>'+names.map(n=>'<option>'+n+'</option>').join('')+'</select></label>').join('')+'</div><div class="row" style="margin-top:8px"><button class="pri" id="c1">Check my split</button></div><div id="f1"></div><div id="d" hidden><h3>Step 2: your diagram</h3><div id="dg"></div></div><div id="w" hidden><h3>Step 3: write the tables</h3><p>Write one <code>CREATE TABLE</code> per table. Use the same column names, mark the primary keys, and add a <code>REFERENCES</code> for each foreign key. Tables: <b>'+names.join(', ')+'</b>.</p><div id="ed"></div><div class="row" style="margin:8px 0"><button class="pri" id="c3">Check my tables</button></div><div id="f3"></div></div></div>';
 let step1=false;
 $('c1').onclick=()=>{let wrong=[],all=true;document.querySelectorAll('[data-c]').forEach(sel=>{const c=sel.dataset.c;if(!sel.value){all=false;return}if(sel.value!==home[c][0])wrong.push([c,home[c]])});
  if(!all){$('f1').innerHTML='<div class="msg no">Choose a table for every column first.</div>';return}
  $('f1').innerHTML=wrong.length?'<div class="msg no">'+wrong.length+' column(s) are in the wrong table:</div>'+wrong.map(w=>'<div class="msg info"><b>'+w[0]+'</b> belongs in <b>'+w[1][0]+'</b>. '+w[1][1]+'</div>').join(''):'<div class="msg ok">Every column is in the right table. Each fact is now stored once.</div>';
  if(!wrong.length){step1=true;$('d').hidden=false;$('w').hidden=false;$('dg').innerHTML=diagram(s);if(!$('ed').firstChild)SA.editor($('ed'),{db:'coffee',sql:'-- write your CREATE TABLE statements here\n'});}};
 $('c3').onclick=async()=>{const SQL=await SA.ready();const db=new SQL.Database();const r=SA.exec(db,$('ed').querySelector('textarea').value);if(r.err){$('f3').innerHTML='<div class="msg no">SQLite says: '+esc(r.err)+'</div>';return}
  const probs=[];for(const t of s.tables){const info=SA.exec(db,"SELECT name, pk FROM pragma_table_info('"+t[0]+"')");if(info.err||!info.rows.length){probs.push('Table '+t[0]+' was not created.');continue}const have=info.rows.map(x=>x[0]);t[2].forEach(c=>{if(!have.includes(c[0]))probs.push('Table '+t[0]+' is missing column '+c[0]+'.')});const pks=info.rows.filter(x=>x[1]>0).map(x=>x[0]);if(pks.join()!==t[1])probs.push('Table '+t[0]+' should have primary key '+t[1]+'.')}
  for(const l of s.links){const fk=SA.exec(db,"SELECT \"from\", \"table\" FROM pragma_foreign_key_list('"+l[0]+"')");if(fk.err||!fk.rows.some(x=>x[0]===l[1]&&x[1]===l[2]))probs.push('Table '+l[0]+' needs '+l[1]+' ... REFERENCES '+l[2]+'.')}
  db.close();if(probs.length)$('f3').innerHTML='<div class="msg no"><b>Not yet:</b><ul>'+probs.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul></div>';else{SA.set('schema',s.id,{ok:true});pick();$('f3').innerHTML='<div class="msg ok">Correct. Your tables, keys and foreign keys match the design. Try another scenario.</div>'}}}
pick();lab();
</script><script src="nav.js"></script><!--SYNC--><script src="sync.js"></script><!--/SYNC-->
</body></html>
