<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Write a Test Case</title>
<meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fff;--card:#fff;--ink:#16202f;--mute:#4a5568;--line:#d5dae2;--brand:#7a5a1e;--accent:#7a5a1e;--blue:#7a5a1e;--green:#11663f;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}header h1{font-size:18px;margin:0}.sp{flex:1}header a{border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13px;text-decoration:none;color:inherit}
main{max-width:1180px;margin:auto;padding:16px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}h2{margin:0 0 4px;font-size:19px}h3{margin:10px 0 4px;font-size:15px}.mute{color:var(--mute);font-size:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}@media(max-width:980px){.two{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 3px}input,select,textarea{font:inherit;width:100%;border:1px solid #b8c0cc;border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer;border:1px solid #b8c0cc;background:#fff;color:var(--ink);padding:7px 13px;border-radius:9px;font-weight:600}button.pri{background:#c9a66e;border-color:#b38e52;color:#1d1608}
.tag{font:12px ui-monospace,monospace;background:#eef1f5;border:1px solid var(--line);border-radius:99px;padding:1px 9px}
pre{background:#f3f4f6;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;margin:6px 0}
.q{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.q span{font-size:12.5px;border-radius:99px;padding:1px 9px;border:1px solid var(--line)}.q .y{background:#11663f1a;border-color:#11663f}.q .n{background:#b423181a;border-color:#b42318}
.cof{border-left:3px solid #b38e52;background:#c9a66e24;padding:6px 10px;border-radius:4px;margin:8px 0}
</style><!--BRAND--><link rel="stylesheet" href="brand.css"><!--/BRAND-->
</head><body>
<header><h1>Write a Test Case</h1><span class="sp"></span><a href="appbugs.html">Test this app</a><a href="portfolio.html">Portfolio</a><a href="index.html">Home</a></header>
<main><div id="v"></div></main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='tcase-v1';let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch{S={}}S.items=S.items||[];S.editing=null;S.draft=null;
const save=()=>{try{const o=Object.assign({},S);delete o.editing;delete o.draft;localStorage.setItem(KEY,JSON.stringify(o))}catch{}};
const EX={id:'UAT-COF-003',title:'Discount code reduces total by 10%',req:'REQ-07: A valid code takes 10% off the cart total',pre:'Cart holds 1 medium cappuccino (R40.00)',data:'Code: SAVE10',path:'Happy path',steps:'1. Open the cart.\n2. Type SAVE10 in the code box.\n3. Tap Apply.',exp:'Total changes from R40.00 to R36.00 and a "Code applied" message appears.'};
const TECHG=/\b(api|json|sql|database|query|http|status code|dom|css|html|stack trace|endpoint|payload|null|exception|localstorage)\b/gi;const VAGUEG=/\b(correct(ly)?|proper(ly)?|works?|working|fine|as expected|successful(ly)?|good|right|ok(ay)?|appropriate|normal(ly)?)\b/gi;const VAGUE=/\b(correct(ly)?|proper(ly)?|works?|working|fine|as expected|successful(ly)?|good|right|ok(ay)?|appropriate|normal(ly)?|valid result)\b/i;
const TECH=/\b(api|json|sql|database|query|http|status code|dom|css|html|stack trace|endpoint|payload|null|exception|localstorage)\b/i;

const SC=[
{id:'e1',lvl:'Easy',name:'Add a drink to the cart',brief:'Rule REQ-01: a customer can add a drink to the cart and see its price. In the Brew & Go shop a flat white costs R32.00.',m:{id:'UAT-COF-001',title:'Customer can add a flat white to the cart',req:'REQ-01: A customer can add a drink to the cart and see its price',pre:'Customer is on the menu page and the cart is empty',data:'Drink: Flat white, Quantity: 1',path:'Happy path',steps:'1. Tap Flat white.\n2. Tap Add to cart.\n3. Open the cart.',exp:'The cart lists 1 x Flat white at R32.00 and the cart total shows R32.00.'}},
{id:'e2',lvl:'Easy',name:'Remove a drink from the cart',brief:'Rule REQ-02: a customer can remove a drink and the total updates. The cart holds 1 flat white (R32.00) and 1 muffin (R28.00).',m:{id:'UAT-COF-002',title:'Customer can remove a muffin from the cart',req:'REQ-02: Removing an item updates the cart total',pre:'Cart holds 1 flat white (R32.00) and 1 muffin (R28.00), total R60.00',data:'Item to remove: Muffin',path:'Happy path',steps:'1. Open the cart.\n2. Tap Remove next to Muffin.',exp:'The cart lists only 1 x Flat white and the total changes from R60.00 to R32.00.'}},
{id:'e3',lvl:'Easy',name:'Empty cart message',brief:'Rule REQ-03: an empty cart tells the customer it is empty and does not allow payment.',m:{id:'UAT-COF-003',title:'Empty cart shows a message and no Pay button',req:'REQ-03: An empty cart cannot be paid for',pre:'Customer is logged in and the cart is empty',data:'Items: none',path:'Edge case',steps:'1. Open the cart.\n2. Read the screen.',exp:'The message "Your cart is empty" appears and the Pay button is not shown.'}},
{id:'m1',lvl:'Medium',name:'Discount code works',brief:'Rule REQ-07: the code SAVE10 takes 10% off the cart total and shows "Code applied". The cart holds 1 medium cappuccino at R40.00.',m:{id:'UAT-COF-007',title:'Discount code SAVE10 reduces the total by 10%',req:'REQ-07: A valid code takes 10% off the cart total',pre:'Cart holds 1 medium cappuccino (R40.00)',data:'Code: SAVE10',path:'Happy path',steps:'1. Open the cart.\n2. Type SAVE10 in the code box.\n3. Tap Apply.',exp:'The total changes from R40.00 to R36.00 and the message "Code applied" appears.'}},
{id:'m2',lvl:'Medium',name:'Maximum quantity',brief:'Rule REQ-09: a customer may order 1 to 10 of a drink. 11 is refused with the message "Maximum 10 per order". A latte costs R45.00.',m:{id:'UAT-COF-009',title:'Customer cannot order 11 lattes',req:'REQ-09: A single order allows at most 10 of one drink',pre:'Customer is on the Latte page and the cart is empty',data:'Quantity: 11',path:'Edge case',steps:'1. Type 11 in the Quantity box.\n2. Tap Add to cart.',exp:'The message "Maximum 10 per order" appears and the cart stays empty (total R0.00).'}},
{id:'m3',lvl:'Medium',name:'Letters in the quantity box',brief:'Rule REQ-10: the quantity box only accepts whole numbers. Anything else shows "Enter a whole number" and nothing is added.',m:{id:'UAT-COF-010',title:'Quantity box refuses letters',req:'REQ-10: Quantity must be a whole number',pre:'Customer is on the Latte page and the cart is empty',data:'Quantity: abc',path:'Wrong input',steps:'1. Type abc in the Quantity box.\n2. Tap Add to cart.',exp:'The message "Enter a whole number" appears and the cart stays empty (total R0.00).'}},
{id:'h1',lvl:'Hard',name:'Code and loyalty discount together',brief:'Rule REQ-15: a valid code (SAVE10, 10%) is applied first, then the loyalty discount (5%) is applied to the reduced amount. The cart holds 2 large lattes at R45.00 each.',m:{id:'UAT-COF-015',title:'Code and loyalty discount are applied in the right order',req:'REQ-15: Code discount first, then 5% loyalty discount on the reduced amount',pre:'Customer is a loyalty member and the cart holds 2 large lattes (R45.00 each, R90.00)',data:'Code: SAVE10, Loyalty member: Yes',path:'Happy path',steps:'1. Open the cart.\n2. Type SAVE10 in the code box.\n3. Tap Apply.\n4. Read the total.',exp:'The total shows R76.95: R90.00 less 10% is R81.00, then less 5% is R76.95.'}},
{id:'h2',lvl:'Hard',name:'Free delivery at R150.00',brief:'Rule REQ-18: delivery costs R25.00, but is free when the cart is R150.00 or more. Test the line between the two.',m:{id:'UAT-COF-018',title:'Delivery is charged at R149.99 and free at R150.00',req:'REQ-18: Delivery is R25.00, free when the cart is R150.00 or more',pre:'Customer is logged in, delivery is chosen and the cart is empty',data:'Cart A: R149.99, Cart B: R150.00',path:'Edge case',steps:'1. Fill the cart to R149.99.\n2. Open checkout.\n3. Read the total.\n4. Change the cart to R150.00.\n5. Read the total again.',exp:'Cart A shows delivery R25.00 and total R174.99. Cart B shows delivery R0.00 and total R150.00.'}},
{id:'h3',lvl:'Hard',name:'Declined card, then retry',brief:'Rule REQ-20: a declined card creates no order and takes no money, and the stock is not reduced. Paying again with a good card creates exactly one order. Stock starts at 5 lattes.',m:{id:'UAT-COF-020',title:'Declined card creates no order and a retry creates exactly one',req:'REQ-20: A declined payment creates no order, takes no money and keeps stock; a retry creates one order',pre:'Cart holds 1 latte (R45.00) and stock shows 5 lattes',data:'Card 1: test card 4000 0000 0000 0002 (declined), Card 2: test card 4242 4242 4242 4242 (accepted)',path:'Wrong input',steps:'1. Open checkout.\n2. Tap Pay with Card 1.\n3. Read the message.\n4. Open My orders.\n5. Tap Pay again with Card 2.\n6. Open My orders.\n7. Read the stock.',exp:'After step 3 the message "Card declined" appears and after step 4 My orders is empty. After step 6 My orders shows exactly 1 order for R45.00 and after step 7 the stock is 4 lattes.'}}
];
const PAT={id:['Area, topic, number','UAT-COF-001'],title:['Customer can + action + object','Customer can order a large latte with oat milk'],req:['REQ-nn: the business rule it proves','REQ-04: Milk options change the price'],pre:['The starting state, with figures','Customer is logged in and the cart is empty'],data:['Exact values: Name: value','Size: Large, Milk: Oat, Quantity: 2'],path:['Happy, edge or wrong input','Edge case'],steps:['1. verb + one thing to do (one action per line)','1. Open the cart.  2. Type SAVE10 in the code box.  3. Tap Apply.'],exp:['What the user sees, with exact figures and exact words','Total shows R96.00 and the message "Code applied" appears']};
const figs=t=>(String(t).match(/R?\d+(?:\.\d+)?/g)||[]);
function scMark(r){const sc=SC.find(x=>x.id===r.scen);if(!sc)return null;const need=figs(sc.m.exp),have=figs(r.exp);const miss=need.filter(x=>!have.includes(x));return{sc,miss,ok:miss.length===0}}
function howBox(r){const sc=SC.find(x=>x.id===r.scen);const m=marks(r);const rows=[['id','Test case ID'],['title','Title'],['req','Requirement link'],['pre','Preconditions'],['data','Test data'],['path','Kind of path'],['steps','Steps'],['exp','Expected result']];
 const v=k=>k==='steps'?r.steps.split('\n').filter(x=>x.trim()).join(' / '):r[k];
 return `<h3>How it must be written</h3><div class="mute">${sc?'This is the model answer for the scenario "'+esc(sc.name)+'" ('+sc.lvl+'). Compare it with yours line by line.':'This is the pattern for every field, with a finished example. It is the same for an easy case or a hard one.'}</div>
 <div class="scroll"><table><tr><th>Field</th><th>Must be written like</th><th>${sc?'Model answer':'Example'}</th><th>You wrote</th></tr>${rows.map(([k,l])=>`<tr><td><b>${l}</b></td><td>${esc(PAT[k][0])}</td><td>${esc(sc?sc.m[k]:PAT[k][1]).replace(/\n/g,'<br>')}</td><td>${esc(v(k)||'(empty)')}</td></tr>`).join('')}</table></div>`+(sc?(()=>{const c=scMark(r);return `<div class="res ${c.ok?'ok':'warn'}" style="margin-top:6px"><b>${c.ok?'Your expected result has every exact figure the model has.':'Your expected result is missing these figures from the model: '+esc(c.miss.join(', '))+'.'}</b> The figures come from the business rule, so work them out before you test.</div>`})():'')}
/* the ten marks, each with the reason and the fix */
function marks(r){const lines=r.steps.split('\n').map(x=>x.trim()).filter(Boolean);const bad=lines.filter(l=>/\b(and then|, then| and (click|tap|press|type|enter|select|open|go|check|verify))\b/i.test(l));
 const andN=(r.title.match(/\band\b/gi)||[]).length;
 return[
 ['Unique ID like UAT-COF-001',/^[A-Z]{2,6}-[A-Z]{2,6}-\d{2,4}$/.test(r.id.trim()),'Use a code anyone can quote: area, topic, number, for example UAT-COF-001.'],
 ['Clear one-line title that names what is checked',r.title.trim().length>=15&&r.title.trim().length<=90&&/[a-z]/i.test(r.title),'Say what the customer can do or see, for example "Customer can order a large latte with oat milk".'],
 ['Links to a business requirement (REQ-..)',/REQ-?\d+/i.test(r.req)&&r.req.trim().length>=12,'Name the rule this proves, for example "REQ-04: Milk options change the price". No requirement means no reason to test.'],
 ['Preconditions: what is true before you start',r.pre.trim().length>=10,'Say the starting state, for example "Customer is logged in and the cart is empty".'],
 ['Exact test data',/\d|"|:/.test(r.data)&&r.data.trim().length>=5,'Write the exact values you type or pick, for example "Size: Large, Milk: Oat, Quantity: 2".'],
 ['Numbered steps, one action each (at least 2)',lines.length>=2&&bad.length===0&&lines.every(l=>l.length<=140),bad.length?'These steps do two things at once, split them: '+bad.map(b=>'"'+b+'"').join('; '):'Write at least two numbered steps, one action per line, so a stranger can follow them without asking you.'],
 ['Expected result has exact figures or exact words',/\d|"/.test(r.exp)&&!VAGUE.test(r.exp)&&r.exp.trim().length>=12,VAGUE.test(r.exp)?'"'+(r.exp.match(VAGUE)||[''])[0]+'" is not testable. Say exactly what you will see, for example "Total shows R96.00".':'Add the exact amount, text or message you should see.'],
 ['One idea only',andN<=1&&lines.length<=8&&!/\b(and|then)\b.*\b(pay|receipt|login|log in|checkout)\b.*\b(and|then)\b/i.test(r.title),'This title looks like several tests in one. "Order and pay and get a receipt" should be three cases.'],
 ['Written from the user side, no code words',!TECH.test(r.title+' '+r.steps+' '+r.exp),'Describe what the user sees and does. Replace technical words ('+((r.title+' '+r.steps+' '+r.exp).match(TECH)||[''])[0]+') with what appears on the screen.'],
 ['Kind of path chosen (happy, edge, wrong input)',['Happy path','Edge case','Wrong input'].includes(r.path),'Pick which of the three kinds of path this case covers.']]}
function fixIt(r){const log=[];let id=r.id.trim();
 if(!/^[A-Z]{2,6}-[A-Z]{2,6}-\d{2,4}$/.test(id)){const n=(id.match(/\d+/)||['1'])[0].padStart(3,'0');const nid='UAT-XXX-'+n;log.push('ID: "'+(id||'(empty)')+'" became "'+nid+'". Replace XXX with the area, for example COF for coffee.');id=nid}
 const raw=r.steps.split('\n').map(x=>x.trim().replace(/^\d+[.)]\s*/,'')).filter(Boolean);const steps=[];
 raw.forEach((l,i)=>{const parts=l.split(/\s*(?:,\s*then|\band then\b|\bthen\b|\band (?=(?:click|tap|press|type|enter|select|open|go|check|verify|read|pay)\b))\s*/i).filter(Boolean);
  const out=parts.map(p=>{let q=p.replace(TECHG,'[what the user sees on screen]');q=q.charAt(0).toUpperCase()+q.slice(1).replace(/[.]$/,'')+'.';return q});
  if(parts.length>1)log.push('Step '+(i+1)+' did '+parts.length+' things, so it became '+parts.length+' steps: '+out.map(x=>'"'+x+'"').join(', ')+'.');
  if(TECH.test(l))log.push('Step '+(i+1)+': the technical word "'+(l.match(TECH)||[''])[0]+'" became "[what the user sees on screen]". Say what appears, not how it is built.');
  out.forEach(x=>steps.push(x))});
 if(raw.length===1)log.push('Only one step was written. A stranger needs the start and the finish, so add the missing steps (open the page, do the action, read the result).');
 let exp=r.exp.trim();if(VAGUE.test(exp)){const w=exp.match(VAGUEG).map(x=>'"'+x+'"');exp=exp.replace(VAGUEG,'[exact result]');log.push('Expected result: '+[...new Set(w)].join(', ')+' cannot be tested, so it became "[exact result]". Replace it with the exact figure or message, for example "Total shows R96.00".')}
 else if(!/\d|"/.test(exp)&&exp)log.push('Expected result has no exact figure or quoted message. Add one, for example "Total shows R96.00".');
 if(TECH.test(exp)){exp=exp.replace(TECHG,'[what the user sees on screen]');log.push('Expected result: technical words became "[what the user sees on screen]".')}
 const need=(k,ph,why)=>{const v=(r[k]||'').trim();if(v.length>=(k==='data'?5:k==='req'?12:10)&&(k!=='req'||/REQ-?\d+/i.test(v))&&(k!=='data'||/\d|"|:/.test(v)))return v;log.push(why);return v?v+'  [fix: '+ph+']':'['+ph+']'};
 const req=need('req','REQ-nn: the business rule this proves','Requirement: it must start with REQ-nn and name the business rule, for example "REQ-04: Milk options change the price".');
 const pre=need('pre','the starting state, for example "Customer is logged in and the cart is empty"','Preconditions: say what must be true before step 1.');
 const data=need('data','exact values, for example "Size: Large, Quantity: 2"','Test data: write the exact values you use.');
 let title=r.title.trim();if(((title.match(/\band\b/gi))||[]).length>1)log.push('Title: it covers several ideas ("'+title+'"). Split it into one test case per idea.');
 if(title&&!/\b(can|cannot|can't|should|is|are|shows?|refuses?|reduces?|adds?|removes?|charges?|applies|accepts?|rejects?|creates?|updates?|blocks?|allows?|displays?|keeps?|sends?|stays?|changes?)\b/i.test(title))log.push('Title: start with who and what they can do, for example "Customer can '+title.charAt(0).toLowerCase()+title.slice(1)+'".');
 if(!r.path)log.push('Kind of path: choose happy path, edge case or wrong input.');
 return{id,title,steps,exp,req,pre,data,log}}
function improved(r){const c=fixIt(r);const m=marks(r);const todo=m.filter(x=>!x[1]).map(x=>x[2]);
 return `### ${c.id}: ${c.title||'(add a title)'}\n- **Requirement:** ${c.req}\n- **Precondition:** ${c.pre}\n- **Test data:** ${c.data}\n- **Path:** ${r.path||'[happy path, edge case or wrong input]'}\n\n**Steps**\n${c.steps.map((x,i)=>(i+1)+'. '+x).join('\n')||'1. [one action per line]'}\n\n**Expected:** ${c.exp||'[exact figures and words]'}\n**Actual:** (fill in while testing)\n**Status:** (Pass / Fail / Blocked)\n**Evidence:** (screenshot name, and the bug ID if it failed)`+(c.log.length?'\n\nCorrections made:\n'+c.log.map(x=>'- '+x).join('\n'):'\n\nNothing needed correcting.')+(todo.length?'\n\nStill to fix before this is professional:\n'+todo.map(x=>'- '+x).join('\n'):'')}
const md=r=>improved(r)+(r.locked?'\n\n**Actual (as run):** '+(r.act||'(not run)')+'\n**Status (as run):** '+(r.status||'(not run)')+(r.note?'\n**Evidence / bug:** '+r.note:''):'');
function form(r){r=r||{id:'',title:'',req:'',pre:'',data:'',path:'',steps:'',exp:''};
 const inp=(k,l,ph,h)=>`<label>${l}</label><input id="f-${k}" value="${esc(r[k])}" placeholder="${esc(ph)}"><div class="mute">Write it like: ${esc(PAT[k][0])}. Example: ${esc(PAT[k][1])}</div>${h?'<div class="mute">'+h+'</div>':''}`;
 return `<div class="card"><h2>${S.editing!==null?'Edit this test case':'Write a test case'}</h2><div class="mute">Write the expected result now, before you test. If you write it after, you tend to accept whatever the app shows. <button data-a="ex">Fill in the example</button></div>
 <label>Practise on a scenario, or write your own</label><select id="f-scen"><option value="">Write my own case</option>${['Easy','Medium','Hard'].map(l=>`<optgroup label="${l}">${SC.filter(x=>x.lvl===l).map(x=>`<option value="${x.id}" ${x.id===r.scen?'selected':''}>${x.name}</option>`).join('')}</optgroup>`).join('')}</select><div id="f-brief" class="res warn" style="display:${SC.find(x=>x.id===r.scen)?'block':'none'}">${esc((SC.find(x=>x.id===r.scen)||{}).brief||'')}</div>
 ${inp('id','Test case ID','UAT-COF-001')}${inp('title','Title','Customer can order a large latte with oat milk')}${inp('req','Requirement link','REQ-04: Milk options change the price')}${inp('pre','Preconditions','Customer is logged in and the cart is empty')}${inp('data','Test data','Size: Large, Milk: Oat, Quantity: 2')}
 <label>Kind of path</label><select id="f-path"><option value="">Choose...</option>${['Happy path','Edge case','Wrong input'].map(p=>`<option ${p===r.path?'selected':''}>${p}</option>`).join('')}</select><div class="mute">Write it like: ${esc(PAT.path[0])}. Example: ${esc(PAT.path[1])}</div><div class="mute">Happy: a normal order. Edge: quantity 0, the maximum, an expired code. Wrong input: letters typed in the quantity box.</div>
 <label>Steps (one action per line)</label><div class="mute">Write it like: ${esc(PAT.steps[0])}. Example: ${esc(PAT.steps[1])}</div><textarea id="f-steps" rows="4" placeholder="1. Open the cart&#10;2. Type SAVE10 in the code box&#10;3. Tap Apply">${esc(r.steps)}</textarea>
 <label>Expected result (exact figures)</label><div class="mute">Write it like: ${esc(PAT.exp[0])}. Example: ${esc(PAT.exp[1])}</div><input id="f-exp" value="${esc(r.exp)}" placeholder="Total shows R96.00 and a Code applied message appears">
 <div style="margin-top:10px"><button class="pri" data-a="save">${S.editing!==null?'Save changes':'Lock my plan and mark it'}</button> ${S.editing!==null?'<button data-a="cancel">Cancel</button>':''}</div><div id="f-msg" class="mute"></div></div>`}
function runBox(r,i){return r.locked?`<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px"><b>Now run it</b><div class="mute">Your expected result is locked. Do the steps in the practice app, then record what really happened.</div>
 <label>Actual result</label><input data-k="act" data-i="${i}" value="${esc(r.act||'')}" placeholder="Total showed R36.00 and Code applied appeared">
 <label>Status</label><select data-k="status" data-i="${i}"><option value="">Choose...</option>${['Pass','Fail','Blocked'].map(p=>`<option ${p===r.status?'selected':''}>${p}</option>`).join('')}</select><div class="mute">Pass: actual matches expected. Fail: it does not. Blocked: you could not run it at all.</div>
 <label>Evidence and notes</label><input data-k="note" data-i="${i}" value="${esc(r.note||'')}" placeholder="screenshot name, and the bug ID if it failed"></div>`:''}
function coverage(){const have=p=>S.items.some(r=>r.path===p);return `<div class="card"><h3>Coverage of your set</h3><div class="q">${['Happy path','Edge case','Wrong input'].map(p=>`<span class="${have(p)?'y':'n'}">${have(p)?'Covered: ':'Missing: '}${p}</span>`).join('')}</div><div class="mute">A professional set covers all three kinds of path.</div></div>`}
function list(){return S.items.length?S.items.map((r,i)=>{const m=marks(r);const n=m.filter(x=>x[1]).length;
 return `<div class="card"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag">${esc(r.path||'no path')}</span><span class="tag">marks ${n}/10</span>${r.status?`<span class="tag">${esc(r.status)}</span>`:''}</div><h3 style="margin-top:6px">${esc(r.id)} ${esc(r.title)}</h3>
 <div class="q">${m.map(([t,ok])=>`<span class="${ok?'y':'n'}">${ok?'Has: ':'Fix: '}${esc(t)}</span>`).join('')}</div>
 ${m.filter(x=>!x[1]).length?'<ul>'+m.filter(x=>!x[1]).map(x=>'<li class="mute">'+esc(x[2])+'</li>').join('')+'</ul>':'<div class="res ok" style="margin-top:6px"><b>Professional standard.</b> Every part is there.</div>'}
 <h3>Improved version of what you wrote</h3><pre>${esc(improved(r))}</pre>${howBox(r)}${runBox(r,i)}
 <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button data-a="edit" data-i="${i}">Edit</button><button data-a="copy" data-i="${i}">Copy</button><button data-a="del" data-i="${i}">Delete</button></div></div>`}).join(''):'<div class="card mute">No test cases yet. Press "Fill in the example" to see a finished one, then write your own.</div>'}
function render(){const done=S.items.filter(r=>marks(r).every(x=>x[1])).length;
 $('v').innerHTML=`<div class="card" style="border-left:4px solid #b38e52"><h2>Write a test case the way a professional UAT tester does</h2><div>UAT checks whether the app does what the <b>business</b> needs, not whether the code works. You write the case, lock your expected result, run it in a practice app, and this page marks it on ten points and shows you the improved version in full.</div><div class="cof">UAT is the café owner tasting the new menu item before it goes on the board. They are not checking the oven. They are asking whether a customer would be happy.</div><div class="mute">${S.items.length} case${S.items.length===1?'':'s'}, ${done} at professional standard.</div></div>
 <div class="two"><div>${form(S.editing!==null?S.items[S.editing]:null)}${coverage()}</div><div>${list()}${S.items.length?'<div class="card"><button data-a="copyall">Copy all test cases</button> <button data-a="dl">Download as a file</button></div>':''}</div></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.a==='ex'){const f={id:'id',title:'title',req:'req',pre:'pre',data:'data',steps:'steps',exp:'exp'};Object.keys(f).forEach(k=>{$('f-'+k).value=EX[k]});$('f-path').value=EX.path;return}
 if(d.a==='save'){const r={id:$('f-id').value,title:$('f-title').value,req:$('f-req').value,pre:$('f-pre').value,data:$('f-data').value,scen:$('f-scen').value,path:$('f-path').value,steps:$('f-steps').value,exp:$('f-exp').value};
  if(r.title.trim().length<4||r.steps.trim().length<4||r.exp.trim().length<4){$('f-msg').textContent='Add at least a title, steps and an expected result.';return}
  if(S.editing!==null){S.items[S.editing]=Object.assign(S.items[S.editing],r);S.editing=null}else{r.locked=Date.now();S.items.push(r)}save();render();window.scrollTo(0,0);return}
 if(d.a==='cancel'){S.editing=null;render();return}
 if(d.a==='edit'){S.editing=+d.i;render();window.scrollTo(0,0);return}
 if(d.a==='del'){if(confirm('Delete this test case?')){S.items.splice(+d.i,1);save();render()}return}
 const txt=()=>'# Test cases from the Practice Lab\n\n'+S.items.map(md).join('\n\n---\n\n');
 if(d.a==='copy'){navigator.clipboard&&navigator.clipboard.writeText(md(S.items[+d.i])).then(()=>{b.textContent='Copied'},()=>{b.textContent='Copy blocked by the browser'});return}
 if(d.a==='copyall'){navigator.clipboard&&navigator.clipboard.writeText(txt()).then(()=>{b.textContent='Copied'},()=>{b.textContent='Copy blocked by the browser'});return}
 if(d.a==='dl'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt()],{type:'text/markdown'}));a.download='practice-lab-test-cases.md';a.click();return}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='f-scen'){const sc=SC.find(x=>x.id===t.value);const b=$('f-brief');b.style.display=sc?'block':'none';b.textContent=sc?sc.brief:'';return}if(t.dataset&&t.dataset.k){S.items[+t.dataset.i][t.dataset.k]=t.value;save();if(t.dataset.k==='status')render()}});
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script><script src="tickets.js"></script><script src="ticketpanel.js"></script><script src="analogy.js"></script><script src="nav.js"></script><!--SYNC--><script src="sync.js"></script><!--/SYNC-->
