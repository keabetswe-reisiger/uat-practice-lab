<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinic Booking UAT Practice</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1f2430;--mute:#6b7280;--line:#e3ddd3;--brand:#5b3a29;--accent:#b08d57;--pass:#1b7f4b;--fail:#c0392b;--block:#b7791f;--pend:#8a8f98}
@media(prefers-color-scheme:dark){:root{--bg:#16181d;--card:#20242c;--ink:#eceff4;--mute:#9aa3b2;--line:#323844;--brand:#d9b38c}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{font-size:18px;margin:0;color:var(--brand)}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1400px;margin:auto}
@media(max-width:950px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.panel>h2{margin:0 0 2px;font-size:16px}.sub{color:var(--mute);font-size:13px;margin:0 0 10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 11px;border-radius:6px}
button.primary,.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
@media(prefers-color-scheme:dark){button.primary,.tabs button.on{color:#16181d}}
input,select,textarea{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.env{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.banner{padding:6px 10px;border-radius:6px;font-weight:700;font-size:13px;margin-bottom:8px}
.stg{background:#1b7f4b22;color:var(--pass)}.prod{background:#c0392b22;color:var(--fail)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}.kpi b{display:block;font-size:22px}
.msg{padding:7px 10px;border-radius:6px;margin-top:8px;font-size:14px}.err{background:#c0392b22;color:var(--fail)}.ok{background:#1b7f4b22;color:var(--pass)}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--ink)}
.tc{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px}
.tc h3{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;color:#fff;white-space:nowrap;height:fit-content}
.b-Pending{background:var(--pend)}.b-Pass{background:var(--pass)}.b-Fail{background:var(--fail)}.b-Blocked{background:var(--block)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.stat{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}.stat b{display:block;font-size:21px}
.tip{background:#b08d5722;border-left:3px solid var(--accent);padding:8px 10px;font-size:13px;border-radius:4px;margin-bottom:10px}
.key{background:var(--brand);color:#fff;padding:10px 12px;border-radius:8px;margin:10px 0;font-weight:600}
@media(prefers-color-scheme:dark){.key{color:#16181d}}
.scroll{max-height:76vh;overflow:auto;padding-right:4px}
.lock{opacity:.35;pointer-events:none}
</style>
<!--PWA--><meta name="theme-color" content="#0d0c0a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><!--/PWA-->
<!--BRAND--><link rel="stylesheet" href="brand.css"><!--/BRAND-->
</head>
<body>
<header><h1>🩺 Clinic Booking UAT Practice <small style="color:var(--mute);font-weight:400">· practice system + UAT workbook</small></h1><button id="reset">Reset workbook</button></header>
<main>

<!-- LEFT: SYSTEM UNDER TEST -->
<section class="panel">
  <h2>System under test: Sunrise Clinics booking platform (mock)</h2>
  <p class="sub">A made-up booking system for practice. Only the workbook is saved; this system resets when you refresh.</p>
  <div class="env">
    <div><label>Environment</label><select id="env"><option>Staging</option><option>Production</option><option>Dev</option></select></div>
    <div><label>Version</label><select id="ver"><option>v1</option><option selected>v2</option></select></div>
    <div><label>Logged in as</label><select id="role"><option value="Sipho|Manager">Sipho (Manager)</option><option value="Thabo|Doctor">Thabo (Doctor)</option><option value="Naledi|Doctor">Naledi (Doctor)</option></select></div>
  </div>
  <div id="banner"></div>
  <div id="app">
    <div class="tabs" id="nav"></div>
    <div id="screen"></div>
  </div>
</section>

<!-- RIGHT: WORKBOOK -->
<section class="panel">
  <h2>UAT workbook</h2>
  <p class="sub">Brief → pre-flight → test → report → sign off.</p>
  <div class="tabs" id="wtabs"></div>
  <div class="scroll" id="wview"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* =================== SYSTEM UNDER TEST (deliberate bugs, see answer key) =================== */
const BRANCHES=['Sandton','Soweto','Pretoria','Centurion','Midrand'];
const TYPES=['Adult','Child','Senior','Antenatal'];
const APPT_TYPES={Adult:['Check-up','Chronic review','Blood test'],Child:['Vaccination','Check-up'],Senior:['Check-up','Chronic review'],Antenatal:['Scan','Check-up']};
let patients=[
 {id:1,name:'Zanele Mokoena',type:'Adult',branch:'Sandton',who:'Thabo',status:'Active'},
 {id:2,name:'Baby Lwazi Nkosi',type:'Child',branch:'Soweto',who:'Naledi',status:'Active'},
 {id:3,name:'Gogo Martha Sithole',type:'Senior',branch:'Pretoria',who:'Thabo',status:'Active'},
 {id:4,name:'Palesa Molefe',type:'Antenatal',branch:'Centurion',who:'Naledi',status:'Active'},
 {id:5,name:'Johan van Wyk',type:'Adult',branch:'Midrand',who:'Naledi',status:'Active'},
 {id:6,name:'Zodwa Mokoena',type:'Adult',branch:'Sandton',who:'Thabo',status:'Active'}];
let appts=[
 {id:101,date:'2026-11-09',doctor:'Thabo',items:[{pid:1,type:'Check-up'}],status:'Confirmed'},
 {id:102,date:'2026-11-10',doctor:'Naledi',items:[{pid:2,type:'Vaccination'}],status:'Confirmed'},
 {id:103,date:'2026-11-11',doctor:'Thabo',items:[{pid:3,type:'Check-up'}],status:'Confirmed'}];
let log=[],draft=[],upcomingCache=3,freq='Monthly',screen='dashboard',nextAppt=104,nextPat=7,bellOpen=false;
const FREQ={Daily:[12,2,15,3],Weekly:[64,9,22,5],Monthly:[268,41,19,6],Quarterly:[790,118,21,6]};
const NOTES=[{t:'New appointment booked, awaiting confirmation',go:'diary'},{t:'Walk-in patient awaiting review',go:'patients'},{t:'Monthly report ready',go:'dashboard'}];
const me=()=>{const[n,r]=$('role').value.split('|');return{name:n,role:r}};
const pname=id=>patients.find(p=>p.id===id)?.name||'?';
const active=()=>appts.filter(a=>a.status!=='Cancelled');
const L=(msg)=>log.unshift(new Date().toLocaleTimeString()+' · '+me().name+' · '+msg);

function renderEnv(){
  const e=$('env').value;
  $('banner').innerHTML=`<div class="banner ${e==='Staging'?'stg':'prod'}">${e==='Staging'?'● STAGING · safe to test':e==='Production'?'● PRODUCTION · live patient data. Do NOT run UAT here':'● DEV · unstable, not for UAT'} · ${$('ver').value}</div>`;
  $('app').classList.toggle('lock',e==='Production');
}
function renderNav(){
  const tabs=[['dashboard','Dashboard'],['patients','Patients'],['book','Book appointment'],['diary','Diary']];
  if($('ver').value==='v2')tabs.push(['walkin','Walk-in add']);
  if(!tabs.some(t=>t[0]===screen))screen='dashboard';
  $('nav').innerHTML=tabs.map(([k,l])=>`<button data-go="${k}" class="${screen===k?'on':''}">${l}</button>`).join('')+
   `<button data-bell="1" style="margin-left:auto">🔔 ${NOTES.length}</button>`;
}
function renderScreen(){
  renderNav();
  const m=me();let h='';
  if(bellOpen)h+=`<div class="msg ok" style="margin-bottom:8px">${NOTES.map((n,i)=>`<div class="row"><span>${n.t}</span><button data-note="${i}">Open</button></div>`).join('')}</div>`;
  if(screen==='dashboard'){
    const k=FREQ[freq==='Weekly'?'Monthly':freq];                       // BUG D2: Weekly shows Monthly numbers
    h+=`<label>Frequency</label><select id="freq">${Object.keys(FREQ).map(f=>`<option ${f===freq?'selected':''}>${f}</option>`).join('')}</select>
    <div class="kpis"><div class="kpi"><b>${k[0]}</b>Appointments completed</div><div class="kpi"><b>${k[1]}</b>No-shows</div><div class="kpi"><b>${k[2]} min</b>Average wait</div><div class="kpi"><b>${k[3]}</b>Doctors on duty</div></div>
    <div class="row"><span>Upcoming appointments</span><b>${upcomingCache}</b></div>`;                // BUG D1: KPI suite shown to every role
    h+=`<h4 style="margin:12px 0 4px">Upcoming appointments (soonest first)</h4>`+
      [...active()].sort((a,b)=>a.date.localeCompare(b.date)).map(a=>`<div class="row"><span>${a.date} · ${a.items.map(i=>pname(i.pid)+' ('+i.type+')').join(', ')}</span><span>Dr ${a.doctor}</span></div>`).join('');
  }
  if(screen==='patients'){
    h+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px"><div><label>Search</label><input id="fs" value="${esc(fState.q)}"></div>
     <div><label>Branch</label><select id="fp"><option value="">All</option>${BRANCHES.map(p=>`<option ${fState.p===p?'selected':''}>${p}</option>`).join('')}</select></div>
     <div><label>Type</label><select id="ft"><option value="">All</option>${TYPES.map(p=>`<option ${fState.t===p?'selected':''}>${p}</option>`).join('')}</select></div></div>`;
    let list=patients.filter(f=>m.role==='Manager'||f.status!=='Pending Review');   // BUG F2: doctors not limited to their own patients
    list=list.filter(f=>(!fState.q||f.name.includes(fState.q))&&(!fState.p||f.branch===fState.p)&&(!fState.t||f.type===fState.t)); // BUG F1: search is case-sensitive
    h+=list.length?list.map(f=>`<div class="row"><span><b>${esc(f.name)}</b> · ${f.type} · ${f.branch}</span><span>${f.status==='Pending Review'?'<span class="tag">Unconfirmed</span> ':''}${f.who}</span></div>`).join(''):'<p class="sub">No patients found.</p>';
  }
  if(screen==='book'){
    const mine=patients.filter(f=>f.status==='Active'&&(m.role==='Manager'||f.who===m.name));
    h+=`${m.role==='Manager'?`<label>Doctor</label><select id="sa"><option>Thabo</option><option>Naledi</option></select>`:`<p class="sub">Booking for Dr ${m.name}</p>`}
     <label>Patient</label><select id="sf">${mine.map(f=>`<option value="${f.id}">${esc(f.name)} (${f.type})</option>`).join('')}</select>
     <label>Appointment type</label><select id="st"></select>
     <label>Date</label><input type="date" id="sd" value="${schedDate}">
     <div id="load" class="sub"></div>
     <div class="btns"><button id="addDraft">Add to booking list</button><button class="primary" id="submitSched">Submit bookings</button></div>
     <div id="schedMsg"></div>
     <h4 style="margin:10px 0 4px">Booking list</h4>${draft.length?draft.map((d,i)=>`<div class="row"><span>${esc(pname(d.pid))} · ${d.type}</span><button data-rmdraft="${i}">✕</button></div>`).join(''):'<p class="sub">Nothing added yet.</p>'}`;
  }
  if(screen==='diary'){
    const list=active().filter(a=>m.role==='Manager'||a.doctor===m.name);
    h+=list.length?list.map(a=>`<div class="tc"><div class="row" style="border:0"><b>#${a.id} · ${a.date}</b><span>Dr ${a.doctor} · <span class="tag">${a.status==='Pending Review'?'Pending Review · Unconfirmed':a.status}</span></span></div>
      <div>${a.items.map(i=>esc(pname(i.pid))+' ('+i.type+')').join(', ')} · ~${a.items.length*20} min</div>
      <div class="btns"><input type="date" value="${a.date}" id="ed${a.id}" style="width:auto"><button data-savedate="${a.id}">Save date</button><button data-cancel="${a.id}">Cancel appointment</button></div></div>`).join(''):'<p class="sub">No appointments in the diary.</p>';
    h+=`<h4 style="margin:10px 0 4px">Change log</h4>${log.length?log.map(l=>`<div class="sub" style="margin:0">${esc(l)}</div>`).join(''):'<p class="sub">No changes logged.</p>'}`;
  }
  if(screen==='walkin'){
    h+=`<div class="btns"><button id="qmap">🪪 Simulate ID scan</button></div>
     <label>Patient name *</label><input id="qn"><label>ID number</label><input id="qg" placeholder="auto-filled from ID scan">
     <label>Patient type *</label><select id="qt"><option value="">Select…</option>${TYPES.map(t=>`<option>${t}</option>`).join('')}</select>
     <label>Notes</label><textarea id="qno" rows="2"></textarea><div class="btns"><button class="primary" id="qsubmit">Submit</button></div><div id="qmsg"></div>`;
  }
  $('screen').innerHTML=h;
  if(screen==='book')fillTypes();
}
let fState={q:'',p:'',t:''},schedDate='';
function fillTypes(){const f=patients.find(x=>x.id==$('sf').value);if(!f)return;$('st').innerHTML=APPT_TYPES[f.type].map(t=>`<option>${t}</option>`).join('');updateLoad()}
function updateLoad(){const a=me().role==='Manager'?$('sa').value:me().name,d=$('sd').value;$('load').textContent=d?`Dr ${a} already has ${active().filter(x=>x.doctor===a&&x.date===d).length} appointment(s) on ${d}.`:''}
const docName=()=>me().role==='Manager'?$('sa').value:me().name;

document.addEventListener('click',e=>{
  const t=e.target,d=t.dataset||{};
  if(d.go){screen=d.go;bellOpen=false}
  else if(d.bell){bellOpen=!bellOpen}
  else if(d.note!==undefined){screen=NOTES[+d.note].go;bellOpen=false}
  else if(d.rmdraft!==undefined){draft.splice(+d.rmdraft,1)}
  else if(d.cancel){
    if(!confirm('Cancel this appointment?'))return;
    const a=appts.find(x=>x.id==d.cancel);a.status='Cancelled';L('Cancelled appointment #'+a.id);   // BUG R1: dashboard upcoming count not refreshed
  }
  else if(d.savedate){const a=appts.find(x=>x.id==d.savedate);a.date=$('ed'+a.id).value;}      // BUG R2: date change is not written to the change log
  else if(t.id==='addDraft'){
    const pid=+$('sf').value,type=$('st').value,date=$('sd').value;schedDate=date;
    if(draft.some(x=>x.pid===pid&&x.type===type)){renderScreen();$('schedMsg').innerHTML='<div class="msg err">Already in the booking list.</div>';return}
    draft.push({pid,type});
  }
  else if(t.id==='submitSched'){
    const date=$('sd').value;schedDate=date;
    if(!date){$('schedMsg').innerHTML='<div class="msg err">Please select a date.</div>';return}
    if(!draft.length){$('schedMsg').innerHTML='<div class="msg err">Add at least one patient.</div>';return}
    appts.push({id:nextAppt++,date,doctor:docName(),items:draft.slice(),status:'Confirmed'});   // BUG S3: should be saved as Pending Review
    upcomingCache++;draft=[];renderScreen();$('schedMsg').innerHTML='<div class="msg ok">Bookings submitted. Managers notified.</div>';return;
  }
  else if(t.id==='qmap'){$('qg').value=String(Math.floor(8000000000000+Math.random()*1999999999999));return}
  else if(t.id==='qsubmit'){
    const n=$('qn').value.trim(),ty=$('qt').value;
    if(!n){$('qmsg').innerHTML='<div class="msg err">Patient name is required.</div>';return}
    // BUG Q1: patient type is never checked, so it can be blank
    patients.push({id:nextPat++,name:n,type:ty||'Unknown',branch:'—',who:'Unassigned',status:'Pending Review'});
    $('qmsg').innerHTML='<div class="msg ok">Saved as Pending Review. Manager notified.</div>';return;
  }
  else return;
  renderScreen();
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='freq'){freq=e.target.value;renderScreen()}
  else if(id==='sf')fillTypes();
  else if(id==='sd'){schedDate=e.target.value;updateLoad()}
  else if(id==='sa')updateLoad();
  else if(id==='fp'){fState.p=e.target.value;renderScreen()}
  else if(id==='ft'){fState.t=e.target.value;renderScreen()}
  else if(id==='env'||id==='ver'||id==='role'){renderEnv();bellOpen=false;renderScreen()}
});
document.addEventListener('input',e=>{if(e.target.id==='fs'){fState.q=e.target.value;renderScreen();const i=$('fs');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});

/* =================== WORKBOOK =================== */
const BRIEF=[
 ['Purpose (why it exists)',[
  ['What problem does this solve?','Sunrise Family Clinics (a made-up group) books patients on paper and WhatsApp. This causes double-booked doctors, forgotten patients and slow reporting.'],
  ['Who are the users and what must they do?','Practice Managers: see how the clinics are running, book and reassign appointments, review walk-in patients. Doctors: see only their own patients and diary, book their own days, add walk-in patients.'],
  ['What does “working correctly” look like?','Managers get an at-a-glance dashboard. Doctors only see their own data. No appointment can be double-booked. New walk-ins and bookings are Unconfirmed until a manager reviews them. Every change is traceable.']]],
 ['Cycle (when)',[
  ['Which week are we in?','Week 2 of 3. Use the week selector below to practise how the answer changes.'],
  ['What was planned in Week 1?','Scope locked: Dashboard, Patients list, Book appointment, Diary, Walk-in add (new in v2). Acceptance criteria agreed with the Operations Owner.'],
  ['When is the build ready and feedback due?','Build is on Staging now (Monday of Week 2). Your feedback is due Friday of Week 3.'],
  ['A problem found late in Week 3?','Critical defects delay the release. Major and Minor defects move to the next cycle as known issues, unless the Product Owner decides otherwise.']]],
 ['Environments (where)',[
  ['Where do I test?','Staging only. Never Production (live patient data), never Dev (unstable). Check the banner before every session.'],
  ['Which version?','v2 on Staging. v2 adds Walk-in add. v1 is the current live version and does not have it.'],
  ['How close is Staging to Prod?','Same settings and roles; data is a small copy with 6 patients and 3 appointments. Accounts: Sipho (Manager), Thabo and Naledi (Doctors).'],
  ['For each test, what do I give and expect?','Each test case is an A × B pair: the input you give (A) and the result expected (B).']]],
 ['Sign-off (the tick ✓)',[
  ['Who approves before go-live?','The Sunrise Operations Owner (Product Owner).'],
  ['How do I report a failed test, and to whom?','Log a defect (title, severity, steps, expected vs actual) and send it to the Dev Lead. Failed tests are also visible in the sign-off summary.']]]
];
const TCS=[
 {id:'TC-01',title:'Staging is the active environment',req:'Env',role:'Any',input:['Look at the environment banner on the left.'],exp:'Banner reads STAGING and version v2.',bug:null},
 {id:'TC-02',title:'Manager sees KPI suite',req:'Dashboard',role:'Sipho',input:['Log in as Sipho (Manager).','Open Dashboard.'],exp:'KPI cards (completed, no-shows, average wait, doctors on duty) are visible.',bug:null},
 {id:'TC-03',title:'Doctor does not see the manager KPI suite',req:'Dashboard',role:'Thabo',input:['Log in as Thabo (Doctor).','Open Dashboard.'],exp:'Full KPI suite (completed, no-shows, average wait, doctors on duty) is NOT shown.',bug:'D1'},
 {id:'TC-04',title:'Weekly frequency shows weekly figures',req:'Dashboard',role:'Sipho',input:['Open Dashboard as Sipho.','Choose Weekly.'],exp:'Completed 64, no-shows 9, 22 min average wait, 5 doctors.',bug:'D2'},
 {id:'TC-05',title:'Notification opens related record',req:'Dashboard',role:'Sipho',input:['Click the 🔔 button.','Open “Walk-in patient awaiting review”.'],exp:'You land on the Patients screen.',bug:null},
 {id:'TC-06',title:'Search by patient name',req:'Patients',role:'Sipho',input:['Patients tab as Sipho.','Search “Mokoena”.'],exp:'Zanele Mokoena and Zodwa Mokoena only.',bug:null},
 {id:'TC-07',title:'Search is not case-sensitive',req:'Patients',role:'Sipho',input:['Patients tab as Sipho.','Search “mokoena” in lowercase.'],exp:'Zanele Mokoena and Zodwa Mokoena are found.',bug:'F1'},
 {id:'TC-08',title:'Filter by type',req:'Patients',role:'Sipho',input:['Patients tab as Sipho.','Type = Adult.'],exp:'Only Zanele Mokoena, Johan van Wyk and Zodwa Mokoena.',bug:null},
 {id:'TC-09',title:'Doctor sees only own patients',req:'Patients',role:'Thabo',input:['Log in as Thabo.','Open Patients.'],exp:'Only Zanele Mokoena, Gogo Martha Sithole, Zodwa Mokoena.',bug:'F2'},
 {id:'TC-10',title:'Valid appointment types per patient type',req:'Book',role:'Sipho',input:['Book appointment as Sipho.','Pick Baby Lwazi Nkosi (Child).'],exp:'Only Vaccination and Check-up are offered.',bug:null},
 {id:'TC-11',title:'Duplicate in the same booking list is blocked',req:'Book',role:'Sipho',input:['Book: Zodwa Mokoena, Check-up, add twice.'],exp:'Second add is refused.',bug:null},
 {id:'TC-12',title:'Double-booking of an existing appointment is blocked',req:'Book',role:'Sipho',input:['Doctor Thabo, Zanele Mokoena, Check-up, date 2026-11-09.','Add to list and Submit (this already exists as appointment #101).'],exp:'Submission refused: patient + appointment type + day already booked.',bug:'S1'},
 {id:'TC-13',title:'Date is required',req:'Book',role:'Sipho',input:['Add any patient to the list.','Leave date empty, Submit.'],exp:'“Please select a date.” and nothing saved.',bug:null},
 {id:'TC-14',title:'New booking is Pending Review / Unconfirmed',req:'Book',role:'Thabo',input:['As Thabo, book Gogo Martha Sithole, Check-up, 2026-11-13.','Submit and open Diary.'],exp:'Appointment shows status “Pending Review · Unconfirmed”.',bug:'S3'},
 {id:'TC-15',title:'Cancel removes appointment from Diary',req:'Diary',role:'Sipho',input:['Diary as Sipho.','Cancel appointment #102, confirm.'],exp:'#102 disappears from the Diary.',bug:null},
 {id:'TC-16',title:'Dashboard upcoming count updates after cancel',req:'Diary',role:'Sipho',input:['Note “Upcoming appointments” on Dashboard (3).','Cancel appointment #102.','Return to Dashboard.'],exp:'Upcoming appointments is now 2.',bug:'R1'},
 {id:'TC-17',title:'Changing a date is logged',req:'Diary',role:'Sipho',input:['Diary as Sipho.','Change appointment #101 date and Save date.'],exp:'Change log gets a new line with user, time and the change.',bug:'R2'},

  q:[['Provide “those responsible for handling and resolving reported defects with sufficient information to resolve the issue”',CTFL+', §5.5'],['A defect report typically includes a unique identifier, a title with a short summary, identification of the test object and test environment, the test steps that detected the anomaly, expected results and actual results, severity, priority, and references (for example to the test case).',CTFL+', §5.5 (paraphrase)']],
  how:'The defect form here drafts the title, steps and expected result. You add the actual result, set severity, and make sure someone else could repeat it.',rel:['sevpri','decoy']},
 sevpri:{h:'Severity vs priority, and release impact',
  say:'Severity is how bad the problem is for the user or system. Priority is how soon it should be fixed. They are related but different.',
  q:[['A defect report typically records both “Severity of the defect (degree of impact)” and “Priority to fix”.',CTFL+', §5.5 (paraphrase)']],
  web:'Web guides (Marker.io, Sauce Labs) describe severity as technical or user impact, usually judged by QA, and priority as urgency, usually set by the product or business owner. A low-severity bug can be high priority (a wrong logo just before launch), and the reverse. Typical triage questions: are users blocked, and is there a workaround? (Summarised from search results.)',
  tip:'In these apps: Critical = wrong money or stock numbers, a security or permission failure, or the feature is unusable. Major = a requirement broken but there is a workaround. Minor = small annoyance. The release-impact rule (Critical in Week 3 delays release) is this exercise’s rule, so confirm the real rule with your project.',
  how:'Choose the severity from the user’s point of view. The Release impact line then shows what the Week-3 rule means for that defect.',rel:['defect','exit']},
 decoy:{h:'Not every Fail is a defect',
  say:'Some things you report turn out to be correct behaviour, a misunderstanding, or a change request. Only mark Fail when the result differs from the written expectation.',
  q:[['reported anomalies “may turn out to be real defects or something else (e.g., false–positive result, change request)”',CTFL+', §5.5']],
  how:'The answer key shows “false alarms”. Many tests are designed to pass. Before you fail one, re-read the expected result and your steps.',rel:['defect']},
 exit:{h:'Sign-off = exit criteria and approval',
  say:'Testing ends when agreed conditions are met, and a named person formally approves the release based on your evidence.',
  q:[['“Exit criteria define what must be achieved to declare an activity completed.”',CTFL+', §5.1.3'],['“Running out of time or budget can also be viewed as valid exit criteria … if the stakeholders have reviewed and accepted the risk to go live without further testing.”',CTFL+', §5.1.3']],
  web:'Web guides describe sign-off as written confirmation from business representatives that they reviewed the results and accept the release, often in a short sign-off meeting. Typical exit conditions are: critical defects fixed and retested, planned tests run, and an agreed defect threshold. (aqua-cloud, University of Minnesota, Bird Eats Bug.)',
  how:'Your recommendation (Approve / Approve with known issues / Do not approve) goes to the approver named in the briefing. Cite test IDs and defect IDs. The approver decides; you provide the evidence. Answer the question “Does this do what the real user needs it to do?” for each user need.',rel:['sevpri','cycle']},
 cycle:{h:'The 3-week cycle and late defects',
  say:'A cycle has fixed weeks. Late findings force a trade-off between delaying the release and shipping with a known issue.',
  q:[['“Running out of time or budget can also be viewed as valid exit criteria … if the stakeholders have reviewed and accepted the risk”',CTFL+', §5.1.3']],
  tip:'Practical tip (not from the book): this is why the briefing asks what happens to a problem found late in Week 3. Agree the rule before testing starts, so severity is judged on the facts, not the deadline.',
  how:'Change the week selector and open Defects: the same defect has a different release impact in Week 3.',rel:['exit','sevpri']},
 resources:{h:'Sources and books',special:'resources'}
};
const TABMAP=CFG.tabs||{};
const css=`.lrn-dock{position:fixed;right:14px;bottom:14px;display:flex;gap:6px;z-index:50}
.lrn-dock button,.lrn-i{font:inherit;cursor:pointer;border:1px solid var(--line,#ccc);background:var(--card,#fff);color:var(--ink,#222);border-radius:99px;padding:6px 12px;box-shadow:0 2px 8px #0003}
.lrn-i{padding:0 7px;margin-left:6px;font-size:12px;box-shadow:none;height:fit-content;white-space:nowrap}
.lrn-ov{position:fixed;inset:0;background:#0007;z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.lrn-card{background:var(--card,#fff);color:var(--ink,#222);border:1px solid var(--line,#ccc);border-radius:12px;max-width:620px;width:100%;max-height:86vh;overflow:auto;padding:18px 20px;font:15px/1.5 system-ui,sans-serif}
.lrn-card h3{margin:0 0 6px;color:var(--brand,#5b3a29)}.lrn-card blockquote{margin:8px 0;padding:6px 10px;border-left:3px solid #b08d57;background:#b08d5714;font-size:14px}
.lrn-card cite{display:block;color:var(--mute,#666);font-size:12px;margin-top:2px;font-style:normal}
.lrn-card .lab{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute,#666);margin:12px 0 2px}
.lrn-card .box{background:var(--line,#eee);border-radius:8px;padding:8px 10px;font-size:14px}
.lrn-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.lrn-chips button,.lrn-x{font:inherit;cursor:pointer;border:1px solid var(--line,#ccc);background:var(--card,#fff);color:var(--ink,#222);border-radius:6px;padding:4px 10px}
.lrn-card a{color:var(--brand,#5b3a29)}`;
const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
const E=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function open(key,extra){
  const t=T[key];if(!t)return;
  let b=`<h3>${E(t.h)}</h3>`;
  if(t.special==='resources'){
    b+=`<div class="lab">Syllabi and articles</div>`+SOURCES.map(s=>`<p style="margin:6px 0"><a href="${s.u}" target="_blank" rel="noopener">${E(s.t)}</a><br><small>${E(s.n)}</small></p>`).join('')+
       `<div class="lab">Books (as cited by the ISTQB syllabi)</div>`+BOOKS.map(x=>`<p style="margin:6px 0"><b>${E(x[1])}</b> (${x[2]}) by ${E(x[0])}${x[3]?', '+x[3]:''}<br><small>${E(x[4])}</small></p>`).join('')+
       `<p class="sub" style="font-size:12px">Quotes in the pop-ups come from the two ISTQB syllabi. Web articles were summarised, not quoted. Practical-tip boxes are the author’s own advice.</p>`;
  }else{
    b+=`<p>${E(t.say)}</p>`;
    if(t.q&&t.q.length)b+=`<div class="lab">From the source</div>`+t.q.map(([q,c])=>`<blockquote>${E(q)}<cite>${E(c)}</cite></blockquote>`).join('');
    if(t.web)b+=`<div class="lab">From web guides</div><div class="box">${E(t.web)}</div>`;
    if(t.tip)b+=`<div class="lab">${t.tip.startsWith('Practical')?'Practical tip':'Note'}</div><div class="box">${E(t.tip)}</div>`;
    b+=`<div class="lab">How it applies in this app</div><p style="margin:0">${E(t.how)}</p>`;
    if(extra)b+=`<div class="lab">This test</div><div class="box">${E(extra)}</div>`;
    const rel=(t.rel||[]).concat(['resources']);
    b+=`<div class="lrn-chips">${rel.map(r=>`<button data-lrn="${r}">${E(T[r].h.split(' (')[0])}</button>`).join('')}</div>`;
  }
  b+=`<div style="text-align:right;margin-top:14px"><button class="lrn-x" data-lrnx="1">Close</button></div>`;
  const old=document.querySelector('.lrn-ov');if(old)old.remove();
  const ov=document.createElement('div');ov.className='lrn-ov';ov.innerHTML=`<div class="lrn-card" role="dialog" aria-modal="true">${b}</div>`;document.body.appendChild(ov);
  ov.querySelector('.lrn-x,.lrn-chips button')&&ov.querySelector('.lrn-x').focus();
}
const close=()=>{const o=document.querySelector('.lrn-ov');if(o)o.remove()};
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest&&t.closest('[data-lrnx]'))return close();
  if(t.classList&&t.classList.contains('lrn-ov'))return close();
  const k=t.closest&&t.closest('[data-lrn]');
  if(k){e.stopPropagation();e.preventDefault();return open(k.dataset.lrn)}
  const q=t.closest&&t.closest('[data-lrntc]');
  if(q){e.stopPropagation();e.preventDefault();const id=q.dataset.lrntc,tc=(CFG.tests||{})[id];if(tc)open(tc.k,tc.note)}
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
const dock=document.createElement('div');dock.className='lrn-dock';
dock.innerHTML='<button data-lrnstep="1">ⓘ About this step</button><button data-lrn="resources">📚 Sources</button>';document.body.appendChild(dock);
dock.querySelector('[data-lrnstep]').addEventListener('click',e=>{e.stopPropagation();const tab=(CFG.getTab&&CFG.getTab())||'';open(TABMAP[tab]||'uat')});
if(CFG.tests){
  const decorate=()=>{document.querySelectorAll('.tc h3').forEach(h=>{
    if(h.querySelector('[data-lrntc]'))return;const m=h.textContent.trim().match(/^(TC-\d+)/);
    if(m&&CFG.tests[m[1]]){const b=document.createElement('button');b.type='button';b.className='lrn-i';b.dataset.lrntc=m[1];b.title='How this test works';b.textContent='ⓘ technique';h.appendChild(b)}})};
  new MutationObserver(decorate).observe(document.body,{childList:true,subtree:true});decorate();
}
})();

/* Phone support: App/Workbook switch on narrow screens + service worker registration. */
(function(){
const css=`@media(max-width:950px){
 body{font-size:16px}input,select,textarea{font-size:16px!important}button{min-height:38px}
 main{padding:10px!important;gap:10px!important;padding-bottom:84px!important}
 .mob-bar{position:sticky;top:0;z-index:40;display:flex;gap:6px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
 .mob-bar button{flex:1;font-weight:600}.mob-bar button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
 .scroll{max-height:none!important}.lrn-dock{bottom:10px;right:10px}.lrn-dock button{padding:9px 14px}
 header h1 small{display:none}
}
@media(max-width:600px){.env{grid-template-columns:1fr!important}}
@media(min-width:951px){.mob-bar{display:none}}
@media(max-width:950px) and (prefers-color-scheme:dark){.mob-bar button.on{color:#16181d}}`;
const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
const panels=document.querySelectorAll('main > .panel');
if(panels.length===2){
  const bar=document.createElement('div');bar.className='mob-bar';
  bar.innerHTML='<button data-p="0">1 · App to test</button><button data-p="1">2 · Workbook</button>';
  document.querySelector('header').after(bar);
  let cur=0;try{cur=+sessionStorage.getItem('mobpanel')||0}catch{}
  const show=i=>{cur=i;panels.forEach((p,k)=>{p.style.display=window.matchMedia('(max-width:950px)').matches&&k!==i?'none':''});
    bar.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===i));try{sessionStorage.setItem('mobpanel',i)}catch{};window.scrollTo(0,0)};
  bar.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(+b.dataset.p)});
  window.matchMedia('(max-width:950px)').addEventListener('change',()=>show(cur));
  show(cur);
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

</script>
