<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SQL Academy | UAT Lab</title>
<meta name="theme-color" content="#11203b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="sqa.css"><!--BRAND--><link rel="stylesheet" href="brand.css"><!--/BRAND-->
</head><body>
<main><h2 class="pt">Your SQL path</h2><div id="intro"></div>
<div class="card"><h2 style="margin-top:0">Your progress</h2><div class="grid" id="prog"></div></div>
<h2>The nine modules</h2><div class="grid" id="mods"></div>
<h2>More practice</h2><div class="grid" id="tiles"></div></main>
<script src="sql-wasm.js"></script><script src="sqa-dbs.js"></script><script src="sqa-lessons-a.js"></script><script src="sqa-lessons-b.js"></script><script src="sqa-lessons-c.js"></script><script src="sqa-gym-coffee.js"></script><script src="sqa-gym-farm.js"></script><script src="sqa-gym-hr.js"></script><script src="sqa-gym-library.js"></script><script src="sqa-exam-bank.js"></script><script src="sqa-challenges.js"></script><script src="sqa-doctor.js"></script><script src="sqa-projects.js"></script><script src="sqa-schema-data.js"></script><script src="sqa-mods.js"></script><script src="sqa-core.js"></script>
<script>
SA.frame('sqa-home.html');const $=SA.$,esc=SA.esc,M=window.SQAMODS,st=SA.state();
$('intro').innerHTML=SA.startHere({plain:'SQL Academy takes you from your first SELECT to window functions, indexes and transactions, in nine modules. Each module has lessons you can run in your browser, practice the computer marks, and a ten-question checkpoint. Everything also works offline once it has loaded.',coffee:'Like learning every job in a coffee shop in a sensible order: first the till, then the stockroom, then the month-end books. Each module ends with a short check before you move on.',example:'SELECT name, price FROM products WHERE price > 35;',exampleNote:'Your first query: the name and price of every product over R35.',steps:['Open Module 1 and read its overview.','Do the lessons in order. Press Run on each worked example.','Solve the practice exercises.','Take the checkpoint. Eight right out of ten passes.'],glossary:[['SQL','The language used to ask a database questions and to change its data.'],['Module','A group of lessons on one topic, with practice and a checkpoint.'],['Checkpoint','Ten questions at the end of a module. You need 8 right.']]})
 +'<p class="mute">New to SQL? The eight short lessons and Data Detective cases in the <a href="sql-lab.html#learn">SQL lab</a> are a gentle warm-up. This academy goes much deeper and does not repeat them.</p>';
const done=M.filter(m=>{const p=SQA.progress(m,st);return p.have>=p.need}).length;
const projDone=window.PROJECTS.reduce((a,p)=>a+p.steps.filter(s=>(SA.get('proj',s.id)||{}).ok).length,0),projAll=window.PROJECTS.reduce((a,p)=>a+p.steps.length,0);
const stats=[['Modules finished',done,M.length],['Lessons done',SA.count('lessons'),window.LESSONS.length],['Gym questions solved',SA.count('gym'),window.GYM.length],['Case-study steps',projDone,projAll]];
$('prog').innerHTML=stats.map(s=>'<div><b>'+s[1]+' of '+s[2]+'</b><div class="bar" style="margin:4px 0"><i style="width:'+(100*s[1]/s[2])+'%"></i></div><span class="mute">'+s[0]+'</span></div>').join('');
$('mods').innerHTML=M.map(m=>{const p=SQA.progress(m,st);return '<a class="tile" href="'+m.href+'"><b>'+m.id+'. '+esc(m.title)+'</b><span class="tag '+m.level+'">'+m.level+'</span> <span class="tag">about '+m.hours+' h</span><div class="mute" style="margin:6px 0">'+p.lesN+' lessons, '+p.exN+' exercises, checkpoint</div><div class="bar"><i style="width:'+Math.round(100*p.have/p.need)+'%"></i></div><span class="mute">'+p.have+' of '+p.need+' steps</span></a>'}).join('');
$('tiles').innerHTML=[['sqa-gym.html','Practice gym',window.GYM.length+' graded questions on coffee, farm, HR and library data.'],['sqa-projects.html','Case studies','Three business projects with a note to the owner at the end.'],['sqa-exam.html','Interview prep',window.EXAM.length+' questions, a timed 40-question mock and timed SQL challenges.'],['sqa-doctor.html','Query doctor','Repair broken and slow queries and read the query plan.'],['sqa-schema.html','Schema lab','Split a messy sheet into clean tables and write the CREATE TABLE statements.'],['sqa-cheatsheet.html','Cheatsheet','One printable page of the shapes you use most.'],['sqa-career.html','Career and income','What employers test, and honest notes on earning from SQL.']].map(t=>'<a class="tile" href="'+t[0]+'"><b>'+t[1]+'</b><span class="mute">'+t[2]+'</span></a>').join('');
</script><script src="nav.js"></script><!--SYNC--><script src="sync.js"></script><!--/SYNC-->
</body></html>
